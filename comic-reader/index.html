003c/text>\n\n  \u003c!-- 阶段标签 -->\n  \u003crect x=\"60\" y=\"90\" width=\"120\" height=\"28\" rx=\"14\" fill=\"#63B3ED\"/>\u003ctext x=\"120\" y=\"109\" text-anchor=\"middle\" class=\"flow-config-steps-phase\">阶段一：环境\u003c/text>\n  \u003crect x=\"60\" y=\"290\" width=\"120\" height=\"28\" rx=\"14\" fill=\"#68D391\"/>\u003ctext x=\"120\" y=\"309\" text-anchor=\"middle\" class=\"flow-config-steps-phase\">阶段二：骨架\u003c/text>\n  \u003crect x=\"60\" y=\"560\" width=\"120\" height=\"28\" rx=\"14\" fill=\"#B794F4\"/>\u003ctext x=\"120\" y=\"579\" text-anchor=\"middle\" class=\"flow-config-steps-phase\">阶段三：连通\u003c/text>\n\n  \u003c!-- Step 1 -->\n  \u003cg>\n    \u003crect x=\"230\" y=\"84\" width=\"480\" height=\"52\" rx=\"10\" fill=\"#fff\" stroke=\"#63B3ED\" stroke-width=\"2.5\"/>\n    \u003ccircle cx=\"258\" cy=\"110\" r=\"14\" fill=\"#63B3ED\"/>\u003ctext x=\"258\" y=\"115\" text-anchor=\"middle\" class=\"flow-config-steps-phase\">1\u003c/text>\n    \u003ctext x=\"282\" y=\"104\" class=\"flow-config-steps-step\">检查 Node.js 版本 ≥ 16.14（建议 18+）\u003c/text>\n    \u003ctext x=\"282\" y=\"124\" class=\"flow-config-steps-mono\">node -v　→　v18.19.0 ✔\u003c/text>\n  \u003c/g>\n  \u003cpath d=\"M 470 136 L 470 160\" class=\"flow-config-steps-arrow\"/>\n\n  \u003c!-- Step 2 -->\n  \u003cg>\n    \u003crect x=\"230\" y=\"162\" width=\"480\" height=\"64\" rx=\"10\" fill=\"#fff\" stroke=\"#63B3ED\" stroke-width=\"2.5\"/>\n    \u003ccircle cx=\"258\" cy=\"194\" r=\"14\" fill=\"#63B3ED\"/>\u003ctext x=\"258\" y=\"199\" text-anchor=\"middle\" class=\"flow-config-steps-phase\">2\u003c/text>\n    \u003ctext x=\"282\" y=\"188\" class=\"flow-config-steps-step\">安装 pnpm（任选其一）\u003c/text>\n    \u003ctext x=\"282\" y=\"206\" class=\"flow-config-steps-mono\">npm i -g pnpm　|　corepack enable\u003c/text>\n    \u003ctext x=\"282\" y=\"220\" class=\"flow-config-steps-desc\">版本不一致？用 packageManager 字段 + Corepack 锁定\u003c/text>\n  \u003c/g>\n  \u003cpath d=\"M 470 226 L 470 252\" class=\"flow-config-steps-arrow\"/>\n\n  \u003c!-- Step 3 -->\n  \u003cg>\n    \u003crect x=\"230\" y=\"254\" width=\"480\" height=\"66\" rx=\"10\" fill=\"#fff\" stroke=\"#68D391\" stroke-width=\"2.5\"/>\n    \u003ccircle cx=\"258\" cy=\"287\" r=\"14\" fill=\"#68D391\"/>\u003ctext x=\"258\" y=\"292\" text-anchor=\"middle\" class=\"flow-config-steps-phase\">3\u003c/text>\n    \u003ctext x=\"282\" y=\"280\" class=\"flow-config-steps-step\">创建工作区：pnpm-workspace.yaml\u003c/text>\n    \u003ctext x=\"282\" y=\"298\" class=\"flow-config-steps-mono\">packages: ['apps/*', 'packages/*']\u003c/text>\n    \u003ctext x=\"282\" y=\"313\" class=\"flow-config-steps-desc\">同时建根 package.json（private: true）+ .npmrc + tsconfig.base.json\u003c/text>\n  \u003c/g>\n  \u003cpath d=\"M 470 320 L 470 346\" class=\"flow-config-steps-arrow\"/>\n\n  \u003c!-- Step 4 -->\n  \u003cg>\n    \u003crect x=\"230\" y=\"348\" width=\"480\" height=\"66\" rx=\"10\" fill=\"#fff\" stroke=\"#68D391\" stroke-width=\"2.5\"/>\n    \u003ccircle cx=\"258\" cy=\"381\" r=\"14\" fill=\"#68D391\"/>\u003ctext x=\"258\" y=\"386\" text-anchor=\"middle\" class=\"flow-config-steps-phase\">4\u003c/text>\n    \u003ctext x=\"282\" y=\"374\" class=\"flow-config-steps-step\">按职责建包：apps/ 放应用，packages/ 放共享库\u003c/text>\n    \u003ctext x=\"282\" y=\"392\" class=\"flow-config-steps-mono\">apps/web　apps/api　packages/{types,utils,ui}\u003c/text>\n    \u003ctext x=\"282\" y=\"407\" class=\"flow-config-steps-desc\">每个包独立 package.json，name 统一 @scope/ 前缀\u003c/text>\n  \u003c/g>\n  \u003cpath d=\"M 470 414 L 470 440\" class=\"flow-config-steps-arrow\"/>\n\n  \u003c!-- Step 5 -->\n  \u003cg>\n    \u003crect x=\"230\" y=\"442\" width=\"480\" height=\"66\" rx=\"10\" fill=\"#fff\" stroke=\"#B794F4\" stroke-width=\"2.5\"/>\n    \u003ccircle cx=\"258\" cy=\"475\" r=\"14\" fill=\"#B794F4\"/>\u003ctext x=\"258\" y=\"480\" text-anchor=\"middle\" class=\"flow-config-steps-phase\">5\u003c/text>\n    \u003ctext x=\"282\" y=\"468\" class=\"flow-config-steps-step\">用 workspace:* 声明包间依赖\u003c/text>\n    \u003ctext x=\"282\" y=\"486\" class=\"flow-config-steps-mono\">\"@tutorial/ui\": \"workspace:*\"\u003c/text>\n    \u003ctext x=\"282\" y=\"501\" class=\"flow-config-steps-desc\">永远解析本地版本；发布时自动替换为真实版本号\u003c/text>\n  \u003c/g>\n  \u003cpath d=\"M 470 508 L 470 534\" class=\"flow-config-steps-arrow\"/>\n\n  \u003c!-- Step 6 -->\n  \u003cg>\n    \u003crect x=\"230\" y=\"536\" width=\"480\" height=\"66\" rx=\"10\" fill=\"#fff\" stroke=\"#B794F4\" stroke-width=\"2.5\"/>\n    \u003ccircle cx=\"258\" cy=\"569\" r=\"14\" fill=\"#B794F4\"/>\u003ctext x=\"258\" y=\"574\" text-anchor=\"middle\" class=\"flow-config-steps-phase\">6\u003c/text>\n    \u003ctext x=\"282\" y=\"562\" class=\"flow-config-steps-step\">根目录 pnpm install 一次装完，验证连通\u003c/text>\n    \u003ctext x=\"282\" y=\"580\" class=\"flow-config-steps-mono\">pnpm install &amp;&amp; pnpm --filter @tutorial/web dev\u003c/text>\n    \u003ctext x=\"282\" y=\"595\" class=\"flow-config-steps-desc\">成功标志：web 能 import ui/utils/types，无 E404\u003c/text>\n  \u003c/g>\n  \u003cpath d=\"M 470 602 L 470 628\" class=\"flow-config-steps-arrow\"/>\n\n  \u003c!-- 完成 -->\n  \u003crect x=\"230\" y=\"630\" width=\"480\" height=\"54\" rx=\"27\" fill=\"#2F855A\"/>\n  \u003ctext x=\"470\" y=\"653\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#fff\">✔ Monorepo 就绪\u003c/text>\n  \u003ctext x=\"470\" y=\"673\" text-anchor=\"middle\" font-size=\"11\" fill=\"#C6F6D5\">下一步：接构建（docs/05）· 版本发布（docs/06）· CI/CD（docs/07）\u003c/text>\n\n  \u003c!-- 侧边：常见失败分支 -->\n  \u003cg>\n    \u003crect x=\"736\" y=\"254\" width=\"126\" height=\"120\" rx=\"10\" fill=\"#FFF5F5\" stroke=\"#FC8181\" stroke-width=\"2\"/>\n    \u003ctext x=\"799\" y=\"276\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" fill=\"#C53030\">常见坑\u003c/text>\n    \u003ctext x=\"799\" y=\"296\" text-anchor=\"middle\" class=\"flow-config-steps-desc\">E404 → 检查\u003c/text>\n    \u003ctext x=\"799\" y=\"312\" text-anchor=\"middle\" class=\"flow-config-steps-desc\">workspace 范围\u003c/text>\n    \u003ctext x=\"799\" y=\"332\" text-anchor=\"middle\" class=\"flow-config-steps-desc\">幽灵依赖 →\u003c/text>\n    \u003ctext x=\"799\" y=\"348\" text-anchor=\"middle\" class=\"flow-config-steps-desc\">显式声明\u003c/text>\n    \u003ctext x=\"799\" y=\"366\" text-anchor=\"middle\" class=\"flow-config-steps-desc\">版本漂移 → lock\u003c/text>\n  \u003c/g>\n  \u003cpath d=\"M 710 381 L 736 322\" stroke=\"#FC8181\" stroke-width=\"2\" stroke-dasharray=\"5,4\" fill=\"none\"/>\n\n  \u003c!-- 底部图例 -->\n  \u003cg transform=\"translate(140,730)\">\n    \u003crect x=\"0\" y=\"-14\" width=\"18\" height=\"18\" rx=\"4\" fill=\"#fff\" stroke=\"#63B3ED\" stroke-width=\"2.5\"/>\u003ctext x=\"26\" y=\"0\" class=\"flow-config-steps-desc\">环境准备\u003c/text>\n    \u003crect x=\"130\" y=\"-14\" width=\"18\" height=\"18\" rx=\"4\" fill=\"#fff\" stroke=\"#68D391\" stroke-width=\"2.5\"/>\u003ctext x=\"156\" y=\"0\" class=\"flow-config-steps-desc\">骨架搭建\u003c/text>\n    \u003crect x=\"260\" y=\"-14\" width=\"18\" height=\"18\" rx=\"4\" fill=\"#fff\" stroke=\"#B794F4\" stroke-width=\"2.5\"/>\u003ctext x=\"286\" y=\"0\" class=\"flow-config-steps-desc\">依赖连通\u003c/text>\n    \u003crect x=\"390\" y=\"-14\" width=\"18\" height=\"18\" rx=\"4\" fill=\"#FFF5F5\" stroke=\"#FC8181\" stroke-width=\"2\"/>\u003ctext x=\"416\" y=\"0\" class=\"flow-config-steps-desc\">失败排查\u003c/text>\n  \u003c/g>\n  \u003ctext x=\"440\" y=\"790\" text-anchor=\"middle\" class=\"flow-config-steps-desc\">全程约 10 分钟 · 每一步失败都先查 pnpm-workspace.yaml 的 packages 匹配范围\u003c/text>\n\u003c/svg>\n","kind":"diagram","title":"图解 · 从零配置 6 步流程"},"flow-dev-workflow":{"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 780\" data-scope=\"flow-dev-workflow\">\n  \u003cstyle> [data-scope=\"flow-dev-workflow\"] text { font-family: -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif; } [data-scope=\"flow-dev-workflow\"] .flow-dev-workflow-ttl { font-size: 22px; font-weight: bold; fill: #2D3748; } [data-scope=\"flow-dev-workflow\"] .flow-dev-workflow-lane { font-size: 13px; font-weight: bold; fill: #2D3748; } [data-scope=\"flow-dev-workflow\"] .flow-dev-workflow-box { font-size: 12px; font-weight: bold; fill: #2D3748; } [data-scope=\"flow-dev-workflow\"] .flow-dev-workflow-desc { font-size: 10.5px; fill: #4A5568; } [data-scope=\"flow-dev-workflow\"] .flow-dev-workflow-mono { font-family: \"SF Mono\", Menlo, monospace; font-size: 10.5px; fill: #2B6CB0; } [data-scope=\"flow-dev-workflow\"] .flow-dev-workflow-arrow { stroke: #2D3748; stroke-width: 2.5; fill: none; marker-end: url(#flow-dev-workflow-ar2); } [data-scope=\"flow-dev-workflow\"] .flow-dev-workflow-loop { stroke: #ED8936; stroke-width: 2.5; fill: none; stroke-dasharray: 7,5; marker-end: url(#flow-dev-workflow-ar3); }\n  \u003c/style>\n  \u003cdefs>\n    \u003cmarker id=\"flow-dev-workflow-ar2\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"4\" orient=\"auto\">\u003cpolygon points=\"0 0,10 4,0 8\" fill=\"#2D3748\"/>\u003c/marker>\n    \u003cmarker id=\"flow-dev-workflow-ar3\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"4\" orient=\"auto\">\u003cpolygon points=\"0 0,10 4,0 8\" fill=\"#ED8936\"/>\u003c/marker>\n  \u003c/defs>\n\n  \u003crect width=\"880\" height=\"780\" fill=\"#F7FAFC\"/>\n  \u003ctext x=\"440\" y=\"40\" text-anchor=\"middle\" class=\"flow-dev-workflow-ttl\">Monorepo 开发工作流示意图\u003c/text>\n  \u003ctext x=\"440\" y=\"64\" text-anchor=\"middle\" class=\"flow-dev-workflow-desc\">本地开发 → 提交 → CI 校验 → 自动发布 · 对应 docs/06-versioning.md 与 docs/07-ci-cd.md\u003c/text>\n\n  \u003c!-- 泳道背景 -->\n  \u003crect x=\"40\" y=\"90\" width=\"800\" height=\"150\" rx=\"12\" fill=\"#EBF4FA\"/>\n  \u003crect x=\"40\" y=\"260\" width=\"800\" height=\"150\" rx=\"12\" fill=\"#F0FFF4\"/>\n  \u003crect x=\"40\" y=\"430\" width=\"800\" height=\"150\" rx=\"12\" fill=\"#FAF5FF\"/>\n  \u003crect x=\"40\" y=\"600\" width=\"800\" height=\"140\" rx=\"12\" fill=\"#FFFAF0\"/>\n  \u003ctext x=\"60\" y=\"116\" class=\"flow-dev-workflow-lane\">① 本地开发\u003c/text>\n  \u003ctext x=\"60\" y=\"286\" class=\"flow-dev-workflow-lane\">② 提交变更\u003c/text>\n  \u003ctext x=\"60\" y=\"456\" class=\"flow-dev-workflow-lane\">③ CI 校验\u003c/text>\n  \u003ctext x=\"60\" y=\"626\" class=\"flow-dev-workflow-lane\">④ 自动发布\u003c/text>\n\n  \u003c!-- 泳道1：本地开发 -->\n  \u003cg>\n    \u003crect x=\"70\" y=\"140\" width=\"150\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#63B3ED\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"145\" y=\"168\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">改代码\u003c/text>\n    \u003ctext x=\"145\" y=\"188\" text-anchor=\"middle\" class=\"flow-dev-workflow-mono\">apps/web + ui\u003c/text>\n    \u003crect x=\"280\" y=\"140\" width=\"180\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#63B3ED\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"370\" y=\"162\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">本地联调\u003c/text>\n    \u003ctext x=\"370\" y=\"182\" text-anchor=\"middle\" class=\"flow-dev-workflow-mono\">pnpm --filter web dev\u003c/text>\n    \u003ctext x=\"370\" y=\"198\" text-anchor=\"middle\" class=\"flow-dev-workflow-desc\">改动实时生效，无需发包\u003c/text>\n    \u003crect x=\"520\" y=\"140\" width=\"170\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#63B3ED\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"605\" y=\"168\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">跑测试\u003c/text>\n    \u003ctext x=\"605\" y=\"188\" text-anchor=\"middle\" class=\"flow-dev-workflow-mono\">pnpm -r test\u003c/text>\n  \u003c/g>\n  \u003cpath d=\"M 220 175 L 280 175\" class=\"flow-dev-workflow-arrow\"/>\n  \u003cpath d=\"M 460 175 L 520 175\" class=\"flow-dev-workflow-arrow\"/>\n  \u003cpath d=\"M 605 210 L 605 236 L 145 236 L 145 210\" class=\"flow-dev-workflow-loop\"/>\n  \u003ctext x=\"330\" y=\"252\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#ED8936\">测试不过 → 回炉重造\u003c/text>\n\n  \u003c!-- 泳道2：提交变更 -->\n  \u003cg>\n    \u003crect x=\"70\" y=\"310\" width=\"180\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#68D391\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"160\" y=\"338\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">写变更信\u003c/text>\n    \u003ctext x=\"160\" y=\"358\" text-anchor=\"middle\" class=\"flow-dev-workflow-mono\">pnpm changeset\u003c/text>\n    \u003crect x=\"310\" y=\"310\" width=\"170\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#68D391\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"395\" y=\"332\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">规范提交\u003c/text>\n    \u003ctext x=\"395\" y=\"352\" text-anchor=\"middle\" class=\"flow-dev-workflow-mono\">feat(ui): add loading\u003c/text>\n    \u003ctext x=\"395\" y=\"368\" text-anchor=\"middle\" class=\"flow-dev-workflow-desc\">Conventional Commits\u003c/text>\n    \u003crect x=\"540\" y=\"310\" width=\"180\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#68D391\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"630\" y=\"338\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">推送 + 开 PR\u003c/text>\n    \u003ctext x=\"630\" y=\"358\" text-anchor=\"middle\" class=\"flow-dev-workflow-mono\">git push → PR\u003c/text>\n  \u003c/g>\n  \u003cpath d=\"M 605 210 L 605 345 L 720 345\" class=\"flow-dev-workflow-arrow\" marker-end=\"none\"/>\n  \u003cpath d=\"M 720 345 L 720 345\" class=\"flow-dev-workflow-arrow\"/>\n  \u003cpath d=\"M 160 380 L 160 345\" class=\"flow-dev-workflow-arrow\" transform=\"rotate(180 160 362)\"/>\n  \u003cpath d=\"M 250 345 L 310 345\" class=\"flow-dev-workflow-arrow\"/>\n  \u003cpath d=\"M 480 345 L 540 345\" class=\"flow-dev-workflow-arrow\"/>\n\n  \u003c!-- 泳道3：CI 校验 -->\n  \u003cg>\n    \u003crect x=\"70\" y=\"480\" width=\"150\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#B794F4\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"145\" y=\"505\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">Lint + 类型\u003c/text>\n    \u003ctext x=\"145\" y=\"525\" text-anchor=\"middle\" class=\"flow-dev-workflow-mono\">pnpm -r lint\u003c/text>\n    \u003crect x=\"250\" y=\"480\" width=\"150\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#B794F4\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"325\" y=\"505\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">单测\u003c/text>\n    \u003ctext x=\"325\" y=\"525\" text-anchor=\"middle\" class=\"flow-dev-workflow-mono\">vitest run\u003c/text>\n    \u003crect x=\"430\" y=\"480\" width=\"150\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#B794F4\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"505\" y=\"505\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">构建\u003c/text>\n    \u003ctext x=\"505\" y=\"525\" text-anchor=\"middle\" class=\"flow-dev-workflow-mono\">pnpm -r build\u003c/text>\n    \u003crect x=\"610\" y=\"480\" width=\"170\" height=\"70\" rx=\"10\" fill=\"#2F855A\" stroke=\"#2D3748\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"695\" y=\"508\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#fff\">全绿 → 合并 main\u003c/text>\n    \u003ctext x=\"695\" y=\"528\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#C6F6D5\">squash merge\u003c/text>\n  \u003c/g>\n  \u003cpath d=\"M 630 380 L 630 515 L 220 515\" class=\"flow-dev-workflow-arrow\" marker-end=\"none\"/>\n  \u003cpath d=\"M 220 515 L 250 515\" class=\"flow-dev-workflow-arrow\"/>\n  \u003cpath d=\"M 400 515 L 430 515\" class=\"flow-dev-workflow-arrow\"/>\n  \u003cpath d=\"M 580 515 L 610 515\" class=\"flow-dev-workflow-arrow\"/>\n  \u003cpath d=\"M 505 550 L 505 572 L 145 572 L 145 550\" class=\"flow-dev-workflow-loop\"/>\n  \u003ctext x=\"325\" y=\"568\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#ED8936\">任一环节失败 → PR 打回\u003c/text>\n\n  \u003c!-- 泳道4：自动发布 -->\n  \u003cg>\n    \u003crect x=\"70\" y=\"650\" width=\"200\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#ED8936\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"170\" y=\"675\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">changesets/action\u003c/text>\n    \u003ctext x=\"170\" y=\"695\" text-anchor=\"middle\" class=\"flow-dev-workflow-desc\">自动开 Release PR\u003c/text>\n    \u003crect x=\"330\" y=\"650\" width=\"200\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#ED8936\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"430\" y=\"675\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">合并 → 自动发版\u003c/text>\n    \u003ctext x=\"430\" y=\"695\" text-anchor=\"middle\" class=\"flow-dev-workflow-mono\">bump + CHANGELOG + publish\u003c/text>\n    \u003crect x=\"590\" y=\"650\" width=\"190\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#ED8936\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"685\" y=\"675\" text-anchor=\"middle\" class=\"flow-dev-workflow-box\">打 tag + 部署\u003c/text>\n    \u003ctext x=\"685\" y=\"695\" text-anchor=\"middle\" class=\"flow-dev-workflow-mono\">v1.1.0 → staging/prod\u003c/text>\n  \u003c/g>\n  \u003cpath d=\"M 695 550 L 695 685 L 270 685\" class=\"flow-dev-workflow-arrow\" marker-end=\"none\"/>\n  \u003cpath d=\"M 270 685 L 270 685\" class=\"flow-dev-workflow-arrow\"/>\n  \u003cpath d=\"M 270 685 L 330 685\" class=\"flow-dev-workflow-arrow\" transform=\"translate(0,0)\"/>\n  \u003cpath d=\"M 530 685 L 590 685\" class=\"flow-dev-workflow-arrow\"/>\n\n  \u003ctext x=\"440\" y=\"766\" text-anchor=\"middle\" class=\"flow-dev-workflow-desc\">关键设计：本地 workspace 链接免发包联调 · changeset 把「发版决策」左移到开发时 · CI 卡住红线 · 发布全自动\u003c/text>\n\u003c/svg>\n","kind":"diagram","title":"图解 · 开发到自动发版工作流"},"monorepo-structure":{"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\" data-scope=\"monorepo-structure\">\n  \u003cdefs>\n    \u003cstyle> [data-scope=\"monorepo-structure\"] .monorepo-structure-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: bold; fill: #1f2937; } [data-scope=\"monorepo-structure\"] .monorepo-structure-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14p <script>
/* ============================================================
 * 阅读器客户端逻辑（由 build-comic-reader.mjs 内联进单文件 HTML）
 * 关键设计：
 * 1) 漫画 SVG 字符串集中存放，按章节「懒挂载」——单话渲染失败只影响
 *    该画框并显示「重试」，不影响同一章其他漫画/图解（隔离原则）
 * 2) 阅读进度写入 localStorage，回到书架可「继续阅读」
 * 3) 支持 hash 路由 #/home、#/c/<id>，file:// 下同样可用
 * ============================================================ */
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("reader-data").textContent);
  var CHAPTERS = DATA.chapters; // 有序章节（含附录）
  var FIGURES = DATA.figures; // key -> {svg, kind, title}
  var STORE_KEY = "pnpm-comic-reader:v1";
  var THEME_KEY = "pnpm-comic-reader:theme";

  var state = loadState(); // {last, progress:{id:{p,done}}}
  var currentId = null;
  var lightboxList = []; // 当前灯箱浏览的 figure key 列表
  var lightboxIdx = 0;

  /* 灯箱缩放状态：
   * lbZoom 是相对「适应窗口(fit)」尺寸的倍数：fit=1，放大=2.5……
   * 缩放只通过修改 SVG 显式宽高实现（lbFitW * lbZoom），不叠加 transform，
   * 避免二次缩放；切话时保留倍数，重开/关窗时复位 */
  var LB_MIN = 0.15;
  var LB_MAX = 8;
  var lbZoom = 1;
  var lbFitW = 0; // 当前图片适应窗口的宽（px）
  var lbFitH = 0;
  var lbAspect = 840 / 660; // 宽高比，从 SVG viewBox 读取
  var lbMarginX = 0; // 小于 fit 时的居中边距（inline margin）
  var lbMarginY = 0;

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {
      /* 隐私模式等场景降级为内存态 */

  /* 本篇目录：从渲染后的 h2/h3 提取 */

    Array.prototype.forEach.call(hs, function (h) {

      box.querySelectorAll("[data-anchor]"),
      function (a) {

          var t = document.getElementById(a.getAttribute("data-anchor"));
          if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
        });

    );

  function observeScrollSpy() {
    var heads = document.querySelectorAll("#content h2[id], #content h3[id]");
    if (!("IntersectionObserver" in window) || !heads.length) return;
    var map = {};
    var io = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (en) {
          map[en.target.id] = en.isIntersecting;
        });
        var firstVisible = null;
        Array.prototype.some.call(heads, function (h) {
          if (map[h.id]) {
            firstVisible = h.id;
            return true;
          }
          return false;
        });
        if (firstVisible) {
          Array.prototype.forEach.call(
            document.querySelectorAll(".nav-anchor"),
            function (a) {
              a.classList.toggle(
                "active",
                a.getAttribute("data-anchor") === firstVisible,
              );
            },
          );
        }
      },
      { rootMargin: "-80px 0px -70% 0px" },
    );
    Array.prototype.forEach.call(heads, function (h) {
      io.observe(h);
    });
  }

  /* ---------------- 漫画懒挂载（失败隔离 + 重试） ---------------- */
  function mountFigures(root) {
    var slots = root.querySelectorAll(".comic-figure[data-svg]");
    Array.prototype.forEach.call(slots, function (fig) {
      var stage = fig.querySelector(".cf-stage");
      if (!stage || stage.dataset.mounted) return;
      renderFigure(fig, stage);
    });
  }

  function renderFigure(fig, stage) {
    var key = fig.getAttribute("data-svg");
    var f = FIGURES[key];
    stage.dataset.mounted = "1";
    if (!f || !f.svg || f.svg.indexOf("<svg") === -1) {
      showFigureError(stage, key, fig);
      return;
    }
    try {
      stage.innerHTML = f.svg;
      var svg = stage.querySelector("svg");
      if (!svg) throw new Error("svg root missing");
      svg.addEventListener("click", function () {
        var keys = collectChapterFigureKeys();
        openLightbox(keys, key);
      });
    } catch (err) {
      showFigureError(stage, key, fig);
    }
  }

  function showFigureError(stage, key, fig) {
    // 单话失败：只替换本画框内容，其他画框与正文不受影响，提供重试入口
    stage.dataset.mounted = "";
    stage.innerHTML =
      '<div class="cf-error">📉 本幅' +
      (FIGURES[key] && FIGURES[key].kind === "comic" ? "漫画" : "图解") +
      "渲染失败（" +
      esc(key) +
      '）<button type="button">重新加载</button></div>';
    var btn = stage.querySelector("button");
    if (btn)
      btn.addEventListener("click", function () {
        stage.innerHTML = '<div class="cf-loading">正在重新加载…</div>';
        setTimeout(function () {
          renderFigure(fig, stage);
        }, 120);
      });
  }

  function collectChapterFigureKeys() {
    var keys = [];
    var content = document.getElementById("content");
    if (!content) return Object.keys(FIGURES);
    Array.prototype.forEach.call(
      content.querySelectorAll(".comic-figure[data-svg]"),
      function (fig) {
        var k = fig.getAttribute("data-svg");
        if (FIGURES[k] && keys.indexOf(k) === -1) keys.push(k);
      },
    );
    return keys.length ? keys : Object.keys(FIGURES);
  }

  /* ---------------- 灯箱 ---------------- */
  function openLightbox(keys, startKey) {
    if (!keys || !keys.length) return;
    lightboxList = keys;
    lightboxIdx = Math.max(0, keys.indexOf(startKey));
    if (lightboxIdx === -1) lightboxIdx = 0;
    lbZoom = 1; // 每次打开默认「适应窗口」大尺寸
    var lb = document.getElementById("lightbox");
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
    paintLightbox();
  }
  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("open");
    document.body.style.overflow = "";
  }

  /* 从 SVG viewBox 读取宽高比（源文件可能带 width/height 也可能已剥离，
   * viewBox 始终可靠），失败时回退到漫画默认比例 */
  function readSvgAspect(svg) {
    var vb = svg.getAttribute("viewBox");
    if (vb) {
      var p = vb.trim().split(/[\s,]+/);
      var w = parseFloat(p[2]);
      var h = parseFloat(p[3]);
      if (w > 0 && h > 0) return w / h;
    }
    if (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width) {
      return svg.viewBox.baseVal.width / svg.viewBox.baseVal.height;
    }
    return 840 / 660;
  }

  /* 计算「适应窗口」尺寸：为左右翻页箭头、顶部工具条、底部标题预留空间；
   * 窄屏（手机）减少左右预留，箭头改为悬浮压边 */
  function computeFit() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var narrow = vw <= 560;
    var availW = Math.max(180, Math.min(1280, vw - (narrow ? 28 : 120)));
    var availH = Math.max(180, vh - (narrow ? 150 : 160));
    var w = Math.min(availW, availH * lbAspect);
    return { w: w, h: w / lbAspect };
  }

  function paintLightbox() {
    var key = lightboxList[lightboxIdx];
    var f = FIGURES[key];
    if (!f) return;
    var frame = document.getElementById("lb-frame");
    frame.innerHTML = f.svg;
    var svg = frame.querySelector("svg");
    if (svg) {
      lbAspect = readSvgAspect(svg);
      var fit = computeFit();
      lbFitW = fit.w;
      lbFitH = fit.h;
      frame.style.width = lbFitW + "px";
      frame.style.height = lbFitH + "px";
      // 切话保留缩放倍数；以画框中心为焦点重新应用
      lbApplyZoom(lbZoom, lbFitW / 2, lbFitH / 2);
    }
    document.getElementById("lb-caption").textContent =
      f.title + "（" + (lightboxIdx + 1) + "/" + lightboxList.length + "）";
    var multi = lightboxList.length > 1;
    document.getElementById("lb-prev").style.display = multi ? "" : "none";
    document.getElementById("lb-next").style.display = multi ? "" : "none";
  }
  function lbStep(delta) {
    lightboxIdx =
      (lightboxIdx + delta + lightboxList.length) % lightboxList.length;
    paintLightbox();
  }

  /* 应用缩放（唯一口径：改 SVG 显式宽高）。
   * focalX/focalY 为相对画框视口的焦点坐标，缩放后该焦点对应的画面位置
   * 保持不动（滚轮/双击以光标为中心）；省略时以画框中心为焦点 */
  function lbApplyZoom(nextZoom, focalX, focalY) {
    var frame = document.getElementById("lb-frame");
    var svg = frame.querySelector("svg");
    if (!svg || !lbFitW) return;
    var oldZoom = lbZoom;
    lbZoom = Math.min(LB_MAX, Math.max(LB_MIN, nextZoom));

    var viewW = frame.clientWidth;
    var viewH = frame.clientHeight;
    if (focalX == null) focalX = viewW / 2;
    if (focalY == null) focalY = viewH / 2;

    // 焦点在 fit 坐标系中的画面位置（减去当前居中边距与滚动偏移）
    var imgX = (frame.scrollLeft + focalX - lbMarginX) / oldZoom;
    var imgY = (frame.scrollTop + focalY - lbMarginY) / oldZoom;

    var renderedW = lbFitW * lbZoom;
    var renderedH = lbFitH * lbZoom;
    svg.style.width = renderedW + "px";
    svg.style.height = renderedH + "px";

    // 缩到比视口小时，画面在视口内居中（用 margin 实现，不参与平移）
    lbMarginX = Math.max(0, (viewW - renderedW) / 2);
    lbMarginY = Math.max(0, (viewH - renderedH) / 2);
    svg.style.marginLeft = lbMarginX + "px";
    svg.style.marginTop = lbMarginY + "px";

    // 恢复焦点位置（浏览器会自动钳制到可滚动范围）
    frame.scrollLeft = imgX * lbZoom + lbMarginX - focalX;
    frame.scrollTop = imgY * lbZoom + lbMarginY - focalY;

    var val = document.getElementById("lb-zoom-val");
    if (val) val.textContent = Math.round(lbZoom * 100) + "%";
  }

  function lbZoomBy(factor) {
    // 按钮/键盘：以画框中心为焦点
    lbApplyZoom(lbZoom * factor);
  }

  /* 指针拖拽平移（鼠标 + 触屏统一走 Pointer Events） */
  function bindFramePan(frame) {
    var drag = null;

    frame.addEventListener("pointerdown", function (e) {
      if (e.button !== 0 && e.pointerType === "mouse") return;
      drag = {
        x: e.clientX,
        y: e.clientY,
        sl: frame.scrollLeft,
        st: frame.scrollTop,
      };
      frame.classList.add("grabbing");
      try {
        frame.setPointerCapture(e.pointerId);
      } catch (err) {}
    });
    frame.addEventListener("pointermove", function (e) {
      if (!drag) return;
      frame.scrollLeft = drag.sl - (e.clientX - drag.x);
      frame.scrollTop = drag.st - (e.clientY - drag.y);
    });
    function endDrag(e) {
      if (!drag) return;
      drag = null;
      frame.classList.remove("grabbing");
      try {
        frame.releasePointerCapture(e.pointerId);
      } catch (err) {}
    }
    frame.addEventListener("pointerup", endDrag);
    frame.addEventListener("pointercancel", endDrag);

    // 滚轮缩放（必须 preventDefault，监听需显式声明非 passive）
    frame.addEventListener(
      "wheel",
      function (e) {
        e.preventDefault();
        var rect = frame.getBoundingClientRect();
        var factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        lbApplyZoom(
          lbZoom * factor,
          e.clientX - rect.left,
          e.clientY - rect.top,
        );
      },
      { passive: false },
    );

    // 双击：fit <-> 2.5x，以光标为中心
    frame.addEventListener("dblclick", function (e) {
      var rect = frame.getBoundingClientRect();
      lbApplyZoom(
        lbZoom > 1.01 ? 1 : 2.5,
        e.clientX - rect.left,
        e.clientY - rect.top,
      );
    });
  }

  /* ---------------- 代码块复制 ---------------- */
  function bindCopyButtons() {
    Array.prototype.forEach.call(
      document.querySelectorAll(".codeblock-copy"),
      function (btn) {
        btn.addEventListener("click", function () {
          var pre = btn.closest(".codeblock").querySelector("pre");
          var text = pre ? pre.textContent : "";
          var done = function () {
            btn.textContent = "✓ 已复制";
            btn.classList.add("ok");
            setTimeout(function () {
              btn.textContent = "复制";
              btn.classList.remove("ok");
            }, 1400);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () {
              fallbackCopy(text, done);
            });
          } else {
            fallbackCopy(text, done);
          }
        });
      },
    );
  }
  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      done();
    } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ---------------- 阅读进度 ---------------- */
  var progressTid = null;
  function updateProgressUI() {
    var bar = document.getElementById("read-progress");
    var pct = document.getElementById("pct");
    var content = document.getElementById("content");
    if (!content) {
      bar.style.width = "0%";
      if (pct) pct.textContent = "";
      return;
    }
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var ratio = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 1;
    bar.style.width = (ratio * 100).toFixed(1) + "%";
    if (pct) pct.textContent = Math.round(ratio * 100) + "%";
    if (currentId) {
      var pg = state.progress[currentId] || {};
      pg.p = Math.max(pg.p || 0, ratio);
      if (ratio >= 0.92) pg.done = 1;
      state.progress[currentId] = pg;
      clearTimeout(progressTid);
      progressTid = setTimeout(saveState, 250);
    }
  }

  /* ---------------- 锚点定位 ---------------- */
  function normalizeSlug(s) {
    return String(s)
      .toLowerCase()
      .replace(/[^a-z0-9一-龥]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }
  function scrollToAnchor(slug) {
    if (!slug) return;
    var el = document.getElementById(slug);
    if (!el) {
      // 兜底：源文档锚点风格与本阅读器 slug 不完全一致时，按归一化标题文本匹配
      var target = normalizeSlug(slug);
      var heads = document.querySelectorAll(
        "#content h1,#content h2,#content h3,#content h4,#content h5,#content h6",
      );
      Array.prototype.some.call(heads, function (h) {
        if (normalizeSlug(h.textContent) === target) {
          el = h;
          return true;
        }
        return false;
      });
    }
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* ---------------- 路由 ---------------- */
  function go(target) {
    if (target === "home") {
      location.hash = "#/home";
      return;
    }
    var id = target;
    var anchor = "";
    if (target.indexOf(":") !== -1) {
      var p = target.split(":");
      id = p[0];
      anchor = p.slice(1).join(":");
    }
    location.hash =
      "#/c/" +
      encodeURIComponent(id) +
      (anchor ? "/" + encodeURIComponent(anchor) : "");
  }
  function route() {
    var h = location.hash.replace(/^#\/?/, "");
    if (h.indexOf("c/") === 0) {
      var rest = h.slice(2).split("/");
      renderChapter(
        decodeURIComponent(rest[0]),
        rest[1] ? decodeURIComponent(rest[1]) : null,
      );
    } else {
      currentId = null;
      document.getElementById("sidebar").innerHTML = buildSidebar();
      renderHome();
    }
    closeMobileSidebar();
  }

  function closeMobileSidebar() {
    document.body.classList.remove("sidebar-open");
  }

  /* ---------------- 顶栏 & 全局事件 ---------------- */
  function buildTopbar() {
    var tb = document.getElementById("topbar");
    tb.innerHTML =
      '<button class="icon-btn" id="btn-menu" title="目录">☰</button>' +
      '<button class="icon-btn only-wide" id="btn-home" title="回到书架">🏠</button>' +
      '<span class="topbar-title" id="topbar-title">书架</span>' +
      '<span class="topbar-spacer"></span>' +
      '<span class="pct" id="pct"></span>' +
      '<button class="icon-btn" id="btn-theme" title="切换明暗主题">🌓</button>';

    document.getElementById("btn-menu").addEventListener("click", function () {
      document.body.classList.toggle("sidebar-open");
    });
    document.getElementById("btn-home").addEventListener("click", function () {
      go("home");
    });
    document.getElementById("btn-theme").addEventListener("click", function () {
      var cur =
        document.documentElement.getAttribute("data-theme") === "dark"
          ? "light"
          : "dark";
      applyTheme(cur);
      try {
        localStorage.setItem(THEME_KEY, cur);
      } catch (e) {}
    });
  }

  function buildLightboxEls() {
    var lb = document.getElementById("lightbox");
    lb.innerHTML =
      '<button class="lb-close" title="关闭 (Esc)">✕</button>' +
      '<div class="lb-toolbar" id="lb-toolbar">' +
      '<button class="lb-tb-btn" id="lb-zoom-out" title="缩小 (−)">−</button>' +
      '<button class="lb-zoom-val" id="lb-zoom-val" title="点击恢复适应窗口 (0)">100%</button>' +
      '<button class="lb-tb-btn" id="lb-zoom-in" title="放大 (+)">+</button>' +
      '<button class="lb-tb-btn" id="lb-zoom-fit" title="适应窗口 (0)">⛶</button>' +
      "</div>" +
      '<button class="lb-nav lb-prev" id="lb-prev" title="上一幅 (←)">‹</button>' +
      '<div class="lb-frame" id="lb-frame"></div>' +
      '<button class="lb-nav lb-next" id="lb-next" title="下一幅 (→)">›</button>' +
      '<div class="lb-caption" id="lb-caption"></div>';
    lb.querySelector(".lb-close").addEventListener("click", closeLightbox);
    lb.querySelector(".lb-prev").addEventListener("click", function (e) {
      e.stopPropagation();
      lbStep(-1);
    });
    lb.querySelector(".lb-next").addEventListener("click", function (e) {
      e.stopPropagation();
      lbStep(1);
    });
    document
      .getElementById("lb-zoom-out")
      .addEventListener("click", function () {
        lbZoomBy(1 / 1.2);
      });
    document
      .getElementById("lb-zoom-in")
      .addEventListener("click", function () {
        lbZoomBy(1.2);
      });
    document
      .getElementById("lb-zoom-fit")
      .addEventListener("click", function () {
        lbApplyZoom(1);
      });
    document
      .getElementById("lb-zoom-val")
      .addEventListener("click", function () {
        lbApplyZoom(1);
      });
    // 画框元素只创建一次，滚轮/拖拽/双击监听在此一次性绑定
    bindFramePan(document.getElementById("lb-frame"));
    lb.addEventListener("click", function (e) {
      if (e.target === lb) closeLightbox();
    });
  }

  document.addEventListener("keydown", function (e) {
    var lbOpen = document.getElementById("lightbox").classList.contains("open");
    if (lbOpen) {
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowLeft") lbStep(-1);
      else if (e.key === "ArrowRight") lbStep(1);
      else if (e.key === "+" || e.key === "=") lbZoomBy(1.2);
      else if (e.key === "-" || e.key === "_") lbZoomBy(1 / 1.2);
      else if (e.key === "0") lbApplyZoom(1);
      return;
    }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      if (!currentId) return;
      var tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      var i = chapterIndex(currentId);
      var target =
        e.key === "ArrowLeft"
          ? i > 0
            ? CHAPTERS[i - 1].id
            : null
          : i < CHAPTERS.length - 1
            ? CHAPTERS[i + 1].id
            : null;
      if (target) go(target);
    }
  });
  window.addEventListener("scroll", updateProgressUI, { passive: true });
  window.addEventListener("hashchange", route);

  /* 窗口尺寸变化：灯箱开启时重算 fit，保留当前缩放倍数（防抖） */
  var lbResizeTid = null;
  window.addEventListener("resize", function () {
    if (!document.getElementById("lightbox").classList.contains("open")) return;
    clearTimeout(lbResizeTid);
    lbResizeTid = setTimeout(function () {
      var fit = computeFit();
      lbFitW = fit.w;
      lbFitH = fit.h;
      var frame = document.getElementById("lb-frame");
      frame.style.width = lbFitW + "px";
      frame.style.height = lbFitH + "px";
      lbApplyZoom(lbZoom);
    }, 120);
  });
  document
    .getElementById("scrim")
    .addEventListener("click", closeMobileSidebar);

  /* 全局事件委托：书架卡片 / 侧边栏 / 正文内链 / 画廊缩略图（innerHTML 动态替换也生效） */
  document.addEventListener("click", function (e) {
    if (e.target.closest) {
      var anchorEl = e.target.closest("[data-anchor]");
      if (anchorEl) {
        e.preventDefault();
        scrollToAnchor(anchorEl.getAttribute("data-anchor"));
        return;
      }
      var gotoEl = e.target.closest("[data-goto]");
      if (gotoEl) {
        go(gotoEl.getAttribute("data-goto"));
        return;
      }
      var figEl = e.target.closest("[data-figure]");
      if (figEl) {
        openLightbox(Object.keys(FIGURES), figEl.getAttribute("data-figure"));
      }
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (!e.target.closest || !e.target.getAttribute) return;
    if (e.target.hasAttribute("data-goto")) {
      e.preventDefault();
      go(e.target.getAttribute("data-goto"));
    } else if (e.target.hasAttribute("data-figure")) {
      e.preventDefault();
      openLightbox(Object.keys(FIGURES), e.target.getAttribute("data-figure"));
    }
  });

  buildTopbar();
  buildLightboxEls();
  if (!location.hash) location.hash = "#/home";
  route();
})();

</script>
</body>
</html>
