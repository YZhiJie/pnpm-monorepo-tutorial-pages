npm 存储机制\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"node_modules-结构可视化\">node_modules 结构可视化\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"hoisting-行为控制\">Hoisting 行为控制\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"依赖版本统一管理\">依赖版本统一管理\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"phantom-dependency-防护\">Phantom Dependency 防护\u003c/a>\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"pnpm-存储机制\">pnpm 存储机制\u003c/h2>\n\u003ch3 id=\"内容寻址存储-content-addressable-store\">内容寻址存储（Content-Addressable Store）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>~/.pnpm-store/\n├── v3/\n│   ├── files/          # 实际文件内容（按内容哈希存储）\n│   │   ├── 00/xxxxx    # 文件哈希前两位作为目录名\n│   │   └── ...\n│   └── packages/       # 包元数据\n│       └── lodash@4.17.21/\n│           └── index.json\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>核心优势\u003c/strong>：\u003c/p>\n\u003cul>\u003cli>同一台机器上的所有项目共享存储\u003c/li>\u003cli>安装新包时，若内容已存在，仅需创建硬链接（0 拷贝）\u003c/li>\u003cli>节省 80%+ 磁盘空间\u003c/li>\u003c/ul>\n\u003ch3 id=\"硬链接-vs-软链接\">硬链接 vs 软链接\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>特性\u003c/th>\u003cth>硬链接\u003c/th>\u003cth>软链接（符号链接）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>指向\u003c/td>\u003ctd>文件 inode\u003c/td>\u003ctd>文件路径\u003c/td>\u003c/tr>\u003ctr>\u003ctd>源文件删除\u003c/td>\u003ctd>仍可访问\u003c/td>\u003ctd>失效（ dangling ）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>跨文件系统\u003c/td>\u003ctd>不支持\u003c/td>\u003ctd>支持\u003c/td>\u003c/tr>\u003ctr>\u003ctd>pnpm 用途\u003c/td>\u003ctd>store -&gt; node_modules/.pnpm\u003c/td>\u003ctd>.pnpm -&gt; 项目 node_modules\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"安装过程图解\">安装过程图解\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>安装 lodash@4.17.21：\n\n1. 下载 tarball 到缓存\n   npm registry → ~/.pnpm-cache/lodash-4.17.21.tgz\n\n2. 解压到 store\n   ~/.pnpm-cache/... → ~/.pnpm-store/v3/files/...\n\n3. 创建硬链接到项目\n   ~/.pnpm-store/v3/files/... → node_modules/.pnpm/lodash@4.17.21/node_modules/lodash/...\n\n4. 创建软链接到依赖树\n   node_modules/.pnpm/lodash@4.17.21/node_modules/lodash\n     → node_modules/lodash（如果 hoist）\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"node-modules-结构可视化\">node_modules 结构可视化\u003c/h2>\n\u003ch3 id=\"pnpm-的严格结构\">pnpm 的严格结构\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>project/\n├── node_modules/\n│   ├── .pnpm/                    # 所有依赖的实际存储位置\n│   │   ├── lodash@4.17.21/\n│   │   │   └── node_modules/\n│   │   │       └── lodash/       # 实际文件（硬链接自 store）\n│   │   │\n│   │   ├── react@18.2.0/\n│   │   │   └── node_modules/\n│   │   │       └── react/\n│   │   │\n│   │   └── .modules.yaml         # 模块依赖关系元数据\n│   │\n│   ├── lodash -&gt; .pnpm/lodash@4.17.21/node_modules/lodash  # 软链接（如果 hoist）\n│   ├── react -&gt; .pnpm/react@18.2.0/node_modules/react\n│   │\n│   └── .bin/                     # CLI 命令入口\n│\n└── package.json\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"与-npm-的结构对比\">与 npm 的结构对比\u003c/h3>\n\u003cp>\u003cstrong>npm（扁平结构）\u003c/strong>：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>node_modules/\n├── lodash/           # 被提升到根\n├── react/            # 被提升到根\n├── some-lib/         # 依赖 lodash\n└── other-lib/        # 也依赖 lodash（共享同一实例）\n    └── node_modules/\n        └── lodash/   # 如果版本冲突，嵌套安装\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>pnpm（严格嵌套 + 软链接）\u003c/strong>：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>node_modules/\n├── .pnpm/\n│   ├── lodash@4.17.21/\n│   ├── lodash@3.10.1/   # 版本冲突时两个版本共存\n│   └── some-lib/\n│       └── node_modules/\n│           └── lodash -&gt; ../../lodash@4.17.21/node_modules/lodash\n└── lodash -&gt; .pnpm/lodash@4.17.21/node_modules/lodash  # 仅 hoist 时存在\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"hoisting-行为控制\">Hoisting 行为控制\u003c/h2>\n\u003ch3 id=\"什么是-hoisting\">什么是 Hoisting？\u003c/h3>\n\u003cp>Hoisting（提升）是指将依赖从 \u003ccode>.pnpm\u003c/code> 目录软链接到项目根 \u003ccode>node_modules\u003c/code>，使其可被全局访问。\u003c/p>\n\u003ch3 id=\"配置项详解\">配置项详解\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">ini\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .npmrc\n\n# hoist: 是否启用 hoisting（默认 true）\n# true:  部分依赖被提升到根 node_modules\n# false: 无提升，所有依赖仅在 .pnpm 中可见\nhoist=true\n\n# hoist-pattern: 哪些包被提升（默认 ['*']）\n# 可精确控制提升范围，避免污染全局空间\nhoist-pattern[]=*\n# hoist-pattern[]=*eslint*      # 仅提升 eslint 相关\n# hoist-pattern[]=*prettier*    # 仅提升 prettier 相关\n\n# public-hoist-pattern: 提升到项目根（对所有包可见）\n# 场景：类型定义、构建工具需要全局可见\npublic-hoist-pattern[]=*types*\npublic-hoist-pattern[]=*eslint*\npublic-hoist-pattern[]=*prettier*\n\n# shamefully-hoist: 兼容 npm 的完全扁平结构（默认 false）\n# true:  模拟 npm 的扁平 node_modules\n# false: 保持 pnpm 的严格隔离（推荐）\nshamefully-hoist=false\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"配置对比表\">配置对比表\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>配置组合\u003c/th>\u003cth>node_modules 结构\u003c/th>\u003cth>适用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>hoist=true\u003c/code> + \u003ccode>shamefully-hoist=false\u003c/code>\u003c/td>\u003ctd>部分提升，严格隔离\u003c/td>\u003ctd>\u003cstrong>默认推荐，大多数项目\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hoist=false\u003c/code>\u003c/td>\u003ctd>无提升，完全隔离\u003c/td>\u003ctd>追求极致安全，避免任何幻影依赖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>shamefully-hoist=true\u003c/code>\u003c/td>\u003ctd>完全扁平\u003c/td>\u003ctd>迁移旧项目（临时方案）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"hoist-pattern-实战示例\">hoist-pattern 实战示例\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">ini\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .npmrc\n\n# 仅提升类型定义（TypeScript 需要全局可见）\nhoist-pattern[]=!*                # 先禁用所有\nhoist-pattern[]=*@types*          # 再仅启用 @types\n\n# 或者更精细控制\npublic-hoist-pattern[]=*@types/node\npublic-hoist-pattern[]=*@types/react\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"依赖版本统一管理\">依赖版本统一管理\u003c/h2>\n\u003ch3 id=\"根-package.json-集中管理\">根 package.json 集中管理\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// package.json\n{\n  \"devDependencies\": {\n    \"typescript\": \"^5.3.3\",\n    \"vitest\": \"^1.2.0\",\n    \"eslint\": \"^8.56.0\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>子包通过 \u003ccode>workspace:*\u003c/code> 引用根配置：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// packages/ui/package.json\n{\n  \"devDependencies\": {\n    \"typescript\": \"workspace:*\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"使用-pnpm.overrides-强制统一\">使用 pnpm.overrides 强制统一\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>{\n  \"pnpm\": {\n    \"overrides\": {\n      \"typescript\": \"5.3.3\",\n      \"react\": \"^18.2.0\"\n    }\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"catalog-功能-pnpm-9.x+\">Catalog 功能（pnpm 9.x+）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># pnpm-workspace.yaml\ncatalog:\n  \"typescript\": \"^5.3.3\"\n  \"react\": \"^18.2.0\"\n  \"vitest\": \"^1.2.0\"\n\n  \"catalog:default\":\n    \"typescript\": \"^5.3.3\"\n\n  \"catalog:legacy\":\n    \"typescript\": \"^4.9.5\"\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// package.json\n{\n  \"devDependencies\": {\n    \"typescript\": \"catalog:default\",\n    \"react\": \"catalog:\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"phantom-dependency-防护\">Phantom Dependency 防护\u003c/h2>\n\u003ch3 id=\"什么是幻影依赖\">什么是幻影依赖？\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">js\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// 代码中直接使用了 lodash\nimport _ from \"lodash\";\n\n// 但 package.json 中并未声明 lodash！\n// 之所以能运行，是因为某个依赖（如 some-lib）依赖了 lodash，\n// npm 将其扁平化后，lodash 出现在根 node_modules\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>风险\u003c/strong>：一旦 some-lib 移除 lodash 依赖，代码立即崩溃。\u003c/p>\n\u003ch3 id=\"pnpm-的天然防护\">pnpm 的天然防护\u003c/h3>\n\u003cp>pnpm 的严格隔离结构天然防止幻影依赖：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># pnpm 结构下，lodash 仅在 .pnpm/lodash@x.x.x 中可见\n# 如果 package.json 未声明 lodash，import 'lodash' 会直接报错\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"显式声明所有依赖\">显式声明所有依赖\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// package.json（最佳实践）\n{\n  \"dependencies\": {\n    \"lodash\": \"^4.17.21\" // 即使某个依赖也依赖 lodash，仍需显式声明\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"使用-eslint-检测幻影依赖\">使用 ESLint 检测幻影依赖\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// .eslintrc.js\nmodule.exports = {\n  plugins: ['import'],\n  rules: {\n    'import/no-extraneous-dependencies': ['error', {\n      devDependencies: ['**/*.test.ts', '**/*.config.ts']\n    }]\n  }\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"最佳实践\">最佳实践\u003c/h2>\n\u003ch3 id=\"1.-保持-hoist=false-以追求极致安全\">1. 保持 hoist=false 以追求极致安全\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">ini\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .npmrc\nhoist=false\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>代价\u003c/strong>：某些旧包可能因找不到隐式依赖而报错，需逐一修复。\u003c/p>\n\u003ch3 id=\"2.-使用-public-hoist-pattern-精确控制\">2. 使用 public-hoist-pattern 精确控制\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">ini\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .npmrc\n# 仅提升类型定义和 lint 工具\npublic-hoist-pattern[]=*@types*\npublic-hoist-pattern[]=*eslint*\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"3.-定期清理-store\">3. 定期清理 store\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 移除未引用的包（节省磁盘）\npnpm store prune\n\n# 查看 store 大小\npnpm store status\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"下一步\">下一步\u003c/h2>\n\u003cp>依赖共享机制理解后，请继续阅读 \u003ca data-goto=\"d05\">05-build-optimization.md\u003c/a>，学习如何优化构建流程与缓存策略。\u003c/p>"},{"id":"d05","file":"docs/05-build-optimization.md","group":"ref","no":"参 5","short":"构建流程与缓存优化","title":"构建流程与缓存优化","tagline":"拓扑排序、并行度、tsc 增量与远程缓存","level":"高级","minutes":30,"html":"\u003cblockquote>\u003cp>本章详解构建工具集成方案、增量构建实现、构建缓存配置及多包并行构建策略。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>配套漫画\u003c/strong>：\u003cfigure class=\"comic-figure\" data-svg=\"comic-04-build-pipeline\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind comic\">漫画\u003c/span>\u003cspan class=\"cf-caption\">第 4 话 · 构建车间\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\u003c/p>\n\u003ch2 id=\"目录\">目录\u003c/h2>\n\u003cul>\u003cli>\u003ca data-anchor=\"构建工具集成\">构建工具集成\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"增量构建实现\">增量构建实现\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"构建缓存配置\">构建缓存配置\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"多包并行构建策略\">多包并行构建策略\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"构建性能优化\">构建性能优化\u003c/a>\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"构建工具集成\">构建工具集成\u003c/h2>\n\u003ch3 id=\"typescript-tsc-集成\">TypeScript (tsc) 集成\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// packages/utils/package.json\n{\n  \"scripts\": {\n    \"build\": \"tsc -p tsconfig.build.json\",\n    \"build:watch\": \"tsc -w\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// packages/utils/tsconfig.build.json\n{\n  \"extends\": \"../../tsconfig.json\",\n  \"compilerOptions\": {\n    \"outDir\": \"dist\",\n    \"declaration\": true,\n    \"sourceMap\": true,\n    \"noEmit\": false\n  },\n  \"include\": [\"src/**/*\"],\n  \"exclude\": [\"**/*.test.ts\", \"**/*.spec.ts\"]\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"vite-集成-库模式\">Vite 集成（库模式）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">ts\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// packages/ui/vite.config.ts\nimport { defineConfig } from \"vite\";\nimport react from \"@vitejs/plugin-react\";\nimport dts from \"vite-plugin-dts\";\n\nexport default defineConfig({\n  plugins: [\n    react(),\n    dts({ insertTypesEntry: true }), // 生成类型声明\n  ],\n  build: {\n    lib: {\n      entry: \"src/index.ts\",\n      name: \"TutorialUI\",\n      formats: [\"es\", \"cjs\"],\n      fileName: (format) =&gt; `index.${format}.js`,\n    },\n    rollupOptions: {\n      external: [\"react\", \"react-dom\"],\n      output: {\n        globals: { react: \"React\", \"react-dom\": \"ReactDOM\" },\n      },\n    },\n  },\n});\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"webpack-集成\">Webpack 集成\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">js\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// packages/ui/webpack.config.js\nmodule.exports = {\n  entry: \"./src/index.ts\",\n  output: {\n    library: \"TutorialUI\",\n    libraryTarget: \"umd\",\n    filename: \"index.js\",\n  },\n  externals: {\n    react: \"react\",\n    \"react-dom\": \"react-dom\",\n  },\n  resolve: { extensions: [\".ts\", \".tsx\"] },\n  module: {\n    rules: [{ test: /\\.tsx?$/, use: \"ts-loader\", exclude: /node_modules/ }],\n  },\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"增量构建实现\">增量构建实现\u003c/h2>\n\u003ch3 id=\"typescript-项目引用-project-references\">TypeScript 项目引用（Project References）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// tsconfig.json\n{\n  \"references\": [\n    { \"path\": \"packages/types\" },\n    { \"path\": \"packages/utils\" },\n    { \"path\": \"packages/ui\" }\n  ]\n}\n\n// packages/utils/tsconfig.json\n{\n  \"references\": [{ \"path\": \"../types\" }],\n  \"compilerOptions\": {\n    \"composite\": true,\n    \"tsBuildInfoFile\": \"node_modules/.tmp/tsconfig.tsbuildinfo\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>构建命令\u003c/strong>：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 仅构建变更的包及其依赖\ntsc --build\n\n# 强制全量重建\ntsc --build --force\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"turbo-/-nx-集成-推荐大型项目\">Turbo / Nx 集成（推荐大型项目）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// turbo.json\n{\n  \"pipeline\": {\n    \"build\": {\n      \"dependsOn\": [\"^build\"],\n      \"outputs\": [\"dist/**\"],\n      \"inputs\": [\"src/**\", \"tsconfig.json\"]\n    },\n    \"test\": {\n      \"dependsOn\": [\"build\"],\n      \"outputs\": [],\n      \"inputs\": [\"src/**\", \"test/**\"]\n    }\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"构建缓存配置\">构建缓存配置\u003c/h2>\n\u003ch3 id=\"本地缓存目录\">本地缓存目录\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">ini\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .npmrc\n# 缓存目录：存储下载的 tarball 和元数据\ncache-dir=~/.pnpm-cache\n\n# Store 目录：内容寻址存储\nstore-dir=~/.pnpm-store\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"构建工具缓存\">构建工具缓存\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// vite.config.ts\nexport default defineConfig({\n  build: {\n    cacheDir: 'node_modules/.vite', // Vite 缓存\n  },\n});\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// turbo.json\n{\n  \"cacheDir\": \".turbo/cache\" // Turbo 缓存\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"ci-缓存策略-github-actions\">CI 缓存策略（GitHub Actions）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>- name: Cache pnpm modules\n  uses: actions/cache@v3\n  with:\n    path: |\n      ~/.pnpm-store\n      node_modules\n      .turbo\n    key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}\n    restore-keys: |\n      ${{ runner.os }}-pnpm-\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"多包并行构建策略\">多包并行构建策略\u003c/h2>\n\u003ch3 id=\"pnpm-原生并行\">pnpm 原生并行\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 并行构建所有包（默认按拓扑顺序）\npnpm -r --parallel run build\n\n# 限制并发数（默认 4）\npnpm -r --parallel --workspace-concurrency=4 run build\n\n# 仅构建有变更的包（基于依赖图）\npnpm -r --filter ...[origin/main] run build\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"拓扑排序构建\">拓扑排序构建\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 按依赖拓扑顺序构建（串行但保证依赖先构建）\npnpm -r run build\n\n# 并行构建（忽略拓扑，需确保依赖已构建）\npnpm -r --parallel run build\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"条件构建\">条件构建\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 仅构建有 build 脚本的包\npnpm -r --if-present run build\n\n# 仅构建特定目录\npnpm -r --filter ./packages/* run build\n\n# 构建依赖 @tutorial/ui 的所有包\npnpm -r --filter ...@tutorial/ui run build\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"构建性能优化\">构建性能优化\u003c/h2>\n\u003ch3 id=\"1.-排除测试文件\">1. 排除测试文件\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// tsconfig.build.json\n{\n  \"exclude\": [\"**/*.test.ts\", \"**/*.spec.ts\", \"**/__tests__/**\"]\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"2.-减少声明文件生成\">2. 减少声明文件生成\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// 开发环境跳过类型检查\n{\n  \"compilerOptions\": {\n    \"skipLibCheck\": true,\n    \"declaration\": false // 仅生产构建生成 .d.ts\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"3.-使用-esbuild/swc-替代-tsc\">3. 使用 esbuild/swc 替代 tsc\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 安装 esbuild\npnpm add -D esbuild\n\n# 构建脚本\nesbuild src/index.ts --bundle --outfile=dist/index.js --format=esm\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"4.-并行类型检查\">4. 并行类型检查\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// package.json\n{\n  \"scripts\": {\n    \"build\": \"vite build\",\n    \"typecheck\": \"tsc --noEmit\" // 与构建并行执行\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"下一步\">下一步\u003c/h2>\n\u003cp>构建优化完成后，请继续阅读 \u003ca data-goto=\"d06\">06-versioning.md\u003c/a>，学习 Changesets 版本管理方案。\u003c/p>"},{"id":"d06","file":"docs/06-versioning.md","group":"ref","no":"参 6","short":"Changesets 版本发布","title":"Changesets 版本发布","tagline":"变更信工作流、fixed/linked 版本策略与 CHANGELOG 自动化","level":"高级","minutes":25,"html":"\u003cblockquote>\u003cp>本章详解语义化版本规范、Changesets 变更日志自动生成、版本发布完整流程及版本同步策略。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>配套漫画\u003c/strong>：\u003cfigure class=\"comic-figure\" data-svg=\"comic-05-release-adventure\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind comic\">漫画\u003c/span>\u003cspan class=\"cf-caption\">第 5 话 · 发布大冒险\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\u003c/p>\n\u003ch2 id=\"目录\">目录\u003c/h2>\n\u003cul>\u003cli>\u003ca data-anchor=\"语义化版本规范\">语义化版本规范\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"changesets-核心概念\">Changesets 核心概念\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"版本发布流程\">版本发布流程\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"版本同步策略\">版本同步策略\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"预发布与灰度\">预发布与灰度\u003c/a>\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"语义化版本规范\">语义化版本规范\u003c/h2>\n\u003ch3 id=\"版本号格式-major.minor.patch\">版本号格式：\u003ccode>MAJOR.MINOR.PATCH\u003c/code>\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>含义\u003c/th>\u003cth>变更场景\u003c/th>\u003cth>示例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MAJOR\u003c/td>\u003ctd>主版本\u003c/td>\u003ctd>不兼容的 API 变更\u003c/td>\u003ctd>1.0.0 → 2.0.0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MINOR\u003c/td>\u003ctd>次版本\u003c/td>\u003ctd>向下兼容的功能新增\u003c/td>\u003ctd>1.0.0 → 1.1.0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PATCH\u003c/td>\u003ctd>补丁\u003c/td>\u003ctd>向下兼容的问题修复\u003c/td>\u003ctd>1.0.0 → 1.0.1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"预发布版本\">预发布版本\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>标识\u003c/th>\u003cth>含义\u003c/th>\u003cth>示例\u003c/th>\u003cth>使用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>alpha\u003c/td>\u003ctd>内部测试\u003c/td>\u003ctd>1.0.0-alpha.1\u003c/td>\u003ctd>功能开发中，不稳定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>beta\u003c/td>\u003ctd>公开测试\u003c/td>\u003ctd>1.0.0-beta.2\u003c/td>\u003ctd>功能基本完成，待反馈\u003c/td>\u003c/tr>\u003ctr>\u003ctd>rc\u003c/td>\u003ctd>候选发布\u003c/td>\u003ctd>1.0.0-rc.1\u003c/td>\u003ctd>即将正式发布，仅修复 bug\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"版本范围符号\">版本范围符号\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>符号\u003c/th>\u003cth>含义\u003c/th>\u003cth>示例\u003c/th>\u003cth>等价范围\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>^\u003c/code>\u003c/td>\u003ctd>兼容版本\u003c/td>\u003ctd>\u003ccode>^1.2.3\u003c/code>\u003c/td>\u003ctd>\u003ccode>&gt;=1.2.3 &lt;2.0.0\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~\u003c/code>\u003c/td>\u003ctd>近似版本\u003c/td>\u003ctd>\u003ccode>~1.2.3\u003c/code>\u003c/td>\u003ctd>\u003ccode>&gt;=1.2.3 &lt;1.3.0\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&gt;=\u003c/code>\u003c/td>\u003ctd>最低版本\u003c/td>\u003ctd>\u003ccode>&gt;=1.2.3\u003c/code>\u003c/td>\u003ctd>无上限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>=\u003c/code>\u003c/td>\u003ctd>精确版本\u003c/td>\u003ctd>\u003ccode>=1.2.3\u003c/code>\u003c/td>\u003ctd>仅 \u003ccode>1.2.3\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>*\u003c/code>\u003c/td>\u003ctd>任意版本\u003c/td>\u003ctd>\u003ccode>*\u003c/code>\u003c/td>\u003ctd>所有版本\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"changesets-核心概念\">Changesets 核心概念\u003c/h2>\n\u003ch3 id=\"什么是-changesets\">什么是 Changesets？\u003c/h3>\n\u003cp>Changesets 是一个用于管理 monorepo 版本与变更日志的工具，核心思想是：\u003c/p>\n\u003cul>\u003cli>\u003cstrong>每个变更都显式声明\u003c/strong>：开发者创建 changeset 文件描述本次改动\u003c/li>\u003cli>\u003cstrong>自动计算版本\u003c/strong>：根据 changeset 类型自动决定 bump 级别\u003c/li>\u003cli>\u003cstrong>自动生成 CHANGELOG\u003c/strong>：汇总所有 changeset 生成发布日志\u003c/li>\u003c/ul>\n\u003ch3 id=\"安装与初始化\">安装与初始化\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 安装\npnpm add -Dw @changesets/cli\n\n# 初始化\npnpm changeset init\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"changeset-文件结构\">Changeset 文件结构\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">markdown\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// .changeset/wise-pandas-dance.md\n---\n\n'@tutorial/ui': minor\n'@tutorial/utils': patch\n---\n\nfeat: 新增 Button 组件 loading 状态\nfix: 修复 utils 中 deepClone 循环引用问题\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"变更类型映射\">变更类型映射\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Changeset 类型\u003c/th>\u003cth>版本 bump\u003c/th>\u003cth>适用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>major\u003c/code>\u003c/td>\u003ctd>MAJOR +1\u003c/td>\u003ctd>破坏性变更（breaking change）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>minor\u003c/code>\u003c/td>\u003ctd>MINOR +1\u003c/td>\u003ctd>新功能（feature）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>patch\u003c/code>\u003c/td>\u003ctd>PATCH +1\u003c/td>\u003ctd>修复（fix）、文档（docs）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"版本发布流程\">版本发布流程\u003c/h2>\n\u003ch3 id=\"完整流程\">完整流程\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 1. 创建 changeset（每次功能开发后）\npnpm changeset\n\n# 交互式选择：\n# - 哪些包受到影响？\n# - 变更类型（major/minor/patch）？\n# - 变更描述？\n\n# 2. 版本计算（合并所有 changeset）\npnpm version\n# 或 pnpm changeset version\n\n# 自动执行：\n# - 更新 package.json 版本号\n# - 生成 CHANGELOG.md\n# - 删除已消费的 changeset 文件\n\n# 3. 发布到 registry\npnpm release\n# 或 pnpm changeset publish\n\n# 自动执行：\n# - 构建所有包\n# - 替换 workspace:* 为真实版本号\n# - 发布到 npm\n# - 创建 git tag\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"发布前检查清单\">发布前检查清单\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 检查 workspace 依赖是否已替换\npnpm publish --dry-run\n\n# 检查包内容\npnpm pack --dry-run\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"版本同步策略\">版本同步策略\u003c/h2>\n\u003ch3 id=\"固定版本模式-fixed\">固定版本模式（Fixed）\u003c/h3>\n\u003cp>所有包使用相同版本号，任何变更触发全量发布：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// .changeset/config.json\n{\n  \"changelog\": \"@changesets/cli/changelog\",\n  \"commit\": false,\n  \"fixed\": [[\"@tutorial/*\"]],\n  \"linked\": [],\n  \"access\": \"restricted\",\n  \"baseBranch\": \"main\"\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"独立版本模式-independent\">独立版本模式（Independent）\u003c/h3>\n\u003cp>每个包独立维护版本号：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>{\n  \"fixed\": [],\n  \"linked\": [[\"@tutorial/types\", \"@tutorial/utils\"]]\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>模式\u003c/th>\u003cth>优点\u003c/th>\u003cth>缺点\u003c/th>\u003cth>适用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fixed\u003c/td>\u003ctd>版本一致，易于理解\u003c/td>\u003ctd>无变更的包也被 bump\u003c/td>\u003ctd>强耦合包组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Linked\u003c/td>\u003ctd>部分同步\u003c/td>\u003ctd>配置复杂\u003c/td>\u003ctd>中等耦合包组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Independent\u003c/td>\u003ctd>灵活，按需发布\u003c/td>\u003ctd>版本碎片化\u003c/td>\u003ctd>松散耦合包组\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"预发布与灰度\">预发布与灰度\u003c/h2>\n\u003ch3 id=\"创建预发布版本\">创建预发布版本\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 进入预发布模式\npnpm changeset pre enter beta\n\n# 创建 changeset\npnpm changeset\n\n# 版本计算（生成 1.0.0-beta.1）\npnpm version\n\n# 发布（带 tag）\npnpm release --tag beta\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"退出预发布\">退出预发布\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 退出预发布模式\npnpm changeset pre exit\n\n# 正式发布\npnpm version\npnpm release\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"灰度发布策略\">灰度发布策略\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// package.json\n{\n  \"publishConfig\": {\n    \"access\": \"public\",\n    \"tag\": \"beta\" // 默认发布到 beta 标签\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 用户安装特定标签\npnpm add @tutorial/ui@beta\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"最佳实践\">最佳实践\u003c/h2>\n\u003ch3 id=\"1.-提交规范与-changeset-关联\">1. 提交规范与 Changeset 关联\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># Conventional Commits 与 changeset 类型映射\nfeat: xxx          → minor\nfix: xxx           → patch\nBREAKING CHANGE:   → major\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"2.-自动化-changeset-生成\">2. 自动化 Changeset 生成\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .github/workflows/changeset.yml\n- name: Create Release Pull Request\n  uses: changesets/action@v1\n  with:\n    version: pnpm version\n    publish: pnpm release\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"3.-版本回滚\">3. 版本回滚\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 撤销最近一次发布\ngit tag -d v1.0.1\ngit push origin :refs/tags/v1.0.1\n\n# 回滚代码\ngit revert HEAD~1\n\n# 重新发布\npnpm release\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"下一步\">下一步\u003c/h2>\n\u003cp>版本管理配置完成后，请继续阅读 \u003ca data-goto=\"d07\">07-ci-cd.md\u003c/a>，搭建完整的 CI/CD 流水线。\u003c/p>"},{"id":"d07","file":"docs/07-ci-cd.md","group":"ref","no":"参 7","short":"CI/CD 流水线配置","title":"CI/CD 流水线配置","tagline":"GitHub Actions 红线门禁、自动发版、多环境部署与回滚","level":"高级","minutes":35,"html":"\u003cblockquote>\u003cp>本章详解 GitHub Actions 配置模板、自动化测试配置、构建流程自动化及多环境部署策略。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>工作流全图\u003c/strong>：\u003cfigure class=\"comic-figure\" data-svg=\"flow-dev-workflow\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind diagram\">图解\u003c/span>\u003cspan class=\"cf-caption\">开发工作流示意图\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\u003c/p>\n\u003ch2 id=\"目录\">目录\u003c/h2>\n\u003cul>\u003cli>\u003ca data-anchor=\"github-actions-基础\">GitHub Actions 基础\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"自动化测试配置\">自动化测试配置\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"构建流程自动化\">构建流程自动化\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"多环境部署策略\">多环境部署策略\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"部署前验证机制\">部署前验证机制\u003c/a>\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"github-actions-基础\">GitHub Actions 基础\u003c/h2>\n\u003ch3 id=\"完整-ci-配置模板\">完整 CI 配置模板\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .github/workflows/ci.yml\nname: CI\n\non:\n  push:\n    branches: [main, develop]\n  pull_request:\n    branches: [main]\n\nenv:\n  NODE_VERSION: \"18\"\n  PNPM_VERSION: \"8\"\n\njobs:\n  setup:\n    runs-on: ubuntu-latest\n    outputs:\n      cache-key: ${{ steps.cache-key.outputs.key }}\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: ${{ env.NODE_VERSION }}\n\n      - name: Setup pnpm\n        uses: pnpm/action-setup@v2\n        with:\n          version: ${{ env.PNPM_VERSION }}\n\n      - name: Get pnpm store directory\n        id: pnpm-cache\n        run: echo \"STORE_PATH=$(pnpm store path)\" &gt;&gt; $GITHUB_OUTPUT\n\n      - name: Setup pnpm cache\n        uses: actions/cache@v3\n        with:\n          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}\n          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}\n          restore-keys: |\n            ${{ runner.os }}-pnpm-store-\n\n      - name: Generate cache key\n        id: cache-key\n        run: echo \"key=${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}\" &gt;&gt; $GITHUB_OUTPUT\n\n  lint:\n    needs: setup\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: ./.github/actions/setup-pnpm\n\n      - name: Install dependencies\n        run: pnpm install --frozen-lockfile\n\n      - name: Run ESLint\n        run: pnpm lint\n\n      - name: Run Prettier\n        run: pnpm format:check\n\n  typecheck:\n    needs: setup\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: ./.github/actions/setup-pnpm\n\n      - name: Install dependencies\n        run: pnpm install --frozen-lockfile\n\n      - name: TypeScript check\n        run: pnpm typecheck\n\n  test:\n    needs: setup\n    runs-on: ubuntu-latest\n    strategy:\n      matrix:\n        node-version: [16, 18, 20]\n    steps:\n      - uses: actions/checkout@v4\n      - uses: ./.github/actions/setup-pnpm\n        with:\n          node-version: ${{ matrix.node-version }}\n\n      - name: Install dependencies\n        run: pnpm install --frozen-lockfile\n\n      - name: Run tests\n        run: pnpm test\n\n      - name: Upload coverage\n        uses: codecov/codecov-action@v3\n        if: matrix.node-version == 18\n\n  build:\n    needs: [lint, typecheck, test]\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: ./.github/actions/setup-pnpm\n\n      - name: Install dependencies\n        run: pnpm install --frozen-lockfile\n\n      - name: Build all packages\n        run: pnpm build\n\n      - name: Upload artifacts\n        uses: actions/upload-artifact@v3\n        with:\n          name: dist\n          path: |\n            apps/*/dist\n            packages/*/dist\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"可复用-action\">可复用 Action\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .github/actions/setup-pnpm/action.yml\nname: \"Setup pnpm\"\ndescription: \"Setup Node.js, pnpm and cache\"\ninputs:\n  node-version:\n    description: \"Node.js version\"\n    default: \"18\"\n\nruns:\n  using: composite\n  steps:\n    - name: Setup Node.js\n      uses: actions/setup-node@v4\n      with:\n        node-version: ${{ inputs.node-version }}\n\n    - name: Setup pnpm\n      uses: pnpm/action-setup@v2\n      with:\n        version: 8\n\n    - name: Get pnpm store directory\n      id: pnpm-cache\n      shell: bash\n      run: echo \"STORE_PATH=$(pnpm store path)\" &gt;&gt; $GITHUB_OUTPUT\n\n    - name: Setup pnpm cache\n      uses: actions/cache@v3\n      with:\n        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}\n        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}\n        restore-keys: |\n          ${{ runner.os }}-pnpm-store-\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"自动化测试配置\">自动化测试配置\u003c/h2>\n\u003ch3 id=\"单元测试-vitest\">单元测试（Vitest）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// package.json\n{\n  \"scripts\": {\n    \"test\": \"vitest run\",\n    \"test:watch\": \"vitest\",\n    \"test:coverage\": \"vitest run --coverage\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">ts\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// vitest.config.ts\nimport { defineConfig } from \"vitest/config\";\n\nexport default defineConfig({\n  test: {\n    globals: true,\n    environment: \"node\",\n    coverage: {\n      provider: \"v8\",\n      reporter: [\"text\", \"json\", \"html\"],\n      exclude: [\"node_modules/\", \"dist/\", \"**/*.test.ts\"],\n    },\n  },\n});\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"集成测试-playwright\">集成测试（Playwright）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .github/workflows/e2e.yml\n- name: Install Playwright\n  run: pnpm exec playwright install --with-deps\n\n- name: Run E2E tests\n  run: pnpm test:e2e\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"构建流程自动化\">构建流程自动化\u003c/h2>\n\u003ch3 id=\"变更检测与增量构建\">变更检测与增量构建\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>- name: Detect changed packages\n  id: changes\n  uses: dorny/paths-filter@v2\n  with:\n    filters: |\n      packages:\n        - 'packages/**'\n      apps:\n        - 'apps/**'\n\n- name: Build packages\n  if: steps.changes.outputs.packages == 'true'\n  run: pnpm --filter ./packages/* build\n\n- name: Build apps\n  if: steps.changes.outputs.apps == 'true'\n  run: pnpm --filter ./apps/* build\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"并行构建\">并行构建\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>strategy:\n  matrix:\n    shard: [1, 2, 3]\nsteps:\n  - name: Build shard\n    run: pnpm --filter \"...[HEAD~1]\" --shard ${{ matrix.shard }}/3 build\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"多环境部署策略\">多环境部署策略\u003c/h2>\n\u003ch3 id=\"环境矩阵\">环境矩阵\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>环境\u003c/th>\u003cth>分支\u003c/th>\u003cth>触发条件\u003c/th>\u003cth>部署目标\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>development\u003c/td>\u003ctd>develop\u003c/td>\u003ctd>push\u003c/td>\u003ctd>开发服务器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>staging\u003c/td>\u003ctd>release/*\u003c/td>\u003ctd>PR 创建\u003c/td>\u003ctd>预发布环境\u003c/td>\u003c/tr>\u003ctr>\u003ctd>production\u003c/td>\u003ctd>main\u003c/td>\u003ctd>tag 创建\u003c/td>\u003ctd>生产环境\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"部署配置\">部署配置\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .github/workflows/deploy.yml\nname: Deploy\n\non:\n  push:\n    branches: [main, develop]\n    tags: [\"v*\"]\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    environment:\n      name: ${{ github.ref == 'refs/heads/main' &amp;&amp; 'production' || 'staging' }}\n      url: ${{ steps.deploy.outputs.url }}\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup environment\n        run: |\n          if [[ \"${{ github.ref }}\" == \"refs/heads/main\" ]]; then\n            echo \"API_URL=https://api.example.com\" &gt;&gt; $GITHUB_ENV\n          else\n            echo \"API_URL=https://api-staging.example.com\" &gt;&gt; $GITHUB_ENV\n          fi\n\n      - name: Deploy to Vercel\n        id: deploy\n        uses: amondnet/vercel-action@v25\n        with:\n          vercel-token: ${{ secrets.VERCEL_TOKEN }}\n          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}\n          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}\n          vercel-args: ${{ github.ref == 'refs/heads/main' &amp;&amp; '--prod' || '' }}\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"部署前验证机制\">部署前验证机制\u003c/h2>\n\u003ch3 id=\"质量门禁\">质量门禁\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .github/workflows/quality-gate.yml\nname: Quality Gate\n\non:\n  pull_request:\n    branches: [main]\n\njobs:\n  quality:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Install dependencies\n        run: pnpm install --frozen-lockfile\n\n      - name: Lint\n        run: pnpm lint\n\n      - name: Type check\n        run: pnpm typecheck\n\n      - name: Test\n        run: pnpm test -- --coverage\n\n      - name: Coverage threshold\n        run: |\n          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')\n          if (( $(echo \"$COVERAGE &lt; 80\" | bc -l) )); then\n            echo \"Coverage $COVERAGE% is below 80%\"\n            exit 1\n          fi\n\n      - name: Bundle size check\n        run: |\n          pnpm build\n          SIZE=$(du -sb apps/web/dist | cut -f1)\n          if [ $SIZE -gt 10485760 ]; then\n            echo \"Bundle size exceeds 10MB\"\n            exit 1\n          fi\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"安全扫描\">安全扫描\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>- name: Security audit\n  run: pnpm audit --audit-level=high\n\n- name: License check\n  run: pnpm licenses list --json &gt; licenses.json\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"最佳实践\">最佳实践\u003c/h2>\n\u003ch3 id=\"1.-缓存优化\">1. 缓存优化\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>- name: Cache build outputs\n  uses: actions/cache@v3\n  with:\n    path: |\n      node_modules/.cache\n      .turbo\n      dist\n    key: ${{ runner.os }}-build-${{ hashFiles('**/pnpm-lock.yaml') }}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"2.-通知集成\">2. 通知集成\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>- name: Notify on failure\n  if: failure()\n  uses: 8398a7/action-slack@v3\n  with:\n    status: ${{ job.status }}\n    text: \"CI failed on ${{ github.ref }}\"\n    webhook_url: ${{ secrets.SLACK_WEBHOOK }}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"3.-自动发布\">3. 自动发布\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .github/workflows/release.yml\nname: Release\n\non:\n  push:\n    branches: [main]\n\njobs:\n  release:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: ./.github/actions/setup-pnpm\n\n      - name: Create Release PR\n        uses: changesets/action@v1\n        with:\n          version: pnpm version\n          publish: pnpm release\n          createGithubReleases: true\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"检查清单\">检查清单\u003c/h2>\n\u003cul>\u003cli>[ ] GitHub Actions 工作流已配置\u003c/li>\u003cli>[ ] 缓存策略已优化\u003c/li>\u003cli>[ ] 测试覆盖率门禁已设置\u003c/li>\u003cli>[ ] 多环境部署已配置\u003c/li>\u003cli>[ ] 安全扫描已集成\u003c/li>\u003cli>[ ] 自动发布流程已验证\u003c/li>\u003c/ul>"},{"id":"d08","file":"docs/git-workflow.md","group":"ref","no":"参 8","short":"Git 协作与提交规范","title":"Git 协作与提交规范","tagline":"分支模型、Conventional Commits、commitlint 与 Code Review","level":"进阶","minutes":20,"html":"\u003cblockquote>\u003cp>本文档定义项目的 Git 分支管理策略、提交信息规范及版本标签管理方案。\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"目录\">目录\u003c/h2>\n\u003cul>\u003cli>\u003ca data-anchor=\"分支策略\">分支策略\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"提交信息规范\">提交信息规范\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"版本标签管理\">版本标签管理\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"代码审查流程\">代码审查流程\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"紧急修复流程\">紧急修复流程\u003c/a>\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"分支策略\">分支策略\u003c/h2>\n\u003ch3 id=\"分支模型\">分支模型\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>main (stable)\n  │\n  ├── develop (integration)\n  │     │\n  │     ├── feature/add-user-auth\n  │     ├── feature/upgrade-react-19\n  │     └── fix/login-redirect-loop\n  │\n  ├── release/v1.2.0\n  │\n  └── hotfix/security-patch\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"分支说明\">分支说明\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>分支\u003c/th>\u003cth>用途\u003c/th>\u003cth>生命周期\u003c/th>\u003cth>保护规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>main\u003c/code>\u003c/td>\u003ctd>生产环境稳定代码\u003c/td>\u003ctd>永久\u003c/td>\u003ctd>禁止直接 push，需 PR + 2 approvals\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>develop\u003c/code>\u003c/td>\u003ctd>开发集成分支\u003c/td>\u003ctd>永久\u003c/td>\u003ctd>禁止直接 push，需 PR + 1 approval\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>feature/*\u003c/code>\u003c/td>\u003ctd>功能开发\u003c/td>\u003ctd>短期（&lt; 2 周）\u003c/td>\u003ctd>无保护，可 force push\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fix/*\u003c/code>\u003c/td>\u003ctd>bug 修复\u003c/td>\u003ctd>短期（&lt; 1 周）\u003c/td>\u003ctd>无保护\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>release/*\u003c/code>\u003c/td>\u003ctd>发布准备\u003c/td>\u003ctd>短期（&lt; 3 天）\u003c/td>\u003ctd>仅允许 bug fix，禁止新功能\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hotfix/*\u003c/code>\u003c/td>\u003ctd>紧急修复\u003c/td>\u003ctd>极短（&lt; 1 天）\u003c/td>\u003ctd>需快速 review\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"分支命名规范\">分支命名规范\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>前缀\u003c/th>\u003cth>格式\u003c/th>\u003cth>示例\u003c/th>\u003cth>使用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>feature/\u003c/code>\u003c/td>\u003ctd>\u003ccode>feature/描述\u003c/code>\u003c/td>\u003ctd>\u003ccode>feature/add-dark-mode\u003c/code>\u003c/td>\u003ctd>新功能开发\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fix/\u003c/code>\u003c/td>\u003ctd>\u003ccode>fix/描述\u003c/code>\u003c/td>\u003ctd>\u003ccode>fix/login-crash\u003c/code>\u003c/td>\u003ctd>非紧急 bug 修复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hotfix/\u003c/code>\u003c/td>\u003ctd>\u003ccode>hotfix/描述\u003c/code>\u003c/td>\u003ctd>\u003ccode>hotfix/security-xss\u003c/code>\u003c/td>\u003ctd>生产环境紧急修复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>release/\u003c/code>\u003c/td>\u003ctd>\u003ccode>release/版本号\u003c/code>\u003c/td>\u003ctd>\u003ccode>release/v1.2.0\u003c/code>\u003c/td>\u003ctd>发布准备\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>chore/\u003c/code>\u003c/td>\u003ctd>\u003ccode>chore/描述\u003c/code>\u003c/td>\u003ctd>\u003ccode>chore/update-deps\u003c/code>\u003c/td>\u003ctd>构建/依赖更新\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>docs/\u003c/code>\u003c/td>\u003ctd>\u003ccode>docs/描述\u003c/code>\u003c/td>\u003ctd>\u003ccode>docs/update-readme\u003c/code>\u003c/td>\u003ctd>文档更新\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>refactor/\u003c/code>\u003c/td>\u003ctd>\u003ccode>refactor/描述\u003c/code>\u003c/td>\u003ctd>\u003ccode>refactor/simplify-api\u003c/code>\u003c/td>\u003ctd>代码重构\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>perf/\u003c/code>\u003c/td>\u003ctd>\u003ccode>perf/描述\u003c/code>\u003c/td>\u003ctd>\u003ccode>perf/optimize-render\u003c/code>\u003c/td>\u003ctd>性能优化\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>test/\u003c/code>\u003c/td>\u003ctd>\u003ccode>test/描述\u003c/code>\u003c/td>\u003ctd>\u003ccode>test/add-e2e\u003c/code>\u003c/td>\u003ctd>测试相关\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"提交信息规范\">提交信息规范\u003c/h2>\n\u003ch3 id=\"conventional-commits-格式\">Conventional Commits 格式\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>&lt;type&gt;(&lt;scope&gt;): &lt;subject&gt;\n\n&lt;body&gt;\n\n&lt;footer&gt;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"type-类型\">Type 类型\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>含义\u003c/th>\u003cth>版本 bump\u003c/th>\u003cth>示例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>feat\u003c/code>\u003c/td>\u003ctd>新功能\u003c/td>\u003ctd>MINOR\u003c/td>\u003ctd>\u003ccode>feat(ui): add dark mode toggle\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fix\u003c/code>\u003c/td>\u003ctd>修复 bug\u003c/td>\u003ctd>PATCH\u003c/td>\u003ctd>\u003ccode>fix(api): handle null pointer\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>docs\u003c/code>\u003c/td>\u003ctd>文档更新\u003c/td>\u003ctd>无\u003c/td>\u003ctd>\u003ccode>docs: update setup guide\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>style\u003c/code>\u003c/td>\u003ctd>代码格式\u003c/td>\u003ctd>无\u003c/td>\u003ctd>\u003ccode>style: fix indentation\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>refactor\u003c/code>\u003c/td>\u003ctd>重构\u003c/td>\u003ctd>无\u003c/td>\u003ctd>\u003ccode>refactor(utils): simplify deepClone\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>perf\u003c/code>\u003c/td>\u003ctd>性能优化\u003c/td>\u003ctd>PATCH\u003c/td>\u003ctd>\u003ccode>perf(build): enable tree shaking\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>test\u003c/code>\u003c/td>\u003ctd>测试相关\u003c/td>\u003ctd>无\u003c/td>\u003ctd>\u003ccode>test(ui): add Button test cases\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>chore\u003c/code>\u003c/td>\u003ctd>构建/工具链\u003c/td>\u003ctd>无\u003c/td>\u003ctd>\u003ccode>chore: upgrade pnpm to 8.15\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ci\u003c/code>\u003c/td>\u003ctd>CI/CD 变更\u003c/td>\u003ctd>无\u003c/td>\u003ctd>\u003ccode>ci: add GitHub Actions cache\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>revert\u003c/code>\u003c/td>\u003ctd>回滚提交\u003c/td>\u003ctd>PATCH\u003c/td>\u003ctd>\u003ccode>revert: feat(ui): add dark mode\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"scope-范围\">Scope（范围）\u003c/h3>\n\u003cp>使用包名或模块名作为 scope：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>feat(ui): add Button loading state\nfix(api): resolve CORS issue\ndocs(setup): add Node.js version requirement\nchore(deps): upgrade typescript to 5.3.3\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"subject-主题\">Subject（主题）\u003c/h3>\n\u003cul>\u003cli>使用祈使句（imperative mood）\u003c/li>\u003cli>首字母小写\u003c/li>\u003cli>不超过 50 个字符\u003c/li>\u003cli>不以句号结尾\u003c/li>\u003c/ul>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 好\nfeat(ui): add Button loading state\n\n# 差\nfeat(ui): Added Button loading state.\nfeat(ui): adds button loading state\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"body-正文\">Body（正文）\u003c/h3>\n\u003cul>\u003cli>详细说明变更原因和影响\u003c/li>\u003cli>与 subject 空一行\u003c/li>\u003cli>每行不超过 72 个字符\u003c/li>\u003c/ul>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>feat(ui): add Button loading state\n\n- 新增 loading 属性，显示 spinner\n- 禁用按钮防止重复提交\n- 兼容所有现有 variant\n\nCloses #123\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"footer-脚注\">Footer（脚注）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 关联 Issue\nCloses #123\nFixes #456\nRefs #789\n\n# 破坏性变更\nBREAKING CHANGE: Button 的 type 属性改为 variant\n\n# 共同作者\nCo-authored-by: Name &lt;email@example.com&gt;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"完整示例\">完整示例\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>feat(auth): implement OAuth2 login flow\n\n- 新增 Google OAuth2 登录支持\n- 添加 refresh token 自动续期\n- 登录状态持久化到 localStorage\n\nCloses #234\nBREAKING CHANGE: 登录接口返回格式从 { token } 改为 { accessToken, refreshToken }\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"版本标签管理\">版本标签管理\u003c/h2>\n\u003ch3 id=\"标签命名规范\">标签命名规范\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>格式\u003c/th>\u003cth>示例\u003c/th>\u003cth>使用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正式版\u003c/td>\u003ctd>\u003ccode>vX.Y.Z\u003c/code>\u003c/td>\u003ctd>\u003ccode>v1.2.0\u003c/code>\u003c/td>\u003ctd>生产发布\u003c/td>\u003c/tr>\u003ctr>\u003ctd>预发布\u003c/td>\u003ctd>\u003ccode>vX.Y.Z-beta.N\u003c/code>\u003c/td>\u003ctd>\u003ccode>v1.2.0-beta.1\u003c/code>\u003c/td>\u003ctd>公开测试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>候选版\u003c/td>\u003ctd>\u003ccode>vX.Y.Z-rc.N\u003c/code>\u003c/td>\u003ctd>\u003ccode>v1.2.0-rc.1\u003c/code>\u003c/td>\u003ctd>发布候选\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内部版\u003c/td>\u003ctd>\u003ccode>vX.Y.Z-alpha.N\u003c/code>\u003c/td>\u003ctd>\u003ccode>v1.2.0-alpha.1\u003c/code>\u003c/td>\u003ctd>内部测试\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"创建标签\">创建标签\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 创建带注释的标签（推荐）\ngit tag -a v1.2.0 -m \"Release v1.2.0: add dark mode and performance improvements\"\n\n# 创建轻量标签（不推荐）\ngit tag v1.2.0\n\n# 推送标签到远程\ngit push origin v1.2.0\n\n# 推送所有标签\ngit push origin --tags\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"标签策略\">标签策略\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 从 main 分支创建正式版标签\ngit checkout main\ngit pull origin main\ngit tag -a v1.2.0 -m \"Release v1.2.0\"\ngit push origin v1.2.0\n\n# 从 release 分支创建预发布标签\ngit checkout release/v1.2.0\ngit tag -a v1.2.0-beta.1 -m \"Beta release for testing\"\ngit push origin v1.2.0-beta.1\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"代码审查流程\">代码审查流程\u003c/h2>\n\u003ch3 id=\"pr-创建\">PR 创建\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 1. 创建功能分支\ngit checkout -b feature/add-dark-mode develop\n\n# 2. 提交代码\ngit add .\ngit commit -m \"feat(ui): add dark mode toggle\"\n\n# 3. 推送分支\ngit push origin feature/add-dark-mode\n\n# 4. 创建 PR\ngh pr create --title \"feat(ui): add dark mode toggle\" \\\n  --body \"实现暗色模式切换功能，包含：\n- 主题切换按钮组件\n- localStorage 持久化\n- 系统偏好自动检测\n\nCloses #123\"\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"pr-审查清单\">PR 审查清单\u003c/h3>\n\u003cul>\u003cli>[ ] 代码符合项目规范\u003c/li>\u003cli>[ ] 包含必要的测试\u003c/li>\u003cli>[ ] 文档已更新\u003c/li>\u003cli>[ ] 无 console.log 等调试代码\u003c/li>\u003cli>[ ] 无敏感信息泄露\u003c/li>\u003cli>[ ] 性能影响已评估\u003c/li>\u003c/ul>\n\u003ch3 id=\"合并策略\">合并策略\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>策略\u003c/th>\u003cth>命令\u003c/th>\u003cth>优点\u003c/th>\u003cth>缺点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Merge\u003c/td>\u003ctd>\u003ccode>git merge --no-ff\u003c/code>\u003c/td>\u003ctd>保留完整历史\u003c/td>\u003ctd>历史线复杂\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Squash\u003c/td>\u003ctd>\u003ccode>git merge --squash\u003c/code>\u003c/td>\u003ctd>历史简洁\u003c/td>\u003ctd>丢失提交细节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rebase\u003c/td>\u003ctd>\u003ccode>git rebase develop\u003c/code>\u003c/td>\u003ctd>线性历史\u003c/td>\u003ctd>需协调冲突\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>推荐策略\u003c/strong>：\u003c/p>\n\u003cul>\u003cli>\u003ccode>feature/*\u003c/code> -&gt; \u003ccode>develop\u003c/code>: Squash and merge\u003c/li>\u003cli>\u003ccode>develop\u003c/code> -&gt; \u003ccode>main\u003c/code>: Merge commit\u003c/li>\u003cli>\u003ccode>hotfix/*\u003c/code> -&gt; \u003ccode>main\u003c/code>: Rebase and merge\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"紧急修复流程\">紧急修复流程\u003c/h2>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 1. 从 main 创建 hotfix 分支\ngit checkout main\ngit checkout -b hotfix/security-patch\n\n# 2. 修复并提交\ngit commit -m \"fix(security): patch XSS vulnerability\"\n\n# 3. 创建标签\ngit tag -a v1.2.1 -m \"Hotfix: security patch\"\n\n# 4. 合并回 main 和 develop\ngit checkout main\ngit merge --no-ff hotfix/security-patch\ngit push origin main --tags\n\ngit checkout develop\ngit merge --no-ff hotfix/security-patch\ngit push origin develop\n\n# 5. 删除 hotfix 分支\ngit branch -d hotfix/security-patch\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"git-钩子-husky\">Git 钩子（Husky）\u003c/h2>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// package.json\n{\n  \"scripts\": {\n    \"prepare\": \"husky install\"\n  },\n  \"devDependencies\": {\n    \"husky\": \"^8.0.3\",\n    \"lint-staged\": \"^15.2.0\"\n  },\n  \"lint-staged\": {\n    \"*.{ts,tsx}\": [\"eslint --fix\", \"prettier --write\"],\n    \"*.{md,json}\": [\"prettier --write\"]\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .husky/pre-commit\n#!/bin/sh\nnpx lint-staged\n\n# .husky/commit-msg\n#!/bin/sh\nnpx --no -- commitlint --edit \"$1\"\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">js\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// commitlint.config.js\nmodule.exports = {\n  extends: [\"@commitlint/config-conventional\"],\n  rules: {\n    \"type-enum\": [\n      2,\n      \"always\",\n      [\n        \"feat\",\n        \"fix\",\n        \"docs\",\n        \"style\",\n        \"refactor\",\n        \"perf\",\n        \"test\",\n        \"chore\",\n        \"ci\",\n        \"revert\",\n      ],\n    ],\n    \"scope-empty\": [0],\n    \"subject-empty\": [2, \"never\"],\n    \"subject-full-stop\": [2, \"never\", \".\"],\n  },\n};\u003c/code>\u003c/pre>\u003c/div>"},{"id":"appendix","group":"appendix","appendix":true,"no":"附","short":"附录 · 图解画廊","title":"附录 · 全系列图解画廊","tagline":"5 话漫画 + 5 张架构图，一次看全","level":"入门","minutes":10,"html":"\u003cblockquote>\u003cp>本画廊收录全部 \u003cstrong>5 话连载漫画\u003c/strong>与 \u003cstrong>5 张架构/流程图解\u003c/strong>。点击任意图画可全屏放大，并可用 ← / → 键顺序浏览；所有图画均为内联 SVG，离线可用。\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"all-comics\">一、五话连载漫画\u003c/h2>\n\u003cfigure class=\"comic-figure\" data-svg=\"comic-01-npm-disk-disaster\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind comic\">漫画\u003c/span>\u003cspan class=\"cf-caption\">第 1 话 · 磁盘君的眼泪\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开…\u003c/div>\u003c/div>\u003c/fi 003cfigure class=\"comic-figure\" data-svg=\"dependency-comparison\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind diagram\">图解\u003c/span>\u003cspan class=\"cf-caption\">图解 · npm vs pnpm 结构对比\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开…\u003c/div>\u003c/div>\u003c/figure>\n\u003cfigure class=\"comic-figure\" data-svg=\"flow-config-steps\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind diagram\">图解\u003c/span>\u003cspan class=\"cf-caption\">图解 · 从零配置 6 步流程\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开…\u003c/div>\u003c/div>\u003c/figure>\n\u003cfigure class=\"comic-figure\" data-svg=\"flow-dev-workflow\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind diagram\">图解\u003c/span>\u003cspan class=\"cf-caption\">图解 · 开发到自动发版工作流\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开…\u003c/div>\u003c/div>\u003c/figure>\n\u003ch2 id=\"all-next\">读完之后\u003c/h2>\n\u003cp>漫画负责建立直觉，\u003ca data-goto=\"d01\">参考手册\u003c/a>负责落地细节。回到 \u003ca data-goto=\"home\">书架\u003c/a> 选择下一篇。\u003c/p>"}],"figures":{"comic-01-npm-disk-disaster":{"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 840 660\" data-scope=\"comic-01-npm-disk-disaster\">\n  \u003cstyle> [data-scope=\"comic-01-npm-disk-disaster\"] text { font-family: -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif; } [data-scope=\"comic-01-npm-disk-disaster\"] .comic-01-npm-disk-disaster-ttl { font-size: 22px; font-weight: bold; fill: #2D3748; } [data-scope=\"comic-01-npm-disk-disaster\"] .comic-01-npm-disk-disaster-cap { font-size: 12px; fill: #2D3748; } [data-scope=\"comic-01-npm-disk-disaster\"] .comic-01-npm-disk-disaster-bub { font-size: 12.5px; fill: #2D3748; } [data-scope=\"comic-01-npm-disk-disaster\"] .comic-01-npm-disk-disaster-panel { fill: #FFFFFF; stroke: #2D3748; stroke-width: 3; } [data-scope=\"comic-01-npm-disk-disaster\"] .comic-01-npm-disk-disaster-capbox { fill: #FFE8A3; stroke: #2D3748; stroke-width: 1.5; } [data-scope=\"comic-01-npm-disk-disaster\"] .comic-01-npm-disk-disaster-bubble { fill: #FFFFFF; stroke: #2D3748; stroke-width: 2; } [data-scope=\"comic-01-npm-disk-disaster\"] .comic-01-npm-disk-disaster-num { fill: #2D3748; } [data-scope=\"comic-01-npm-disk-disaster\"] .comic-01-npm-disk-disaster-numt { fill: #FFFFFF; font-size: 12px; font-weight: bold; }\n  \u003c/style>\n\n  \u003crect width=\"840\" height=\"660\" fill=\"#FFF6E5\"/>\n  \u003ctext x=\"420\" y=\"42\" text-anchor=\"middle\" class=\"comic-01-npm-disk-disaster-ttl\">第 1 话 · 磁盘君的眼泪 —— pnpm 的诞生\u003c/text>\n\n  \u003c!-- ===== Panel 1 ===== -->\n  \u003cg>\n    \u003crect x=\"20\" y=\"70\" width=\"392\" height=\"252\" rx=\"14\" class=\"comic-01-npm-disk-disaster-panel\"/>\n    \u003ccircle cx=\"48\" cy=\"94\" r=\"13\" class=\"comic-01-npm-disk-disaster-num\"/>\u003ctext x=\"48\" y=\"99\" text-anchor=\"middle\" class=\"comic-01-npm-disk-disaster-numt\">1\u003c/text>\n    \u003crect x=\"70\" y=\"80\" width=\"230\" height=\"26\" rx=\"4\" class=\"comic-01-npm-disk-disaster-capbox\"/>\n    \u003ctext x=\"185\" y=\"97\" text-anchor=\"middle\" class=\"comic-01-npm-disk-disaster-cap\">从前，开发者小 P 每次装依赖…\u003c/text>\n\n    \u003c!-- 小P -->\n    \u003cg transform=\"translate(110,215)\">\n      \u003ccircle r=\"30\" fill=\"#FFD93D\" stroke=\"#2D3748\" stroke-width=\"3\"/>\n      \u003ccircle cx=\"-10\" cy=\"-5\" r=\"3.5\" fill=\"#2D3748\"/>\n      \u003ccircle cx=\"10\" cy=\"-5\" r=\"3.5\" fill=\"#2D3748\"/>\n      \u003cpath d=\"M -10 9 Q 0 17 10 9\" stroke=\"#2D3748\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>\n    \u003c/g>\n    \u003c!-- 笔记本电脑 -->\n    \u003cg transform=\"translate(230,190)\">\n      \u003crect x=\"-50\" y=\"-32\" width=\"100\" height=\"64\" rx=\"6\" fill=\"#4A5568\" stroke=\"#2D3748\" stroke-width=\"3\"/>\n      \u003crect x=\"-42\" y=\"-24\" width=\"84\" height=\"48\" rx=\"3\" fill=\"#BEE3F8\"/>\n      \u003ctext x=\"0\" y=\"-4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2B6CB0\">npm install\u003c/text>\n      \u003ctext x=\"0\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2B6CB0\">██████░░ 70%\u003c/text>\n      \u003crect x=\"-58\" y=\"32\" width=\"116\" height=\"8\" rx=\"4\" fill=\"#718096\" stroke=\"#2D3748\" stroke-width=\"2\"/>\n    \u003c/g>\n    \u003c!-- 气泡 -->\n    \u003crect x=\"55\" y=\"130\" width=\"180\" height=\"34\" rx=\"12\" class=\"comic-01-npm-disk-disaster-bubble\"/>\n    \u003cpolygon points=\"95,164 108,164 100,178\" fill=\"#fff\" stroke=\"#2D3748\" stroke-width=\"2\"/>\n    \u003ctext x=\"145\" y=\"151\" text-anchor=\"middle\" class=\"comic-01-npm-disk-disaster-bub\">装个依赖，马上就好啦！\u003c/text>\n  \u003c/g>\n\n  \u003c!-- ===== Panel 2 ===== -->\n  \u003cg>\n    \u003crect x=\"428\" y=\"70\" width=\"392\" height=\"252\" rx=\"14\" class=\"comic-01-npm-disk-disaster-panel\"/>\n    \u003ccircle cx=\"456\" cy=\"94\" r=\"13\" class=\"comic-01-npm-disk-disaster-num\"/>\u003ctext x=\"456\" y=\"99\" text-anchor=\"middle\" class=\"comic-01-npm-disk-disaster-numt\">2\u003c/text>\n    \u003crect x=\"478\" y=\"80\" width=\"230\" height=\"26\" rx=\"4\" class=\"comic-01-npm-disk-disaster-capbox\"/>\n    \u003ctext x=\"593\" y=\"97\" text-anchor=\"middle\" class=\"comic-01-npm-disk-disaster-cap\">node_modules 却越堆越多\u003c/text>\n\n    \u003c!-- 磁盘君 -->\n    \u003cg transform=\"translate(560,220)\">\n      \u003cellipse cx=\"0\" cy=\"-34\" rx=\"46\" ry=\"14\" fill=\"#90CDF4\" stroke=\"#2D3748\" stroke-width=\"3\"/>\n      \u003cpath d=\"M -46 -34 L -46 26 A 46 14 0 0 0 46 26 L 46 -34\" fill=\"#63B3ED\" stroke=\"#2D3748\" stroke-width=\"3\"/>\n      \u003cpath d=\"M -46 -8 A 46 14 0 0 0 46 -8\" fill=\"none\" stroke=\"#2D3748\" stroke-width=\"2\"/>\n      \u003c!-- 哭脸 -->\n      \u003ccircle cx=\"-13\" cy=\"-38\" r=\"3.5\" fill=\"#2D3748\"/>\n      \u003ccircle cx=\"13\" cy=\"-38\" r=\"3.5\" fill=\"#2D3748\"/>\n      \u003cpath d=\"M -10 -26 Q 0 -32 10 -26\" stroke=\"#2D3748\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>\n      \u003c!-- 眼泪 -->\n      \u003cpath d=\"M -20 -30 q -6 10 0 14 q 6 -4 0 -14\" fill=\"#4FC3F7\"/>\n    \u003c/g>\n    \u003c!-- 红色占用条 -->\n    \u003crect x=\"640\" y=\"238\" width=\"150\" height=\"18\" rx=\"9\" fill=\"#FED7D7\" stroke=\"#2D3748\" stroke-width=\"2\"/>\n    \u003crect x=\"640\" y=\"238\" width=\"141\" height=\"18\" rx=\"9\" fill=\"#FC8181\"/>\n    \u003ctext x=\"715\" y=\"229\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2D3748\">磁盘 94% 已满\u003c/text>\n\n    \u003crect x=\"620\" y=\"130\" width=\"184\" height=\"34\" rx=\"12\" class=\"comic-01-npm-disk-disaster-bubble\"/>\n    \u003cpolygon points=\"650,164 663,164 655,178\" fill=\"#fff\" stroke=\"#2D3748\" stroke-width=\"2\"/>\n    \u003ctext x=\"712\" y=\"151\" text-anchor=\"middle\" class=\"comic-01-npm-disk-disaster-bub\">每个项目 500MB，要爆啦！\u003c/text>\n  \u003c/g>\n\n  \u003c!-- ===== Panel 3 ===== -->\n  \u003cg>\n    \u003crect x=\"20\" y=\"340\" width=\"392\" height=\"252\" rx=\"14\" class=\"comic-01-npm-disk-disaster-panel\"/>\n    \u003ccircle cx=\"48\" cy=\"364\" r=\"13\" class=\"comic-01-npm-disk-disaster-num\"/>\u003ctext x=\"48\" y=\"369\" text-anchor=\"middle\" class=\"comic-01-npm-disk-disaster-numt\">3\u003c/text>\n    \u003crect x=\"70\" y=\"350\" width=\"230\" height=\"26\" rx=\"4\" class=\"comic-01-npm-disk-disaster-capbox\"/>\n    \u003ctext x=\"185\" y=\"367\" text-anchor=\"middle\" class=\"comic-01-npm-disk-disaster-cap\">更可怕的是「幽灵依赖」出没\u003c/text>\n\n    \u003c!-- 幽灵 -->\n    \u003cg transform=\"translate(115,480)\">\n      \u003cpath d=\"M -34 30 L -34 -10 A 34 34 0 0 1 34 -10 L 34 30 L 22 20 L 11 30 L 0 20 L -11 30 L -22 20 Z\"\n            fill=\"#E9D8FD\" stroke=\"#2D3748\" stroke-width=\"3\"/>\n      \u003ccircle cx=\"-11\" cy=\"-14\" r=\"4\" fill=\"#2D3748\"/>\n      \u003ccircle cx=\"11\" cy=\"-14\" r=\"4\" fill=\"#2D3748\"/>\n      \u003cellipse cx=\"0\" cy=\"0\" rx=\"6\" ry=\"8\" fill=\"# middle\" class=\"dependency-comparison-subtitle\">同一个项目，两种包管理器的 node_modules 结构差异\u003c/text>\n\n  \u003c!-- npm 结构 -->\n  \u003crect x=\"50\" y=\"100\" width=\"320\" height=\"350\" class=\"dependency-comparison-npm-box\" rx=\"8\"/>\n  \u003ctext x=\"210\" y=\"125\" text-anchor=\"middle\" class=\"dependency-comparison-label\" font-weight=\"bold\">npm 扁平结构\u003c/text>\n  \n  \u003crect x=\"70\" y=\"150\" width=\"280\" height=\"60\" fill=\"#ffffff\" stroke=\"#ef4444\" stroke-width=\"1\" rx=\"4\"/>\n  \u003ctext x=\"210\" y=\"175\" text-anchor=\"middle\" class=\"dependency-comparison-label\">node_modules/\u003c/text>\n  \u003ctext x=\"210\" y=\"195\" text-anchor=\"middle\" class=\"dependency-comparison-label\">lodash@4.17.21 (重复存储)\u003c/text>\n  \n  \u003crect x=\"70\" y=\"220\" width=\"280\" height=\"60\" fill=\"#ffffff\" stroke=\"#ef4444\" stroke-width=\"1\" rx=\"4\"/>\n  \u003ctext x=\"210\" y=\"245\" text-anchor=\"middle\" class=\"dependency-comparison-label\">react@18.2.0\u003c/text>\n  \u003ctext x=\"210\" y=\"265\" text-anchor=\"middle\" class=\"dependency-comparison-label\">react-dom@18.2.0\u003c/text>\n  \n  \u003crect x=\"70\" y=\"290\" width=\"280\" height=\"60\" fill=\"#ffffff\" stroke=\"#ef4444\" stroke-width=\"1\" rx=\"4\"/>\n  \u003ctext x=\"210\" y=\"315\" text-anchor=\"middle\" class=\"dependency-comparison-label\">some-lib/\u003c/text>\n  \u003ctext x=\"210\" y=\"335\" text-anchor=\"middle\" class=\"dependency-comparison-label\">└── node_modules/lodash@3.10.1 (版本冲突)\u003c/text>\n  \n  \u003crect x=\"70\" y=\"360\" width=\"280\" height=\"60\" fill=\"#ffffff\" stroke=\"#ef4444\" stroke-width=\"1\" rx=\"4\"/>\n  \u003ctext x=\"210\" y=\"385\" text-anchor=\"middle\" class=\"dependency-comparison-label\">other-lib/\u003c/text>\n  \u003ctext x=\"210\" y=\"405\" text-anchor=\"middle\" class=\"dependency-comparison-label\">└── node_modules/lodash@3.10.1 (又一份)\u003c/text>\n\n  \u003c!-- pnpm 结构 -->\n  \u003crect x=\"430\" y=\"100\" width=\"320\" height=\"350\" class=\"dependency-comparison-pnpm-box\" rx=\"8\"/>\n  \u003ctext x=\"590\" y=\"125\" text-anchor=\"middle\" class=\"dependency-comparison-label\" font-weight=\"bold\">pnpm 严格结构\u003c/text>\n  \n  \u003crect x=\"450\" y=\"150\" width=\"280\" height=\"80\" fill=\"#ffffff\" stroke=\"#3b82f6\" stroke-width=\"1\" rx=\"4\"/>\n  \u003ctext x=\"590\" y=\"175\" text-anchor=\"middle\" class=\"dependency-comparison-label\">node_modules/.pnpm/\u003c/text>\n  \u003ctext x=\"590\" y=\"195\" text-anchor=\"middle\" class=\"dependency-comparison-label\">lodash@4.17.21 (唯一实例)\u003c/text>\n  \u003ctext x=\"590\" y=\"215\" text-anchor=\"middle\" class=\"dependency-comparison-label\">lodash@3.10.1 (版本隔离)\u003c/text>\n  \n  \u003crect x=\"450\" y=\"240\" width=\"280\" height=\"60\" fill=\"#ffffff\" stroke=\"#3b82f6\" stroke-width=\"1\" rx=\"4\"/>\n  \u003ctext x=\"590\" y=\"265\" text-anchor=\"middle\" class=\"dependency-comparison-label\">react@18.2.0\u003c/text>\n  \u003ctext x=\"590\" y=\"285\" text-anchor=\"middle\" class=\"dependency-comparison-label\">react-dom@18.2.0\u003c/text>\n  \n  \u003crect x=\"450\" y=\"310\" width=\"280\" height=\"60\" fill=\"#ffffff\" stroke=\"#3b82f6\" stroke-width=\"1\" rx=\"4\"/>\n  \u003ctext x=\"590\" y=\"335\" text-anchor=\"middle\" class=\"dependency-comparison-label\">some-lib/node_modules/lodash -> ../../lodash@4.17.21\u003c/text>\n  \n  \u003crect x=\"450\" y=\"380\" width=\"280\" height=\"60\" fill=\"#ffffff\" stroke=\"#3b82f6\" stroke-width=\"1\" rx=\"4\"/>\n  \u003ctext x=\"590\" y=\"405\" text-anchor=\"middle\" class=\"dependency-comparison-label\">other-lib/node_modules/lodash -> ../../lodash@3.10.1\u003c/text>\n\n  \u003c!-- 对比指标 -->\n  \u003crect x=\"50\" y=\"480\" width=\"700\" height=\"60\" fill=\"#f9fafb\" stroke=\"#d1d5db\" stroke-width=\"1\" rx=\"4\"/>\n  \u003ctext x=\"200\" y=\"505\" text-anchor=\"middle\" class=\"dependency-comparison-label\" font-weight=\"bold\">npm 问题\u003c/text>\n  \u003ctext x=\"200\" y=\"525\" text-anchor=
