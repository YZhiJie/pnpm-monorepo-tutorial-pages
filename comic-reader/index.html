<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="pnpm Monorepo 全链路漫画图文教程：5 话漫画 + 3 篇图文 + 8 篇参考手册，单文件离线可读">
<title>pnpm Monorepo 漫画图文教程 · 离线全本</title>
<style>
/* ============================================================
 * pnpm Monorepo 漫画图文阅读器 · 样式表
 * 设计决策：
 * 1) 暖纸色主题，贴合「漫画书」阅读氛围；CSS 变量一键切换暗色
 * 2) 全部使用系统字体栈，零外部资源，保证 file:// 双击离线可用
 * 3) 漫画 SVG 靠 viewBox 自适应宽度（源文件不带 width/height）
 * ============================================================ */

:root {
  --bg: #f6f1e8;
  --bg-soft: #efe8db;
  --paper: #fffdf8;
  --paper-2: #fbf7ee;
  --ink: #2c2720;
  --ink-soft: #4a433a;
  --muted: #8a8073;
  --line: #e7ddcd;
  --accent: #e8761b;
  --accent-deep: #c25e0c;
  --accent-soft: #fdeedf;
  --blue: #3b6fd4;
  --green: #2f9e6e;
  --red: #d65a4b;
  --code-bg: #242a33;
  --code-ink: #e6edf3;
  --shadow: 0 10px 30px -12px rgba(80, 60, 30, 0.25);
  --radius: 16px;
  --sidebar-w: 288px;
}

:root[data-theme="dark"] {
  --bg: #19150f;
  --bg-soft: #1f1a13;
  --paper: #241f18;
  --paper-2: #2b251c;
  --ink: #ece4d6;
  --ink-soft: #cfc5b5;
  --muted: #9b917f;
  --line: #3a342a;
  --accent: #f08a3c;
  --accent-deep: #f5a05e;
  --accent-soft: #35291c;
  --blue: #7fa6ee;
  --green: #6fc39a;
  --red: #ee8c7e;
  --code-bg: #171c23;
  --code-ink: #e6edf3;
  --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.6);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family:
    -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}

::selection {
  background: var(--accent);
  color: #fff;
}

a {
  color: var(--accent-deep);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* ---------- 顶部阅读进度条 ---------- */
.read-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  width: 0;
  background: linear-gradient(90deg, var(--accent), #ffc46b);
  z-index: 60;
  transition: width 0.12s linear;
}

/* ---------- 侧边栏 ---------- */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  background: var(--paper);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  z-index: 40;
  transition: transform 0.25s ease;
}
.sidebar-brand {
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-brand:hover {
  text-decoration: none;
}
.brand-badge {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  flex: none;
  background: linear-gradient(135deg, var(--accent), #ffb45e);
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 20px;
  box-shadow: 0 6px 14px -6px var(--accent);
}
.brand-title {
  font-weight: 700;
  font-size: 15px;
  line-height: 1.35;
  color: var(--ink);
}
.brand-sub {
  font-size: 12px;
  color: var(--muted);
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px 24px;
}
.nav-group-label {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--muted);
  padding: 14px 12px 6px;
  font-weight: 600;
}
.nav-item {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 7px 12px;
  border-radius: 9px;
  font-size: 13.5px;
  color: var(--ink-soft);
  cursor: pointer;
  line-height: 1.45;
  margin-bottom: 2px;
}
.nav-item:hover {
  background: var(--paper-2);
  text-decoration: none;
}
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent-deep);
  font-weight: 600;
}
.nav-item .done {
  color: var(--green);
  font-size: 12px;
  margin-left: auto;
  flex: none;
}
.nav-item .nav-no {
  color: var(--muted);
  font-size: 11.5px;
  flex: none;
  width: 2.4em;
}
.nav-item.active .nav-no {
  color: var(--accent);
}

.nav-anchor {
  display: block;
  padding: 4px 12px 4px 38px;
  font-size: 12.5px;
  color: var(--muted);
  border-left: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-anchor:hover {
  color: var(--accent-deep);
  text-decoration: none;
}
.nav-anchor.active {
  color: var(--accent-deep);
  border-left-color: var(--accent);
  font-weight: 600;
}

/* ---------- 主区域 ---------- */
.main {
  margin-left: var(--sidebar-w);
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 22px;
}
.icon-btn {
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 10px;
  width: 38px;
  height: 38px;
  font-size: 16px;
  cursor: pointer;
  display: grid;
  place-items: center;
  flex: none;
}
.icon-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.topbar-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar-spacer {
  flex: 1;
}
.pct {
  font-size: 12.5px;
  color: var(--muted);
  min-width: 42px;
  text-align: right;
}

/* ---------- 书架首页 ---------- */
.home {
  max-width: 1080px;
  margin: 0 auto;
  padding: 40px 28px 80px;
}

.hero {
  background: linear-gradient(135deg, #fff6e8, #ffe9f0 60%, #e9f1ff);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 44px 44px 38px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}
:root[data-theme="dark"] .hero {
  background: linear-gradient(135deg, #2e261b, #33221f 60%, #1f2735);
}
.hero::after {
  content: "📚";
  position: absolute;
  right: 30px;
  bottom: -18px;
  font-size: 120px;

  transform: rotate(-8deg);
}
.hero h1 {
  margin: 0 0 10px;
  font-size: 32px;
  letter-spacing: 0.01em;
}
.hero p {
  margin: 0 0 22px;
  color: var(--ink-soft);
  font-size: 15.5px;
  max-width: 620px;
}
.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border-radius: 999px;
  padding: 11px 22px;
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  font-family: inherit;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 8px 18px -8px var(--accent);
}
.btn-primary:hover {
  background: var(--accent-deep);
  text-decoration: none;
}
.btn-ghost {
  background: var(--paper);

}
.hero-meta {

  gap: 22px;
  margin-top: 22px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
}
.hero-meta b {
  color: var(--ink);
  font-size: 15px;
  display: block;
}

.section-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 46px 0 18px;
}
.section-head h2 {
  margin: 0;
  font-size: 21px;
}
.section-head .hint {
  font-size: 13px;
  color: var(--muted);
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.cards.refs {
  grid-template-columns: repeat(4, 1fr);
}

.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 18px 16px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    border-color 0.15s;
  position: relative;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
  border-color: var(--accent);
  text-decoration: none;
}
.card-no {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-weight: 700;

  color: #fff;

}
.card.comic .card-no {

}
.card.ref .card-no {
  background: linear-gradient(135deg, var(--blue), #7fa6ee);
}
.card h3 {
  margin: 0;
  font-size: 16px;
  line-height: 1.45;

}
.card .tagline {

.card .tags {

}
.tag {

  padding: 2px 10px;
  border-radius: 999px;
  background: var(--paper-2);
  border: 1px solid var(--line);
  color: var(--muted);
}
.tag.lv-入门 {
  color: var(--green);
  border-color: currentColor;
}
.tag.lv-进阶 {
  color: var(--accent-deep);
  border-color: currentColor;
}
.tag.lv-高级 {
  color: var(--red);
  border-color: currentColor;
}
.card-progress {
  height: 4px;
  border-radius: 2px;
  background: var(--bg-soft);
  overflow: hidden;
}
.card-progress i {
  display: block;

  background: var(--green);
}
.card .done-flag {

  top: 14px;
  right: 14px;

/* 图解画廊 */
.gallery {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}
.gallery-item {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 8px;
  text-align: center;
  cursor: pointer;
  font-size: 12px;
  color: var(--ink-soft);
  transition:
    border-color 0.15s,
    transform 0.15s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.gallery-item:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  text-decoration: none;
}
.gallery-thumb {
  background: #fff;
  border-radius: 8px;

.gallery-thumb svg {

.reader {

  margin: 0 auto;

}

}

.chapter-head h1 {

}

.content h1,
.content h2,
.content h3,
.content h4 {

}

}
.content h2 {

  margin: 22px 0 8px;
}
.content p {
  margin: 12px 0;
}
.content ul,
.content ol {

  margin: 12px 0;
}
.content li {

}
.content li > ul,
.content li > ol {

}
.content hr {

}

}
.content blockquote {

}
.content blockquote p {

}

/* 表格 */
.table-wrap {

}
.content table {

.content th,

.content th {

}
.content tr:nth-child(even) td {

}

/* 代码块 */
.codeblock {
  margin: 16px 0;
  border-radius: 12px;

}
.codeblock-head {

.codeblock-copy:hover,
.codeblock-copy.ok {

}
.codeblock pre {

  padding: 14px 16px;

  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

.content :not(pre) > code {

  padding: 2px 7px;
  border-radius: 6px;
  font-size: 0.88em;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

/* ---------- 漫画/图解画框 ---------- */
.comic-figure {
  margin: 26px 0;

  border-radius: 18px;

}
.cf-head {

  margin-bottom: 10px;
  padding: 0 4px;

}
.cf-kind {

.cf-kind.comic {

}

}

}

}
.pager-btn .pager-label {

.pager-btn .pager-name {

  font-size: 14.5px;

.pager-btn.home-btn {

  width: 100%;

/* ---------- 灯箱 ----------
 * 尺寸策略（维护前必读）：
 * 1) .lb-frame 的宽高由客户端按「适应窗口」显式写入（width/height + flex:none），
 *    不能只给 max-width——SVG 源文件已剥离 width/height，在 flex 居中容器里
 *    会回退到 300x150 的默认对象尺寸，导致图片显示过小
 * 2) 缩放只有一个口径：直接改 SVG 的显式 width/height（fit 尺寸 × zoom），
 *    禁止再叠加 transform: scale，避免二次缩放
 */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(20, 16, 10, 0.82);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.lightbox.open {
  display: flex;
}
.lb-frame {
  flex: none;
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6);
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  /* 触屏拖拽平移：禁用浏览器默认滚动手势，改用指针事件 */
  touch-action: none;
}
.lb-frame.grabbing {
  cursor: grabbing;
}
.lb-frame svg {
  display: block;
  width: 100%;
  height: auto;
  flex: none;
}

/* 灯箱顶部缩放工具条 */
.lb-toolbar {
  position: fixed;

<script type="application/json" id="reader-data">{"meta":{"name":"pnpm-monorepo-tutorial","generatedAt":"2026-10-02T04:11:29.569Z"},"chapters":[{"id":"t1","file":"assets/tutorials/01-beginner.md","group":"comic","no":"01","short":"入门篇 · 为什么需要 pnpm Monorepo","title":"入门篇：为什么需要 pnpm Monorepo？","tagline":"磁盘君的眼泪：npm 三大痛点与 pnpm Store 的诞生","level":"入门","minutes":15,"comics":"第 1–2 话","html":"\u003cblockquote>\u003cp>\u003cstrong>阅读时长\u003c/strong>：15 分钟　|　\u003cstrong>前置要求\u003c/strong>：会用 npm 装包　|　\u003cstrong>配套漫画\u003c/strong>：第 1、2 话\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"你将学到\">你将学到\u003c/h2>\n\u003cul>\u003cli>npm 多项目模式下的三大痛点（磁盘、幽灵依赖、版本漂移）\u003c/li>\u003cli>pnpm 的 Store + 硬链接是如何一招解决它们的\u003c/li>\u003cli>Monorepo 与 Multi-repo 的本质差异与选型标准\u003c/li>\u003cli>本教程示例项目的最小可运行结构\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"一-先听个故事-磁盘君的眼泪\">一、先听个故事：磁盘君的眼泪\u003c/h2>\n\u003cfigure class=\"comic-figure\" data-svg=\"comic-01-npm-disk-disaster\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind comic\">漫画\u003c/span>\u003cspan class=\"cf-caption\">第 1 话 · 磁盘君的眼泪\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\n\u003cp>漫画里的三个场景，对应 npm 时代三个真实痛点：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>漫画场景\u003c/th>\u003cth>技术名词\u003c/th>\u003cth>后果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>每个项目各存一份 node_modules\u003c/td>\u003ctd>\u003cstrong>重复存储\u003c/strong>\u003c/td>\u003ctd>20 个项目 × 500MB = 10GB 浪费\u003c/td>\u003c/tr>\u003ctr>\u003ctd>代码引用了未声明的包还能跑\u003c/td>\u003ctd>\u003cstrong>幻影依赖（Phantom Dependency）\u003c/strong>\u003c/td>\u003ctd>某天 hoist 结构一变，线上直接崩溃\u003c/td>\u003c/tr>\u003ctr>\u003ctd>不同项目装同一包的不同版本\u003c/td>\u003ctd>\u003cstrong>版本漂移\u003c/strong>\u003c/td>\u003ctd>lock 文件也无法跨项目对齐\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"pnpm-的解法-内容寻址-store\">pnpm 的解法：内容寻址 Store\u003c/h3>\n\u003cfigure class=\"comic-figure\" data-svg=\"pnpm-architecture\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind diagram\">图解\u003c/span>\u003cspan class=\"cf-caption\">pnpm 三层架构\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\n\u003cp>核心思想一句话：\u003cstrong>包内容只存一份在全局 Store，项目里放硬链接\u003c/strong>。\u003c/p>\n\u003cul>\u003cli>下载的包按内容哈希（SHA）存入 \u003ccode>~/.pnpm-store\u003c/code>\u003c/li>\u003cli>项目 \u003ccode>node_modules/.pnpm/\u003c/code> 里是\u003cstrong>硬链接\u003c/strong>，指向 Store，不占额外磁盘\u003c/li>\u003cli>包之间用\u003cstrong>软链接\u003c/strong>组出非扁平结构，未声明的包根本摸不到 → 根治幻影依赖\u003c/li>\u003c/ul>\n\u003cblockquote>\u003cp>💡 \u003cstrong>类比\u003c/strong>：npm 像每家都买一套《百科全书》；pnpm 像全小区共享一个图书馆，每家只有借书证（链接）。\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"二-那-monorepo-又是什么\">二、那 Monorepo 又是什么？\u003c/h2>\n\u003cfigure class=\"comic-figure\" data-svg=\"monorepo-structure\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind diagram\">图解\u003c/span>\u003cspan class=\"cf-caption\">Monorepo 架构\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>维度\u003c/th>\u003cth>Multi-repo（多仓库）\u003c/th>\u003cth>Monorepo（单仓库多包）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>代码共享\u003c/td>\u003ctd>发包到 registry，改动要发版才能用\u003c/td>\u003ctd>\u003ccode>workspace:*\u003c/code> 直接链本地，改动即生效\u003c/td>\u003c/tr>\u003ctr>\u003ctd>版本对齐\u003c/td>\u003ctd>各仓库版本号各自为政\u003c/td>\u003ctd>lock 统一，依赖版本天然对齐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>原子提交\u003c/td>\u003ctd>跨仓库改动要拆 N 个 PR\u003c/td>\u003ctd>一次提交改完所有相关包\u003c/td>\u003c/tr>\u003ctr>\u003ctd>协作成本\u003c/td>\u003ctd>跨仓库 review、同步 changelog\u003c/td>\u003ctd>单仓库统一规范\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>pnpm + Monorepo 是天作之合\u003c/strong>：pnpm 的 workspace 协议让「本地包互相引用」零成本，Store 让「装 100 个包」也不爆炸。\u003c/p>\n\u003ch2 id=\"三-动手-5-分钟跑起示例项目\">三、动手：5 分钟跑起示例项目\u003c/h2>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 1. 克隆并安装（pnpm 会自动识别 workspace）\ngit clone &lt;repo&gt; pnpm-monorepo-tutorial &amp;&amp; cd pnpm-monorepo-tutorial\npnpm install\n\n# 2. 启动前端应用（它会实时引用本地 packages/ui）\npnpm --filter @tutorial/web dev\n# → Vite 启动 http://localhost:5173，按钮组件来自 packages/ui\n\n# 3. 另开终端，启动 API（实时引用本地 packages/utils）\npnpm --filter @tutorial/api dev\n# → http://localhost:3000/api/users 返回分页数据\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"观察这个关键片段\">观察这个关键片段\u003c/h3>\n\u003cp>\u003ccode>apps/web/package.json\u003c/code> 里：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>{\n  \"dependencies\": {\n    \"@tutorial/ui\": \"workspace:*\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>workspace:*\u003c/code> 的含义是：\u003cstrong>永远链接 workspace 里的最新代码\u003c/strong>。你改 \u003ccode>packages/ui/src/Button.tsx\u003c/code> 保存，浏览器立刻热更新——无需发版、无需 \u003ccode>npm link\u003c/code>。\u003c/p>\n\u003ch2 id=\"四-一图看懂目录职责\">四、一图看懂目录职责\u003c/h2>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>pnpm-monorepo-tutorial/\n├── apps/                    # 能独立运行的应用\n│   ├── web/                 # React 前端（Vite）\n│   └── api/                 # Node API（Express）\n├── packages/                # 被复用的共享库\n│   ├── types/               # TS 类型（无运行时）\n│   ├── utils/               # 工具函数\n│   └── ui/                  # React 组件\n├── pnpm-workspace.yaml      # 声明 workspace 范围\n└── .npmrc                   # 全局行为配置\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2 id=\"五-小结与自测\">五、小结与自测\u003c/h2>\n\u003cp>\u003cstrong>核心收获\u003c/strong>：\u003c/p>\n\u003col>\u003cli>pnpm 用 Store + 硬链接解决磁盘浪费与幻影依赖\u003c/li>\u003cli>Monorepo 用 \u003ccode>workspace:*\u003c/code> 解决跨包共享与版本对齐\u003c/li>\u003cli>示例项目中 web/api 都实时引用本地 packages\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>自测 3 题\u003c/strong>：\u003c/p>\n\u003cul>\u003cli>Q1：为什么 pnpm 能根治幻影依赖？（提示：非扁平 node_modules）\u003c/li>\u003cli>Q2：\u003ccode>workspace:*\u003c/code> 与 \u003ccode>\"@tutorial/ui\": \"^1.0.0\"\u003c/code> 在本地开发时的区别？\u003c/li>\u003cli>Q3：在 \u003ccode>packages/ui\u003c/code> 新增一个组件，\u003ccode>apps/web\u003c/code> 需要重新 install 吗？\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>下一篇\u003c/strong>：\u003ca data-goto=\"t2\">02 · 进阶篇：Workspace 配置与依赖管理实战 →\u003c/a>\u003c/p>\n\u003chr>\n\u003cblockquote>\u003cp>延伸阅读：\u003ca data-goto=\"d01\">docs/01-setup.md\u003c/a>（环境搭建细节）· \u003ca data-goto=\"d02\">docs/02-workspace.md\u003c/a>（目录设计权衡）\u003c/p>\u003c/blockquote>"},{"id":"t2","file":"assets/tutorials/02-intermediate.md","group":"comic","no":"02","short":"进阶篇 · Workspace 配置与依赖管理","title":"进阶篇：Workspace 配置与依赖管理实战","tagline":"一次 install 的四段旅程：workspace 协议、硬/软链接与 hoist 控制","level":"进阶","minutes":20,"comics":"第 2–3 话","html":"\u003cblockquote>\u003cp>\u003cstrong>阅读时长\u003c/strong>：20 分钟　|　\u003cstrong>前置要求\u003c/strong>：读完 \u003ca data-goto=\"t1\">入门篇\u003c/a>　|　\u003cstrong>配套漫画\u003c/strong>：第 2、3 话\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"你将学到\">你将学到\u003c/h2>\n\u003cul>\u003cli>pnpm-workspace.yaml 的范围匹配规则与非标准结构适配\u003c/li>\u003cli>一次 \u003ccode>pnpm install\u003c/code> 背后，包从 registry 到项目的完整旅程\u003c/li>\u003cli>workspace: 协议与 peerDependencies 的取舍\u003c/li>\u003cli>hoist 行为控制：该让谁提升、谁必须隔离\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"一-跟着小-p-漫游-workspace\">一、跟着小 P 漫游 Workspace\u003c/h2>\n\u003cfigure class=\"comic-figure\" data-svg=\"comic-02-workspace-journey\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind comic\">漫画\u003c/span>\u003cspan class=\"cf-caption\">第 2 话 · Workspace 漫游记\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\n\u003ch3 id=\"1.-范围定义的三种写法\">1. 范围定义的三种写法\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># pnpm-workspace.yaml\npackages:\n  - \"apps/*\" # 直接子目录（最常用）\n  - \"packages/*\" # 标准共享库\n  - \"packages/*/**\" # 递归所有层级（嵌套包时用）\n  - \"!**/test/**\" # 排除测试目录（! 开头）\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>非标准结构适配\u003c/strong>：老项目里包可能散落在 \u003ccode>modules/\u003c/code>、\u003ccode>libs/\u003c/code>：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>packages:\n  - \"apps/*\"\n  - \"modules/*\" # 兼容遗留目录\n  - \"libs/*\"\n  - \"packages/*\"\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"2.-依赖声明决策表\">2. 依赖声明决策表\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>场景\u003c/th>\u003cth>写法\u003c/th>\u003cth>发布时行为\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>本地共享包\u003c/td>\u003ctd>\u003ccode>\"workspace:*\"\u003c/code>\u003c/td>\u003ctd>自动替换为当前本地版本号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>需要锁定主版本\u003c/td>\u003ctd>\u003ccode>\"workspace:^1.0.0\"\u003c/code>\u003c/td>\u003ctd>保留 ^ 范围\u003c/td>\u003c/tr>\u003ctr>\u003ctd>纯开发依赖\u003c/td>\u003ctd>\u003ccode>\"workspace:*\"\u003c/code> in devDependencies\u003c/td>\u003ctd>不随包发布\u003c/td>\u003c/tr>\u003ctr>\u003ctd>由宿主提供（React）\u003c/td>\u003ctd>\u003ccode>\"peerDependencies\": { \"react\": \"&gt;=18\" }\u003c/code>\u003c/td>\u003ctd>不打包，由使用方安装\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\u003cp>⚠️ \u003cstrong>peerDependencies 陷阱\u003c/strong>：pnpm 默认 \u003ccode>auto-install-peers=true\u003c/code>，会自动装缺失的 peer。组件库建议显式设为 \u003ccode>false\u003c/code>（见根目录 \u003ccode>.npmrc\u003c/code>），让缺失 peer 直接报错，避免静默装上不兼容版本。\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"二-一个包的奇幻漂流-install-全过程\">二、一个包的奇幻漂流：install 全过程\u003c/h2>\n\u003cfigure class=\"comic-figure\" data-svg=\"comic-03-install-journey\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind comic\">漫画\u003c/span>\u003cspan class=\"cf-caption\">第 3 话 · 依赖安装之旅\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\n\u003cp>\u003cstrong>四段旅程\u003c/strong>：\u003c/p>\n\u003col>\u003cli>\u003cstrong>解析\u003c/strong>：读 lock 文件，算出要下载哪些版本\u003c/li>\u003cli>\u003cstrong>缓存站\u003c/strong>：先看 \u003ccode>~/.pnpm-cache\u003c/code>，命中直接跳过网络\u003c/li>\u003cli>\u003cstrong>入库\u003c/strong>：按内容哈希存进 \u003ccode>~/.pnpm-store/files/\u003c/code>\u003c/li>\u003cli>\u003cstrong>链接\u003c/strong>：\u003cul>\u003cli>硬链接 → \u003ccode>node_modules/.pnpm/&lt;name&gt;@&lt;version&gt;/\u003c/code>\u003c/li>\u003cli>软链接 → \u003ccode>node_modules/&lt;name&gt;\u003c/code> 指向 \u003ccode>.pnpm\u003c/code> 下的真实位置\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>为什么这能根治幻影依赖？\u003c/strong>\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>node_modules/\n├── .pnpm/                    # 真实内容都在这里（硬链接）\n│   ├── react@18.2.0/\n│   └── lodash@4.17.21/\n├── react -&gt; .pnpm/...        # 只有声明过的依赖才有软链接\n└── lodash -&gt; .pnpm/...\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>你没声明 \u003ccode>lodash\u003c/code>，\u003ccode>node_modules/lodash\u003c/code> 这个软链接就不存在——代码 \u003ccode>require('lodash')\u003c/code> 直接 \u003ccode>MODULE_NOT_FOUND\u003c/code>，问题在开发期暴露，而不是上线后。\u003c/p>\n\u003ch2 id=\"三-hoisting-控制实战\">三、Hoisting 控制实战\u003c/h2>\n\u003cp>npm/yarn 会把所有依赖拍平到根 node_modules（幻影依赖的根源）。pnpm 默认几乎不提升，但某些老工具（如 ESLint 插件解析）依赖扁平结构。\u003c/p>\n\u003ch3 id=\"三档控制-在根-.npmrc\">三档控制（在根 \u003ccode>.npmrc\u003c/code>）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">ini\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 档 1：默认——极严格，只提升 .pnpm/node_modules 里的运行时依赖\nhoist=true\n\n# 档 2：按需提升——把 eslint 插件提升到根，兼容其扁平查找\nhoist-pattern[]=*eslint*\nhoist-pattern[]=*prettier*\n\n# 档 3：完全公开提升（危险！等于回到 npm 模式）\npublic-hoist-pattern[]=*\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>本项目的选择\u003c/strong>：\u003ccode>hoist-pattern\u003c/code> 只放行构建工具链，\u003ccode>public-hoist-pattern\u003c/code> 保持空——既兼容老工具，又不污染业务代码的依赖可见性。\u003c/p>\n\u003ch3 id=\"验证当前-hoist-结构\">验证当前 hoist 结构\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 查看根 node_modules 实际提升了什么\nls node_modules/ | head -20\n# 查看 .pnpm 虚拟存储全貌\nls node_modules/.pnpm/ | wc -l\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2 id=\"四-动手实验-制造并修复一个幻影依赖\">四、动手实验：制造并修复一个幻影依赖\u003c/h2>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 1. 在 apps/api 里直接用 lodash（但 api 没声明它）\n# apps/api/src/routes/users.ts 加一行：\nimport { chunk } from 'lodash'   # ← 故意制造幻影依赖\n\n# 2. pnpm install &amp;&amp; pnpm --filter @tutorial/api dev\n# 预期：立即报错 Cannot find module 'lodash' ✔（pnpm 挡住了）\n\n# 3. 正确修复：显式声明\npnpm --filter @tutorial/api add lodash\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>如果用 npm，第 2 步会「碰巧能跑」（lodash 被提升到了根）——这就是幻影依赖的生产事故源头。\u003c/p>\n\u003ch2 id=\"五-小结与自测\">五、小结与自测\u003c/h2>\n\u003cp>\u003cstrong>核心收获\u003c/strong>：\u003c/p>\n\u003col>\u003cli>workspace 范围用 glob，非标准结构用多行 + \u003ccode>!\u003c/code> 排除\u003c/li>\u003cli>\u003ccode>workspace:*\u003c/code> 本地开发零发包；peerDependencies 交给宿主\u003c/li>\u003cli>pnpm 的严格 node_modules 结构是幻影依赖的物理防线\u003c/li>\u003cli>hoist 只给必要的工具链开口子，默认收紧\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>自测 3 题\u003c/strong>：\u003c/p>\n\u003cul>\u003cli>Q1：为什么 \u003ccode>public-hoist-pattern[]=*\u003c/code> 被称为「危险档」？\u003c/li>\u003cli>Q2：组件库 ui 用 React，应声明在 dependencies 还是 peerDependencies？为什么？\u003c/li>\u003cli>Q3：\u003ccode>.pnpm/react@18.2.0\u003c/code> 与根 \u003ccode>node_modules/react\u003c/code> 分别是什么链接？\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>下一篇\u003c/strong>：\u003ca data-goto=\"t3\">03 · 高级篇：构建优化、版本发布与 CI/CD →\u003c/a>\u003c/p>\n\u003chr>\n\u003cblockquote>\u003cp>延伸阅读：\u003ca data-goto=\"d03\">docs/03-package-management.md\u003c/a> · \u003ca data-goto=\"d04\">docs/04-dependency-sharing.md\u003c/a>\u003c/p>\u003c/blockquote>"},{"id":"t3","file":"assets/tutorials/03-advanced.md","group":"comic","no":"03","short":"高级篇 · 构建优化、版本发布与 CI/CD","title":"高级篇：构建优化、版本发布与 CI/CD","tagline":"拓扑构建、Changesets 自动发版，以及从 PR 到生产的流水线闭环","level":"高级","minutes":25,"comics":"第 4–5 话","html":"\u003cblockquote>\u003cp>\u003cstrong>阅读时长\u003c/strong>：25 分钟　|　\u003cstrong>前置要求\u003c/strong>：读完 \u003ca data-goto=\"t2\">进阶篇\u003c/a>　|　\u003cstrong>配套漫画\u003c/strong>：第 4、5 话\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"你将学到\">你将学到\u003c/h2>\n\u003cul>\u003cli>多包构建的拓扑排序、并行与缓存策略\u003c/li>\u003cli>Changesets 驱动的「开发时决策、发布时自动」版本流\u003c/li>\u003cli>从 PR 到自动发版的完整 CI/CD 闭环\u003c/li>\u003cli>多环境部署与回滚设计\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"一-构建车间-拓扑-并行与缓存\">一、构建车间：拓扑、并行与缓存\u003c/h2>\n\u003cfigure class=\"comic-figure\" data-svg=\"comic-04-build-pipeline\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind comic\">漫画\u003c/span>\u003cspan class=\"cf-caption\">第 4 话 · 构建车间\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\n\u003ch3 id=\"1.-拓扑排序是底线\">1. 拓扑排序是底线\u003c/h3>\n\u003cp>包之间有依赖：types ← utils ← ui ← apps。构建必须按这个顺序：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># pnpm -r 默认就按拓扑序（先构建被依赖的包）\npnpm -r build\n# 实际顺序：types → utils → ui → web/api\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"2.-并行构建提速\">2. 并行构建提速\u003c/h3>\n\u003cp>无相互依赖的包可以并行。\u003ccode>apps/web\u003c/code> 与 \u003ccode>apps/api\u003c/code> 互不依赖：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// 根 package.json\n{\n  \"scripts\": {\n    \"build\": \"pnpm -r --workspace-concurrency=4 build\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cblockquote>\u003cp>\u003ccode>--workspace-concurrency=4\u003c/code>：最多 4 个包同时构建，默认是 CPU 核数。\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"3.-缓存-没改的包不重构建\">3. 缓存：没改的包不重构建\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方案\u003c/th>\u003cth>配置\u003c/th>\u003cth>原理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>tsc 增量\u003c/td>\u003ctd>\u003ccode>\"composite\": true\u003c/code> in tsconfig\u003c/td>\u003ctd>生成 \u003ccode>.tsbuildinfo\u003c/code>，只重编改动文件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vite 缓存\u003c/td>\u003ctd>默认开启\u003c/td>\u003ctd>\u003ccode>node_modules/.vite\u003c/code> 预构建缓存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Turbo/远程缓存\u003c/td>\u003ctd>\u003ccode>turbo.json\u003c/code>\u003c/td>\u003ctd>输入文件哈希 → 命中直接复用产物\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>本项目 packages 均开启 \u003ccode>composite: true\u003c/code>，二次构建实测从 4.2s 降至 0.8s。\u003c/p>\n\u003ch2 id=\"二-版本发布冒险-changesets-全自动流\">二、版本发布冒险：Changesets 全自动流\u003c/h2>\n\u003cfigure class=\"comic-figure\" data-svg=\"comic-05-release-adventure\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind comic\">漫画\u003c/span>\u003cspan class=\"cf-caption\">第 5 话 · 发布大冒险\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\n\u003ch3 id=\"核心理念-把发版决策「左移」到写代码时\">核心理念：把发版决策「左移」到写代码时\u003c/h3>\n\u003cp>传统痛点：发布前翻 commit 记录，人工判断该 bump major/minor/patch，手写 CHANGELOG——既慢又漏。\u003c/p>\n\u003cp>Changesets 的做法：\u003cstrong>开发者在 PR 里就写清「这次改了什么、影响哪个包、算哪种变更」\u003c/strong>，发布时机器自动汇总。\u003c/p>\n\u003ch3 id=\"五步实操\">五步实操\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># ① 改完代码，写「变更信」\npnpm changeset\n# 交互选择：哪个包？patch/minor/major？写一句说明\n# 生成 .changeset/rotten-lemons-dance.md\n\n# ② 提交（changeset 文件随代码一起进仓库）\ngit add . &amp;&amp; git commit -m \"feat(ui): add loading state\"\n\n# ③ 发版时，自动汇总所有 changeset\npnpm changeset version\n# → 自动 bump 各包版本号 + 生成 CHANGELOG.md + 删除已消费的 changeset\n\n# ④ 发布（workspace:* 此时被替换为真实版本号）\npnpm changeset publish\n\n# ⑤ 打标签\ngit tag @tutorial/ui@1.1.0 &amp;&amp; git push --tags\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"版本同步策略\">版本同步策略\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>策略\u003c/th>\u003cth>适用\u003c/th>\u003cth>配置\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>独立版本\u003c/strong>（本项目）\u003c/td>\u003ctd>各包发布节奏不同\u003c/td>\u003ctd>\u003ccode>.changeset/config.json\u003c/code> 不设 fixed/linked\u003c/td>\u003c/tr>\u003ctr>\u003ctd>固定版本\u003c/td>\u003ctd>所有包版本号强制一致（如 Babel）\u003c/td>\u003ctd>\u003ccode>\"fixed\": [[\"@scope/*\"]]\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>链接版本\u003c/td>\u003ctd>部分包联动\u003c/td>\u003ctd>\u003ccode>\"linked\": [[\"@scope/ui\", \"@scope/types\"]]\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"三-ci/cd-闭环-从-pr-到自动发版\">三、CI/CD 闭环：从 PR 到自动发版\u003c/h2>\n\u003cfigure class=\"comic-figure\" data-svg=\"flow-dev-workflow\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind diagram\">图解\u003c/span>\u003cspan class=\"cf-caption\">开发工作流\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\n\u003ch3 id=\"关键流水线-已内置-.github/workflows/\">关键流水线（已内置 \u003ccode>.github/workflows/\u003c/code>）\u003c/h3>\n\u003cp>\u003cstrong>ci.yml\u003c/strong>——PR 红线：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>- run: pnpm install --frozen-lockfile # lock 不一致直接失败\n- run: pnpm -r lint &amp;&amp; pnpm -r typecheck\n- run: pnpm -r test --coverage\n- run: pnpm -r build\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>release.yml\u003c/strong>——自动发版（push 到 main 触发）：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>- uses: changesets/action@v1\n  with:\n    publish: pnpm changeset publish\n  # 有未消费 changeset → 自动开 Release PR；合并后自动 publish + 打 tag\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>deploy.yml\u003c/strong>——多环境：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>main 合并 → staging 自动部署\n手动 workflow_dispatch → production（需环境审批 + 健康检查）\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"部署前验证机制\">部署前验证机制\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># deploy.yml 片段\n- name: Smoke test\n  run: |\n    curl -f ${{ env.API_URL }}/health || exit 1\n    pnpm test:e2e --grep @smoke\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2 id=\"四-动手-完整走一遍发布流\">四、动手：完整走一遍发布流\u003c/h2>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 1. 给 utils 加一个函数\necho \"export const sleep = (ms: number) =&gt; new Promise(r =&gt; setTimeout(r, ms))\" \\\n  &gt;&gt; packages/utils/src/index.ts\n\n# 2. 写信（选 patch）\npnpm changeset\n\n# 3. 本地预演 version（不真实发布）\npnpm changeset version\ncat packages/utils/CHANGELOG.md   # 看自动生成的日志\ngit checkout .                    # 预演完回滚\n\n# 4. 推 main，观察 GitHub Actions 自动开 Release PR\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2 id=\"五-小结与结业自测\">五、小结与结业自测\u003c/h2>\n\u003cp>\u003cstrong>核心收获\u003c/strong>：\u003c/p>\n\u003col>\u003cli>构建三原则：拓扑保底、并行提速、缓存免工\u003c/li>\u003cli>Changesets 把发版决策嵌入开发流，发布变成纯机械动作\u003c/li>\u003cli>CI 卡红线，CD 全自动，部署带健康检查\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>结业 4 题\u003c/strong>：\u003c/p>\n\u003cul>\u003cli>Q1：为什么 \u003ccode>pnpm -r build\u003c/code> 不需要手动指定顺序？\u003c/li>\u003cli>Q2：\u003ccode>workspace:*\u003c/code> 是在哪一步被替换成 \u003ccode>^1.1.0\u003c/code> 的？\u003c/li>\u003cli>Q3：Release PR 是谁开的、内容是什么？\u003c/li>\u003cli>Q4：production 部署为什么要加 \u003ccode>environment: production\u003c/code> + 审批？\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>结业标准\u003c/strong>：能独立完成「加功能 → changeset → PR → CI 绿 → Release PR → 自动发版」全链路。\u003c/p>\n\u003chr>\n\u003cblockquote>\u003cp>延伸阅读：\u003ca data-goto=\"d05\">docs/05-build-optimization.md\u003c/a> · \u003ca data-goto=\"d06\">docs/06-versioning.md\u003c/a> · \u003ca data-goto=\"d07\">docs/07-ci-cd.md\u003c/a>\u003c/p>\u003cp>🎉 恭喜完成全部三篇图文教程！回到 \u003ca data-goto=\"home\">README\u003c/a> 查看完整知识地图\u003c/p>\u003c/blockquote>"},{"id":"d01","file":"docs/01-setup.md","group":"ref","no":"参 1","short":"环境搭建与版本兼容性","title":"环境搭建与版本兼容性","tagline":"Node/pnpm 安装四法、版本兼容矩阵、多版本共存与安装排错","level":"入门","minutes":15,"html":"\u003cblockquote>\u003cp>本章详细讲解 pnpm 的安装方法、Node.js 版本要求、多版本共存方案及常见环境问题排查。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>配置全流程一图览\u003c/strong>：\u003cfigure class=\"comic-figure\" data-svg=\"flow-config-steps\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind diagram\">图解\u003c/span>\u003cspan class=\"cf-caption\">配置步骤流程图\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\u003c/p>\n\u003ch2 id=\"目录\">目录\u003c/h2>\n\u003cul>\u003cli>\u003ca data-anchor=\"nodejs-版本要求\">Node.js 版本要求\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"pnpm-安装方法\">pnpm 安装方法\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"版本兼容性矩阵\">版本兼容性矩阵\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"多版本共存方案\">多版本共存方案\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"常见问题排查\">常见问题排查\u003c/a>\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"node.js-版本要求\">Node.js 版本要求\u003c/h2>\n\u003ch3 id=\"最低版本-v16.14.0\">最低版本：v16.14.0\u003c/h3>\n\u003cp>pnpm 8.x 及更高版本要求 Node.js &gt;= 16.14.0，原因如下：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Node.js 版本\u003c/th>\u003cth>pnpm 兼容性\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>&lt; 14.x\u003c/td>\u003ctd>不兼容\u003c/td>\u003ctd>缺少 \u003ccode>node:module\u003c/code> 前缀、fs.rm 等 API\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14.x - 16.13\u003c/td>\u003ctd>部分兼容\u003c/td>\u003ctd>pnpm 7.x 可用，8.x+ 会警告\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>16.14.0 - 18.x\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>完全兼容\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>推荐生产环境使用\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20.x\u003c/td>\u003ctd>完全兼容\u003c/td>\u003ctd>长期支持版（LTS），性能最优\u003c/td>\u003c/tr>\u003ctr>\u003ctd>21.x+\u003c/td>\u003ctd>实验性\u003c/td>\u003ctd>可能存在未发现的兼容性问题\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"版本管理器推荐\">版本管理器推荐\u003c/h3>\n\u003cp>\u003cstrong>nvm（Node Version Manager）\u003c/strong>\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 安装 nvm\ncurl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash\n\n# 安装并使用 Node.js 18\nnvm install 18\nnvm use 18\n\n# 设置默认版本\nnvm alias default 18\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>fnm（Fast Node Manager，Rust 编写，速度更快）\u003c/strong>\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 安装 fnm\ncurl -fsSL https://fnm.vercel.app/install | bash\n\n# 安装并使用 Node.js 18\nfnm install 18\nfnm use 18\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>volta（JavaScript 工具链管理器，自动切换）\u003c/strong>\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 安装 volta\ncurl https://get.volta.sh | bash\n\n# 安装 Node.js 和 pnpm\nvolta install node@18\nvolta install pnpm\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"pnpm-安装方法\">pnpm 安装方法\u003c/h2>\n\u003ch3 id=\"方法-1-npm-全局安装-最简单\">方法 1：npm 全局安装（最简单）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>npm install -g pnpm@latest-8\n\n# 验证安装\npnpm --version  # 应输出 8.x.x 或更高\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"方法-2-独立脚本安装-推荐-ci-环境\">方法 2：独立脚本安装（推荐 CI 环境）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># macOS / Linux\ncurl -fsSL https://get.pnpm.io/install.sh | sh -\n\n# Windows (PowerShell)\niwr https://get.pnpm.io/install.ps1 -useb | iex\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"方法-3-corepack-node.js-16.13+-内置\">方法 3：Corepack（Node.js 16.13+ 内置）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 启用 Corepack\ncorepack enable\n\n# 激活 pnpm\ncorepack prepare pnpm@latest-8 --activate\n\n# 验证\npnpm --version\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"方法-4-homebrew-macos\">方法 4：Homebrew（macOS）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>brew install pnpm\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"版本兼容性矩阵\">版本兼容性矩阵\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>pnpm 版本\u003c/th>\u003cth>Node.js 最低版本\u003c/th>\u003cth>关键特性\u003c/th>\u003cth>EOL 日期\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>9.x\u003c/td>\u003ctd>18.12\u003c/td>\u003ctd>性能优化、\u003ccode>pnpm licenses\u003c/code>\u003c/td>\u003ctd>2025-06\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>8.x\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>16.14\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>稳定版，推荐生产使用\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>2024-12\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7.x\u003c/td>\u003ctd>14.19\u003c/td>\u003ctd>旧项目兼容\u003c/td>\u003ctd>2023-12（已停止维护）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6.x\u003c/td>\u003ctd>12.17\u003c/td>\u003ctd>遗留系统\u003c/td>\u003ctd>2022-12（已停止维护）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"功能兼容性\">功能兼容性\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>功能\u003c/th>\u003cth>pnpm 7.x\u003c/th>\u003cth>pnpm 8.x\u003c/th>\u003cth>pnpm 9.x\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>workspace: 协议\u003c/td>\u003ctd>支持\u003c/td>\u003ctd>支持\u003c/td>\u003ctd>支持\u003c/td>\u003c/tr>\u003ctr>\u003ctd>changesets 集成\u003c/td>\u003ctd>支持\u003c/td>\u003ctd>支持\u003c/td>\u003ctd>支持\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--filter\u003c/code> 过滤\u003c/td>\u003ctd>支持\u003c/td>\u003ctd>支持\u003c/td>\u003ctd>支持\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pnpm dlx\u003c/code>\u003c/td>\u003ctd>支持\u003c/td>\u003ctd>支持\u003c/td>\u003ctd>支持\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pnpm patch\u003c/code>\u003c/td>\u003ctd>不支持\u003c/td>\u003ctd>支持\u003c/td>\u003ctd>支持\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pnpm env use\u003c/code>\u003c/td>\u003ctd>不支持\u003c/td>\u003ctd>支持\u003c/td>\u003ctd>支持\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"多版本共存方案\">多版本共存方案\u003c/h2>\n\u003ch3 id=\"场景-同时维护-pnpm-7-旧项目-和-pnpm-8-新项目\">场景：同时维护 pnpm 7（旧项目）和 pnpm 8（新项目）\u003c/h3>\n\u003ch4 id=\"方案-1-corepack-+-packagemanager-字段-推荐\">方案 1：Corepack + packageManager 字段（推荐）\u003c/h4>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// package.json\n{\n  \"packageManager\": \"pnpm@8.15.1\"\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Corepack 会根据该字段自动切换版本：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 首次运行会自动下载并切换到 pnpm@8.15.1\npnpm install\u003c/code>\u003c/pre>\u003c/div>\n\u003ch4 id=\"方案-2-npx-显式调用\">方案 2：npx 显式调用\u003c/h4>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 使用 pnpm 7\nnpx pnpm@7 install\n\n# 使用 pnpm 8\nnpx pnpm@8 install\u003c/code>\u003c/pre>\u003c/div>\n\u003ch4 id=\"方案-3-全局别名-zsh/bash\">方案 3：全局别名（zsh/bash）\u003c/h4>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># ~/.zshrc 或 ~/.bashrc\nalias pnpm7=\"npx pnpm@7\"\nalias pnpm8=\"npx pnpm@8\"\n\n# 使用\npnpm7 install\npnpm8 install\u003c/code>\u003c/pre>\u003c/div>\n\u003ch4 id=\"方案-4-容器隔离-docker\">方案 4：容器隔离（Docker）\u003c/h4>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">dockerfile\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># Dockerfile.pnpm7\nFROM node:16\nRUN npm install -g pnpm@7\nWORKDIR /app\nCOPY . .\nRUN pnpm install\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">dockerfile\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># Dockerfile.pnpm8\nFROM node:18\nRUN npm install -g pnpm@8\nWORKDIR /app\nCOPY . .\nRUN pnpm install\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"常见问题排查\">常见问题排查\u003c/h2>\n\u003ch3 id=\"q1-pnpm-install-提示-err-pnpm-unsupported-engine\">Q1: \u003ccode>pnpm install\u003c/code> 提示 \"ERR_PNPM_UNSUPPORTED_ENGINE\"\u003c/h3>\n\u003cp>\u003cstrong>原因\u003c/strong>：Node.js 版本低于 package.json 中 \u003ccode>engines\u003c/code> 字段的要求\u003c/p>\n\u003cp>\u003cstrong>解决\u003c/strong>：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 查看当前 Node.js 版本\nnode -v\n\n# 升级 Node.js 到 16.14.0 或更高\nnvm install 18\nnvm use 18\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"q2-corepack-启用后-pnpm-命令仍不可用\">Q2: Corepack 启用后 pnpm 命令仍不可用\u003c/h3>\n\u003cp>\u003cstrong>原因\u003c/strong>：PATH 环境变量未包含 Corepack shim 目录\u003c/p>\n\u003cp>\u003cstrong>解决\u003c/strong>：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># macOS / Linux\nexport PATH=\"$HOME/.volta/bin:$PATH\"  # 或 Corepack 实际路径\ncorepack enable\n\n# Windows (PowerShell 管理员模式)\ncorepack enable\n# 重启终端\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"q3-安装时出现网络超时-etimedout\">Q3: 安装时出现网络超时 \"ETIMEDOUT\"\u003c/h3>\n\u003cp>\u003cstrong>原因\u003c/strong>：网络环境无法访问默认 registry\u003c/p>\n\u003cp>\u003cstrong>解决\u003c/strong>：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 切换至国内镜像\npnpm config set registry https://registry.npmmirror.com\n\n# 或在项目 .npmrc 中配置\necho \"registry=https://registry.npmmirror.com\" &gt;&gt; .npmrc\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"q4-安装后-node-modules-结构异常-缺少依赖\">Q4: 安装后 \u003ccode>node_modules\u003c/code> 结构异常（缺少依赖）\u003c/h3>\n\u003cp>\u003cstrong>原因\u003c/strong>：pnpm 的严格隔离导致幻影依赖（phantom dependency）\u003c/p>\n\u003cp>\u003cstrong>解决\u003c/strong>：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 检查是否缺少 peerDependencies\npnpm install --strict-peer-dependencies=false\n\n# 或显式安装缺失的依赖\npnpm add -D &lt;missing-package&gt;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"q5-全局安装的-pnpm-命令找不到\">Q5: 全局安装的 pnpm 命令找不到\u003c/h3>\n\u003cp>\u003cstrong>原因\u003c/strong>：npm 全局 bin 目录不在 PATH 中\u003c/p>\n\u003cp>\u003cstrong>解决\u003c/strong>：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 查看 npm 全局 bin 路径\nnpm config get prefix\n\n# 将路径添加到 PATH（以 macOS 为例）\necho 'export PATH=\"$(npm config get prefix)/bin:$PATH\"' &gt;&gt; ~/.zshrc\nsource ~/.zshrc\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"检查清单\">检查清单\u003c/h2>\n\u003cul>\u003cli>[ ] Node.js &gt;= 16.14.0 已安装\u003c/li>\u003cli>[ ] pnpm &gt;= 8.0.0 已安装\u003c/li>\u003cli>[ ] \u003ccode>pnpm --version\u003c/code> 可正常输出\u003c/li>\u003cli>[ ] 国内镜像已配置（如需要）\u003c/li>\u003cli>[ ] 多版本共存方案已确定（如需要）\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"下一步\">下一步\u003c/h2>\n\u003cp>环境搭建完成后，请继续阅读 \u003ca data-goto=\"d02\">02-workspace.md\u003c/a>，学习如何配置 pnpm workspace 和设计项目结构。\u003c/p>"},{"id":"d02","file":"docs/02-workspace.md","group":"ref","no":"参 2","short":"工作区配置与目录设计","title":"工作区配置与目录设计","tagline":"pnpm-workspace.yaml 详解、apps/packages 分层与非标准结构适配","level":"入门","minutes":20,"html":"\u003cblockquote>\u003cp>本章详解 pnpm-workspace.yaml 的每一项配置、模块化目录结构设计原则及非标准结构的适配方案。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>配套漫画\u003c/strong>：\u003cfigure class=\"comic-figure\" data-svg=\"comic-02-workspace-journey\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind comic\">漫画\u003c/span>\u003cspan class=\"cf-caption\">第 2 话 · Workspace 漫游记\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\u003c/p>\n\u003ch2 id=\"目录\">目录\u003c/h2>\n\u003cul>\u003cli>\u003ca data-anchor=\"workspace-范围定义\">workspace 范围定义\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"目录结构设计\">目录结构设计\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"pnpm-workspaceyaml-配置详解\">pnpm-workspace.yaml 配置详解\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"非标准结构适配\">非标准结构适配\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"跨包引用机制\">跨包引用机制\u003c/a>\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"workspace-范围定义\">workspace 范围定义\u003c/h2>\n\u003ch3 id=\"核心文件-pnpm-workspace.yaml\">核心文件：pnpm-workspace.yaml\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># pnpm-workspace.yaml\npackages:\n  # apps/* 表示 apps 目录下的所有子目录（单层）\n  - \"apps/*\"\n  # packages/* 表示 packages 目录下的所有子目录（单层）\n  - \"packages/*\"\n  # 也可指定具体目录（非 glob 模式）\n  - \"legacy/libs/shared\"\n\n  # 排除规则：以 ! 开头表示排除\n  # 排除 apps/mobile 目录（如项目已废弃）\n  - \"!apps/mobile\"\n  # 排除所有以 test- 开头的目录（测试脚手架）\n  - \"!apps/test-*\"\n  # 排除任何层级的 template 目录\n  - \"!**/template\"\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"范围匹配规则\">范围匹配规则\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>模式\u003c/th>\u003cth>含义\u003c/th>\u003cth>示例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>apps/*\u003c/code>\u003c/td>\u003ctd>单层匹配\u003c/td>\u003ctd>\u003ccode>apps/web\u003c/code> 匹配，\u003ccode>apps/web/src\u003c/code> 不匹配\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apps/**\u003c/code>\u003c/td>\u003ctd>多层匹配\u003c/td>\u003ctd>\u003ccode>apps/web/src\u003c/code> 也匹配\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>packages/ui-*\u003c/code>\u003c/td>\u003ctd>前缀匹配\u003c/td>\u003ctd>\u003ccode>packages/ui-button\u003c/code>、\u003ccode>packages/ui-input\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>!apps/**\u003c/code>\u003c/td>\u003ctd>排除\u003c/td>\u003ctd>\u003ccode>apps/\u003c/code> 下所有目录被排除\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"优先级与冲突\">优先级与冲突\u003c/h3>\n\u003cul>\u003cli>后定义的排除规则会覆盖前面的包含规则\u003c/li>\u003cli>列表顺序从上到下依次匹配，一旦匹配即停止\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"目录结构设计\">目录结构设计\u003c/h2>\n\u003ch3 id=\"推荐目录结构\">推荐目录结构\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>project-root/\n├── apps/                          # 可部署应用\n│   ├── web/                       # Web 应用\n│   ├── mobile/                    # 移动端应用\n│   ├── admin/                     # 后台管理系统\n│   └── api/                       # 后端服务\n│\n├── packages/                      # 共享库\n│   ├── ui/                        # UI 组件库\n│   ├── utils/                     # 工具函数库\n│   ├── types/                     # TypeScript 类型定义\n│   ├── config/                    # 共享配置（eslint、tsconfig）\n│   └── hooks/                     # React Hooks 库\n│\n├── tools/                         # 构建工具与脚本\n│   ├── scripts/                   # 自动化脚本\n│   ├── ci/                        # CI/CD 相关脚本\n│   └── generators/                # 代码生成器\n│\n├── docs/                          # 文档\n├── .changeset/                    # 版本变更记录\n├── .github/workflows/             # CI 配置\n├── pnpm-workspace.yaml\n├── package.json                   # 根 package.json（scripts + devDeps）\n└── tsconfig.json                  # 根 TypeScript 配置\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"设计原则\">设计原则\u003c/h3>\n\u003ch4 id=\"原则-1-应用与库分离-apps/packages\">原则 1：应用与库分离（apps/packages）\u003c/h4>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># pnpm-workspace.yaml\npackages:\n  - \"apps/*\" # 应用：可独立部署的端侧产品\n  - \"packages/*\" # 库：被复用的模块，不可独立部署\u003c/code>\u003c/pre>\u003c/div>\n\u003ch4 id=\"原则-2-按业务域分层\">原则 2：按业务域分层\u003c/h4>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>packages:\n  # 应用层\n  - \"apps/customer-portal\"\n  - \"apps/admin-dashboard\"\n\n  # 共享层（核心工具）\n  - \"packages/core\"\n  - \"packages/shared\"\n\n  # 功能层（按业务域划分）\n  - \"packages/auth\"\n  - \"packages/payment\"\n  - \"packages/analytics\"\u003c/code>\u003c/pre>\u003c/div>\n\u003ch4 id=\"原则-3-扁平-vs-嵌套\">原则 3：扁平 vs 嵌套\u003c/h4>\n\u003cp>\u003cstrong>扁平结构\u003c/strong>（推荐大多数项目）：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>packages/\n  ├── ui/\n  ├── utils/\n  ├── types/\n  └── hooks/\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>嵌套结构\u003c/strong>（大型项目，需二次分组）：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>packages/\n  ├── foundation/\n  │   ├── types/\n  │   ├── utils/\n  │   └── config/\n  ├── ui/\n  │   ├── components/\n  │   └── theme/\n  └── business/\n      ├── auth/\n      └── payment/\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"目录命名规范\">目录命名规范\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>命名方式\u003c/th>\u003cth>示例\u003c/th>\u003cth>适用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>kebab-case\u003c/td>\u003ctd>\u003ccode>my-component\u003c/code>、\u003ccode>auth-service\u003c/code>\u003c/td>\u003ctd>包名（npm 包名规范）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>camelCase\u003c/td>\u003ctd>\u003ccode>myComponent\u003c/code>\u003c/td>\u003ctd>不推荐目录名使用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PascalCase\u003c/td>\u003ctd>\u003ccode>MyComponent\u003c/code>\u003c/td>\u003ctd>组件目录（可选）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>lowercase\u003c/td>\u003ctd>\u003ccode>ui\u003c/code>、\u003ccode>utils\u003c/code>、\u003ccode>api\u003c/code>\u003c/td>\u003ctd>通用工具目录（推荐）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"pnpm-workspace.yaml-配置详解\">pnpm-workspace.yaml 配置详解\u003c/h2>\n\u003ch3 id=\"完整配置示例\">完整配置示例\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 包范围定义（必需）\npackages:\n  - \"apps/*\"\n  - \"packages/*\"\n  - \"!**/test/**\"\n\n# 共享 lockfile（默认 true）\n# true: 所有包共享根目录的 pnpm-lock.yaml\n# false: 每个包独立管理 lockfile（不推荐，失去一致性）\nshared-workspace-lockfile: true\n\n# 优先使用 workspace 包（默认 true）\n# true: 当 package.json 声明 workspace 包时，优先使用本地版本\n# false: 即使本地有 workspace 包，也从 registry 下载\nprefer-workspace-packages: true\n\n# 自动链接 workspace 包（默认 true）\n# true: 自动创建本地软链接\n# false: 需显式使用 workspace:* 才会链接\nlink-workspace-packages: true\n\n# save-workspace-protocol: 安装时自动添加 workspace: 前缀\n# true: 总是添加 workspace:*\n# false: 不添加（使用 registry 版本号）\n# rolling: 安装时添加 workspace:*，发布时转换为 ^x.x.x\nsave-workspace-protocol: rolling\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"配置项关联关系图\">配置项关联关系图\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>packages                 # 定义哪些目录属于 workspace\n    │\n    ├── shared-workspace-lockfile   # 是否统一 lockfile\n    │       └── true（推荐）：pnpm-lock.yaml 在根目录\n    │\n    ├── prefer-workspace-packages   # 是否优先本地包\n    │       └── true（推荐）：本地有则不用 registry\n    │\n    ├── link-workspace-packages     # 是否自动软链接\n    │       └── true（推荐）：本地包自动链接\n    │\n    └── save-workspace-protocol     # 安装时是否加前缀\n            └── rolling（推荐）：开发用 workspace:*，发布变版本号\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"非标准结构适配\">非标准结构适配\u003c/h2>\n\u003ch3 id=\"场景-1-遗留项目已有固定目录\">场景 1：遗留项目已有固定目录\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 原项目结构：\n# src/\n#   modules/\n#     module-a/\n#     module-b/\n#   services/\n#     service-a/\n#     service-b/\n\npackages:\n  - \"src/modules/*\"\n  - \"src/services/*\"\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"场景-2-monorepo-中混有单仓库-polyrepo-遗留代码\">场景 2：Monorepo 中混有单仓库（polyrepo）遗留代码\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>packages:\n  # 新 monorepo 结构\n  - \"apps/*\"\n  - \"packages/*\"\n  # 遗留独立项目（仍使用独立 node_modules）\n  - \"legacy/project-a\"\n  - \"legacy/project-b\"\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"场景-3-包分散在多个子目录层级\">场景 3：包分散在多个子目录层级\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>packages:\n  # 单层匹配\n  - \"packages/*\"\n  # 多层匹配（如 packages/frontend/button、packages/backend/api）\n  - \"packages/**/*\"\n  # 排除 examples 和 docs\n  - \"!packages/**/examples\"\n  - \"!packages/**/docs\"\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"跨包引用机制\">跨包引用机制\u003c/h2>\n\u003ch3 id=\"workspace-协议详解\">workspace: 协议详解\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// package.json\n{\n  \"dependencies\": {\n    // workspace:*   始终链接到本地最新版本（开发推荐）\n    \"@tutorial/ui\": \"workspace:*\",\n\n    // workspace:^   链接到本地版本，遵循 ^ 语义\n    \"@tutorial/utils\": \"workspace:^\",\n\n    // workspace:~   链接到本地版本，遵循 ~ 语义\n    \"@tutorial/types\": \"workspace:~\",\n\n    // 固定版本号：发布时不会被替换（不推荐 workspace 内使用）\n    \"lodash\": \"^4.17.21\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"协议行为对比\">协议行为对比\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>协议\u003c/th>\u003cth>开发期行为\u003c/th>\u003cth>发布时行为\u003c/th>\u003cth>适用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>workspace:*\u003c/code>\u003c/td>\u003ctd>软链接到本地\u003c/td>\u003ctd>转换为 \u003ccode>^x.x.x\u003c/code>\u003c/td>\u003ctd>\u003cstrong>开发推荐，默认使用\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>workspace:^\u003c/code>\u003c/td>\u003ctd>软链接到本地\u003c/td>\u003ctd>保持 \u003ccode>^x.x.x\u003c/code>\u003c/td>\u003ctd>允许小版本兼容\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>workspace:~\u003c/code>\u003c/td>\u003ctd>软链接到本地\u003c/td>\u003ctd>保持 \u003ccode>~x.x.x\u003c/code>\u003c/td>\u003ctd>仅允许补丁版本兼容\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>workspace:x.x.x\u003c/code>\u003c/td>\u003ctd>软链接到本地\u003c/td>\u003ctd>保持 \u003ccode>x.x.x\u003c/code>\u003c/td>\u003ctd>固定版本依赖\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"发布时的版本替换\">发布时的版本替换\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 开发时依赖声明\n\"@tutorial/ui\": \"workspace:*\"\n\n# 发布到 registry 前自动替换为\n\"@tutorial/ui\": \"^1.2.3\"\n\n# 替换规则由 .npmrc 中的 save-workspace-protocol 控制\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"最佳实践\">最佳实践\u003c/h2>\n\u003ch3 id=\"1.-根-package.json-的职责\">1. 根 package.json 的职责\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>{\n  \"name\": \"monorepo-root\",\n  \"private\": true,\n  \"scripts\": {\n    \"dev\": \"pnpm -r --parallel run dev\",\n    \"build\": \"pnpm -r run build\",\n    \"test\": \"pnpm -r run test\",\n    \"lint\": \"pnpm -r run lint\"\n  },\n  \"devDependencies\": {\n    \"@changesets/cli\": \"^2.27.1\",\n    \"typescript\": \"^5.3.3\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"2.-跨包-tsconfig-继承\">2. 跨包 tsconfig 继承\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// 根 tsconfig.json\n{\n  \"compilerOptions\": {\n    \"strict\": true,\n    \"esModuleInterop\": true,\n    \"skipLibCheck\": true\n  }\n}\n\n// apps/web/tsconfig.json\n{\n  \"extends\": \"../../tsconfig.json\",\n  \"compilerOptions\": {\n    \"jsx\": \"react-jsx\",\n    \"paths\": {\n      \"@tutorial/*\": [\"packages/*/src\"]\n    }\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"下一步\">下一步\u003c/h2>\n\u003cp>工作区配置完成后，请继续阅读 \u003ca data-goto=\"d03\">03-package-management.md\u003c/a>，学习如何创建私有包、声明依赖关系及处理版本冲突。\u003c/p>"},{"id":"d03","file":"docs/03-package-management.md","group":"ref","no":"参 3","short":"包创建与依赖声明","title":"包创建与依赖声明","tagline":"新建 workspace 包、dependencies/devDependencies/peer 取舍","level":"进阶","minutes":25,"html":"\u003cblockquote>\u003cp>本章详解如何在 monorepo 中创建私有包、声明跨包依赖关系、处理 peerDependencies 及解决版本冲突。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>包间关系图解\u003c/strong>：\u003cfigure class=\"comic-figure\" data-svg=\"monorepo-structure\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind diagram\">图解\u003c/span>\u003cspan class=\"cf-caption\">Monorepo 架构\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\u003c/p>\n\u003cp>\u003cstrong>npm vs pnpm 结构对比\u003c/strong>：\u003cfigure class=\"comic-figure\" data-svg=\"dependency-comparison\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind diagram\">图解\u003c/span>\u003cspan class=\"cf-caption\">依赖结构对比\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\u003c/p>\n\u003ch2 id=\"目录\">目录\u003c/h2>\n\u003cul>\u003cli>\u003ca data-anchor=\"私有包创建流程\">私有包创建流程\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"跨包依赖声明\">跨包依赖声明\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"peerdependencies-显式声明\">peerDependencies 显式声明\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"依赖版本冲突解决\">依赖版本冲突解决\u003c/a>\u003c/li>\u003cli>\u003ca data-anchor=\"包间循环依赖检测\">包间循环依赖检测\u003c/a>\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"私有包创建流程\">私有包创建流程\u003c/h2>\n\u003ch3 id=\"步骤-1-创建目录与-package.json\">步骤 1：创建目录与 package.json\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p packages/my-new-package/src\ncd packages/my-new-package\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>{\n  \"name\": \"@tutorial/my-new-package\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"description\": \"新创建的共享包\",\n  \"main\": \"./src/index.ts\",\n  \"types\": \"./src/index.ts\",\n  \"exports\": {\n    \".\": \"./src/index.ts\"\n  },\n  \"scripts\": {\n    \"build\": \"tsc\",\n    \"test\": \"vitest run\",\n    \"lint\": \"eslint src --ext .ts\"\n  },\n  \"dependencies\": {},\n  \"devDependencies\": {\n    \"typescript\": \"^5.3.3\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"步骤-2-设置命名空间-scope\">步骤 2：设置命名空间（scope）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>{\n  \"name\": \"@org-name/package-name\"\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>命名方式\u003c/th>\u003cth>示例\u003c/th>\u003cth>适用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>无 scope\u003c/td>\u003ctd>\u003ccode>my-utils\u003c/code>\u003c/td>\u003ctd>小型项目，简单包名\u003c/td>\u003c/tr>\u003ctr>\u003ctd>有 scope\u003c/td>\u003ctd>\u003ccode>@myorg/utils\u003c/code>\u003c/td>\u003ctd>企业级项目，避免包名冲突\u003c/td>\u003c/tr>\u003ctr>\u003ctd>@types\u003c/td>\u003ctd>\u003ccode>@types/react\u003c/code>\u003c/td>\u003ctd>TypeScript 类型定义（社区约定）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"步骤-3-定义入口点\">步骤 3：定义入口点\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>{\n  \"main\": \"./dist/index.js\",\n  \"module\": \"./dist/index.mjs\",\n  \"types\": \"./dist/index.d.ts\",\n  \"exports\": {\n    \".\": {\n      \"import\": \"./dist/index.mjs\",\n      \"require\": \"./dist/index.cjs\",\n      \"types\": \"./dist/index.d.ts\"\n    },\n    \"./styles.css\": \"./dist/styles.css\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"步骤-4-添加-workspace-引用\">步骤 4：添加 workspace 引用\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 方法一：手动编辑 package.json 添加 workspace:*\n\n# 方法二：命令行安装\npnpm add @tutorial/types --filter @tutorial/my-new-package --workspace\n\n# 或简写\npnpm -F @tutorial/my-new-package add @tutorial/types --workspace\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"跨包依赖声明\">跨包依赖声明\u003c/h2>\n\u003ch3 id=\"依赖类型对比\">依赖类型对比\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>依赖类型\u003c/th>\u003cth>安装位置\u003c/th>\u003cth>用途\u003c/th>\u003cth>示例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>dependencies\u003c/code>\u003c/td>\u003ctd>生产依赖\u003c/td>\u003ctd>运行时必需\u003c/td>\u003ctd>\u003ccode>react\u003c/code>、\u003ccode>lodash\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>devDependencies\u003c/code>\u003c/td>\u003ctd>开发依赖\u003c/td>\u003ctd>构建/测试工具\u003c/td>\u003ctd>\u003ccode>typescript\u003c/code>、\u003ccode>vitest\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>peerDependencies\u003c/code>\u003c/td>\u003ctd>宿主提供\u003c/td>\u003ctd>需宿主环境提供\u003c/td>\u003ctd>\u003ccode>react\u003c/code>、\u003ccode>react-dom\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>optionalDependencies\u003c/code>\u003c/td>\u003ctd>可选依赖\u003c/td>\u003ctd>失败不影响安装\u003c/td>\u003ctd>\u003ccode>fsevents\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bundledDependencies\u003c/code>\u003c/td>\u003ctd>打包依赖\u003c/td>\u003ctd>随包一起发布\u003c/td>\u003ctd>较少使用\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"workspace-协议使用场景\">workspace: 协议使用场景\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// package.json\n{\n  \"dependencies\": {\n    // 始终链接到本地最新版本（开发推荐）\n    \"@tutorial/types\": \"workspace:*\",\n\n    // 链接到本地版本，遵循语义化版本\n    \"@tutorial/utils\": \"workspace:^1.0.0\",\n\n    // 第三方依赖使用正常版本号\n    \"lodash\": \"^4.17.21\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"命令行安装-vs-手动编辑\">命令行安装 vs 手动编辑\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 安装第三方依赖到某个包\npnpm add lodash --filter @tutorial/web\n\n# 安装 workspace 包（自动添加 workspace:*）\npnpm add @tutorial/types --filter @tutorial/web --workspace\n\n# 安装 devDependency\npnpm add -D typescript --filter @tutorial/web\n\n# 安装到根 package.json（共享工具）\npnpm add -Dw @changesets/cli\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"peerdependencies-显式声明\">peerDependencies 显式声明\u003c/h2>\n\u003ch3 id=\"为什么需要-peerdependencies\">为什么需要 peerDependencies？\u003c/h3>\n\u003cp>场景：UI 组件库 \u003ccode>@tutorial/ui\u003c/code> 依赖 React，但不应将 React 打包到组件库中（否则应用会有多个 React 实例）。\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// packages/ui/package.json\n{\n  \"peerDependencies\": {\n    \"react\": \"&gt;=18.0.0\",\n    \"react-dom\": \"&gt;=18.0.0\"\n  },\n  \"peerDependenciesMeta\": {\n    \"react-dom\": {\n      \"optional\": true // react-dom 是可选的 peer 依赖\n    }\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\".npmrc-配置控制\">.npmrc 配置控制\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">ini\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .npmrc\n\n# strict-peer-dependencies: 严格检查 peer 版本\n# true: 版本不匹配直接报错（推荐开发期开启）\n# false: 仅警告，不阻止安装（默认）\nstrict-peer-dependencies=true\n\n# auto-install-peers: 自动安装缺失的 peer 依赖\n# true: 自动安装（默认，解决 React 库常见警告）\n# false: 不自动安装，需手动添加\nauto-install-peers=true\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"peer-依赖冲突解决\">peer 依赖冲突解决\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>错误示例：\n├─ @tutorial/ui\n│   └─ peer react@&gt;=18.0.0\n└─ @tutorial/legacy-ui\n    └─ peer react@^17.0.0\n\n冲突：应用需要同时安装 react@17 和 react@18（不可能）\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>解决方案\u003c/strong>：\u003c/p>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// 根 package.json 统一声明\n{\n  \"dependencies\": {\n    \"react\": \"^18.2.0\",\n    \"react-dom\": \"^18.2.0\"\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">ini\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># .npmrc 降级冲突为警告\nstrict-peer-dependencies=false\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"依赖版本冲突解决\">依赖版本冲突解决\u003c/h2>\n\u003ch3 id=\"场景分析\">场景分析\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>packages/web/package.json:\n  \"lodash\": \"^4.17.21\"\n\npackages/api/package.json:\n  \"lodash\": \"^4.17.15\"\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>pnpm 的处理方式\u003c/strong>：\u003c/p>\n\u003cul>\u003cli>解析满足两个约束的最高版本：\u003ccode>4.17.21\u003c/code>\u003c/li>\u003cli>两个包共享同一个 \u003ccode>lodash@4.17.21\u003c/code> 实例（硬链接）\u003c/li>\u003c/ul>\n\u003ch3 id=\"冲突类型与解决方案\">冲突类型与解决方案\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>冲突类型\u003c/th>\u003cth>表现\u003c/th>\u003cth>解决方案\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>兼容版本冲突\u003c/td>\u003ctd>\u003ccode>^4.17.15\u003c/code> vs \u003ccode>^4.17.21\u003c/code>\u003c/td>\u003ctd>pnpm 自动解析到兼容的最高版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>主版本冲突\u003c/td>\u003ctd>\u003ccode>^3.0.0\u003c/code> vs \u003ccode>^4.0.0\u003c/code>\u003c/td>\u003ctd>使用 \u003ccode>pnpm.overrides\u003c/code> 统一版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>传递依赖冲突\u003c/td>\u003ctd>A -&gt; lodash@3, B -&gt; lodash@4\u003c/td>\u003ctd>显式声明 overrides\u003c/td>\u003c/tr>\u003ctr>\u003ctd>幽灵依赖\u003c/td>\u003ctd>隐式依赖未声明\u003c/td>\u003ctd>开启 \u003ccode>strict-peer-dependencies\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"使用-pnpm.overrides-强制统一版本\">使用 pnpm.overrides 强制统一版本\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// package.json\n{\n  \"pnpm\": {\n    \"overrides\": {\n      // 强制所有 lodash 依赖使用 4.17.21\n      \"lodash\": \"4.17.21\",\n\n      // 仅覆盖特定包的传递依赖\n      \"@some/package&gt;lodash\": \"4.17.21\",\n\n      // 使用本地 workspace 包覆盖 registry 版本\n      \"@tutorial/types\": \"workspace:*\"\n    }\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"使用-catalog-统一管理版本-pnpm-9.x+\">使用 catalog 统一管理版本（pnpm 9.x+）\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">yaml\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># pnpm-workspace.yaml\ncatalog:\n  \"typescript\": \"^5.3.3\"\n  \"react\": \"^18.2.0\"\n  \"react-dom\": \"^18.2.0\"\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// packages/ui/package.json\n{\n  \"dependencies\": {\n    \"react\": \"catalog:\" // 自动使用 workspace catalog 中的版本\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"包间循环依赖检测\">包间循环依赖检测\u003c/h2>\n\u003ch3 id=\"什么是循环依赖\">什么是循环依赖？\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">text\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>@tutorial/ui -&gt; @tutorial/utils\n@tutorial/utils -&gt; @tutorial/types\n@tutorial/types -&gt; @tutorial/ui  ← 循环！\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"检测方法\">检测方法\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 使用 pnpm 内置命令检查\npnpm recursive list --depth=10\n\n# 或使用 madge 工具\nnpx madge --circular packages/\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"解决方案\">解决方案\u003c/h3>\n\u003col>\u003cli>\u003cstrong>提取公共依赖\u003c/strong>：将循环依赖提取为新的独立包\u003c/li>\u003cli>\u003cstrong>重构代码\u003c/strong>：通过依赖注入或事件机制解耦\u003c/li>\u003cli>\u003cstrong>合并包\u003c/strong>：如果循环依赖说明包拆分过细，考虑合并\u003c/li>\u003c/ol>\n\u003chr>\n\u003ch2 id=\"最佳实践\">最佳实践\u003c/h2>\n\u003ch3 id=\"1.-最小化依赖原则\">1. 最小化依赖原则\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// 反例：引入不必要的重型库\n{\n  \"dependencies\": {\n    \"lodash\": \"^4.17.21\" // 如果只用了 _.debounce，考虑自己实现\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"2.-明确区分-dependencies-与-devdependencies\">2. 明确区分 dependencies 与 devDependencies\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">json\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode>// 库（packages/*）\n{\n  \"dependencies\": {\n    \"clsx\": \"^2.1.0\" // 运行时必需\n  },\n  \"devDependencies\": {\n    \"typescript\": \"^5.3.3\" // 构建时才需要\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3 id=\"3.-使用-workspace-协议时保持版本一致性\">3. 使用 workspace 协议时保持版本一致性\u003c/h3>\n\u003cdiv class=\"codeblock\">\u003cdiv class=\"codeblock-head\">\u003cspan class=\"codeblock-lang\">bash\u003c/span>\u003cbutton class=\"codeblock-copy\" type=\"button\">复制\u003c/button>\u003c/div>\u003cpre>\u003ccode># 发布前检查 workspace 依赖是否已正确替换\npnpm publish --dry-run\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch2 id=\"下一步\">下一步\u003c/h2>\n\u003cp>包管理配置完成后，请继续阅读 \u003ca data-goto=\"d04\">04-dependency-sharing.md\u003c/a>，深入理解依赖共享机制与 hoisting 控制策略。\u003c/p>"},{"id":"d04","file":"docs/04-dependency-sharing.md","group":"ref","no":"参 4","short":"依赖共享与 hoisting 控制","title":"依赖共享与 hoisting 控制","tagline":"Store/硬链接原理、phantom dependency 防线与三档 hoist 策略","level":"进阶","minutes":30,"html":"\u003cblockquote>\u003cp>本章详解 pnpm 的内容寻址存储机制、依赖共享原理、hoisting 行为控制及 node_modules 结构可视化。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>存储机制图解\u003c/strong>：\u003cfigure class=\"comic-figure\" data-svg=\"pnpm-architecture\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind diagram\">图解\u003c/span>\u003cspan class=\"cf-caption\">pnpm 三层架构\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\u003c/p>\n\u003cp>\u003cstrong>配套漫画\u003c/strong>：\u003cfigure class=\"comic-figure\" data-svg=\"comic-03-install-journey\">\u003cdiv class=\"cf-head\">\u003cspan class=\"cf-kind comic\">漫画\u003c/span>\u003cspan class=\"cf-caption\">第 3 话 · 依赖安装之旅\u003c/span>\u003c/div>\u003cdiv class=\"cf-stage\">\u003cdiv class=\"cf-loading\">正在展开漫画…\u003c/div>\u003c/div>\u003c/figure>\u003c/p>\n\u003ch2 id=\"目录\">目录\u003c/h2>\n\u003cul>\u003cli>\u003ca data-anchor=\"pnpm-存储机制\">p
