<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660">
  <style>
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ttl { font-size: 22px; font-weight: bold; fill: #2D3748; }
    .cap { font-size: 12px; fill: #2D3748; }
    .bub { font-size: 12.5px; fill: #2D3748; }
    .panel { fill: #FFFFFF; stroke: #2D3748; stroke-width: 3; }
    .capbox { fill: #E9D8FD; stroke: #2D3748; stroke-width: 1.5; }
    .bubble { fill: #FFFFFF; stroke: #2D3748; stroke-width: 2; }
    .num { fill: #2D3748; }
    .numt { fill: #FFFFFF; font-size: 12px; font-weight: bold; }
    .mono { font-family: "SF Mono", Menlo, monospace; }
  </style>

  <rect width="840" height="660" fill="#F5F0FA"/>
  <text x="420" y="42" text-anchor="middle" class="ttl">第 4 话 · 构建车间 —— 多包并行与缓存魔法</text>

  <!-- Panel 1 -->
  <g>
    <rect x="20" y="70" width="392" height="252" rx="14" class="panel"/>
    <circle cx="48" cy="94" r="13" class="num"/><text x="48" y="99" text-anchor="middle" class="numt">1</text>
    <rect x="70" y="80" width="230" height="26" rx="4" class="capbox"/>
    <text x="185" y="97" text-anchor="middle" class="cap">清晨，包们在构建车间门口排队</text>

    <!-- 排队的三个包 -->
    <g transform="translate(100,215)">
      <rect x="-30" y="-24" width="60" height="48" rx="8" fill="#90CDF4" stroke="#2D3748" stroke-width="3"/>
      <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">types</text>
      <circle cx="-10" cy="-30" r="2.5" fill="#2D3748"/><circle cx="10" cy="-30" r="2.5" fill="#2D3748"/>
    </g>
    <g transform="translate(200,225)">
      <rect x="-30" y="-24" width="60" height="48" rx="8" fill="#9AE6B4" stroke="#2D3748" stroke-width="3"/>
      <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#2D3748">utils</text>
      <circle cx="-10" cy="-30" r="2.5" fill="#2D3748"/><circle cx="10" cy="-30" r="2.5" fill="#2D3748"/>
    </g>
    <g transform="translate(300,235)">
      <rect x="-30" y="-24" width="60" height="48" rx="8" fill="#FBB6CE" stroke="#2D3748" stroke-width="3"/>
      <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#2D3748">ui</text>
      <circle cx="-10" cy="-30" r="2.5" fill="#2D3748"/><circle cx="10" cy="-30" r="2.5" fill="#2D3748"/>
    </g>
    <!-- 车间大门 -->
    <rect x="330" y="150" width="70" height="140" rx="8" fill="#A0AEC0" stroke="#2D3748" stroke-width="3"/>
    <text x="365" y="225" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" transform="rotate(-90 365 225)">构建车间</text>
  </g>

  <!-- Panel 2 -->
  <g>
    <rect x="428" y="70" width="392" height="252" rx="14" class="panel"/>
    <circle cx="456" cy="94" r="13" class="num"/><text x="456" y="99" text-anchor="middle" class="numt">2</text>
    <rect x="478" y="80" width="230" height="26" rx="4" class="capbox"/>
    <text x="593" y="97" text-anchor="middle" class="cap">调度员：按拓扑排序，依赖先行</text>

    <!-- 传送带 -->
    <g transform="translate(624,215)">
      <rect x="-170" y="30" width="340" height="14" rx="7" fill="#CBD5E0" stroke="#2D3748" stroke-width="2"/>
      <circle cx="-150" cy="37" r="4" fill="#2D3748"/><circle cx="-50" cy="37" r="4" fill="#2D3748"/>
      <circle cx="50" cy="37" r="4" fill="#2D3748"/><circle cx="150" cy="37" r="4" fill="#2D3748"/>
      <rect x="-160" y="-14" width="56" height="40" rx="8" fill="#90CDF4" stroke="#2D3748" stroke-width="3"/>
      <text x="-132" y="10" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">types</text>
      <rect x="-70" y="-14" width="56" height="40" rx="8" fill="#9AE6B4" stroke="#2D3748" stroke-width="3"/>
      <text x="-42" y="10" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">utils</text>
      <rect x="20" y="-14" width="56" height="40" rx="8" fill="#FBB6CE" stroke="#2D3748" stroke-width="3"/>
      <text x="48" y="10" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">ui</text>
      <rect x="110" y="-14" width="56" height="40" rx="8" fill="#F6E05E" stroke="#2D3748" stroke-width="3"/>
      <text x="138" y="10" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">apps</text>
    </g>
    <rect x="470" y="140" width="270" height="34" rx="12" class="bubble"/>
    <polygon points="510,174 523,174 515,188" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="605" y="161" text-anchor="middle" class="bub">types → utils → ui → apps，谁也插不了队</text>
  </g>

  <!-- Panel 3 -->
  <g>
    <rect x="20" y="340" width="392" height="252" rx="14" class="panel"/>
    <circle cx="48" cy="364" r="13" class="num"/><text x="48" y="369" text-anchor="middle" class="numt">3</text>
    <rect x="70" y="350" width="230" height="26" rx="4" class="capbox"/>
    <text x="185" y="367" text-anchor="middle" class="cap">并行开关打开：pnpm -r --parallel</text>

    <!-- 4 条并行流水线 -->
    <g transform="translate(210,475)">
      <rect x="-150" y="-66" width="300" height="24" rx="6" fill="#BEE3F8" stroke="#2D3748" stroke-width="2"/>
      <rect x="-150" y="-66" width="240" height="24" rx="6" fill="#63B3ED"/>
      <text x="-140" y="-50" class="mono" font-size="10" fill="#fff">types  ████████░░ 80%</text>
      <rect x="-150" y="-30" width="300" height="24" rx="6" fill="#C6F6D5" stroke="#2D3748" stroke-width="2"/>
      <rect x="-150" y="-30" width="180" height="24" rx="6" fill="#68D391"/>
      <text x="-140" y="-14" class="mono" font-size="10" fill="#2D3748">utils  ██████░░░░ 60%</text>
      <rect x="-150" y="6" width="300" height="24" rx="6" fill="#FED7E2" stroke="#2D3748" stroke-width="2"/>
      <rect x="-150" y="6" width="120" height="24" rx="6" fill="#F687B3"/>
      <text x="-140" y="22" class="mono" font-size="10" fill="#2D3748">ui     ████░░░░░░ 40%</text>
      <rect x="-150" y="42" width="300" height="24" rx="6" fill="#FEEBC8" stroke="#2D3748" stroke-width="2"/>
      <rect x="-150" y="42" width="90" height="24" rx="6" fill="#ED8936"/>
      <text x="-140" y="58" class="mono" font-size="10" fill="#2D3748">apps   ███░░░░░░░ 30%</text>
    </g>
    <rect x="55" y="395" width="240" height="34" rx="12" class="bubble"/>
    <polygon points="95,429 108,429 100,443" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="175" y="416" text-anchor="middle" class="bub">独立的包同时构建，互不等待！</text>
  </g>

  <!-- Panel 4 -->
  <g>
    <rect x="428" y="340" width="392" height="252" rx="14" class="panel"/>
    <circle cx="456" cy="364" r="13" class="num"/><text x="456" y="369" text-anchor="middle" class="numt">4</text>
    <rect x="478" y="350" width="230" height="26" rx="4" class="capbox"/>
    <text x="593" y="367" text-anchor="middle" class="cap">缓存魔法：没改的包直接出货</text>

    <!-- 缓存机器人 -->
    <g transform="translate(540,470)">
      <rect x="-34" y="-40" width="68" height="70" rx="12" fill="#90CDF4" stroke="#2D3748" stroke-width="3"/>
      <circle cx="-12" cy="-18" r="6" fill="#fff" stroke="#2D3748" stroke-width="2"/>
      <circle cx="12" cy="-18" r="6" fill="#fff" stroke="#2D3748" stroke-width="2"/>
      <circle cx="-12" cy="-18" r="2.5" fill="#2D3748"/><circle cx="12" cy="-18" r="2.5" fill="#2D3748"/>
      <rect x="-14" y="-2" width="28" height="10" rx="5" fill="#2D3748"/>
      <path d="M 0 -40 L 0 -58 M -8 -52 L 8 -52" stroke="#2D3748" stroke-width="3"/>
      <circle cx="0" cy="-60" r="5" fill="#F56565"/>
    </g>
    <!-- 出货口 -->
    <g transform="translate(690,470)">
      <rect x="-70" y="-46" width="140" height="92" rx="10" fill="#68D391" stroke="#2D3748" stroke-width="3"/>
      <text x="0" y="-24" text-anchor="middle" font-size="12" font-weight="bold" fill="#2D3748">dist/ 出货口</text>
      <text x="0" y="0" text-anchor="middle" class="mono" font-size="10" fill="#2D3748">cache: HIT ✅</text>
      <text x="0" y="20" text-anchor="middle" class="mono" font-size="10" fill="#2D3748">耗时: 12ms</text>
    </g>
    <path d="M 580 470 L 615 470" stroke="#2D3748" stroke-width="3" marker-end="url(#ah4)"/>
    <defs><marker id="ah4" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#2D3748"/></marker></defs>

    <rect x="455" y="395" width="280" height="34" rx="12" class="bubble"/>
    <polygon points="495,429 508,429 500,443" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="595" y="416" text-anchor="middle" class="bub">文件哈希没变？整包跳过，毫秒出货！</text>
    <rect x="560" y="540" width="220" height="30" rx="10" class="bubble"/>
    <text x="670" y="560" text-anchor="middle" class="bub">Turbo/tsc --build 都是这原理</text>
  </g>

  <text x="420" y="640" text-anchor="middle" font-size="12" fill="#718096">车间守则：拓扑排序保底、并行构建提速、缓存命中免工</text>
</svg>
