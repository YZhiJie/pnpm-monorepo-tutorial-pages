<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780">
  <style>
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ttl { font-size: 22px; font-weight: bold; fill: #2D3748; }
    .lane { font-size: 13px; font-weight: bold; fill: #2D3748; }
    .box { font-size: 12px; font-weight: bold; fill: #2D3748; }
    .desc { font-size: 10.5px; fill: #4A5568; }
    .mono { font-family: "SF Mono", Menlo, monospace; font-size: 10.5px; fill: #2B6CB0; }
    .arrow { stroke: #2D3748; stroke-width: 2.5; fill: none; marker-end: url(#ar2); }
    .loop { stroke: #ED8936; stroke-width: 2.5; fill: none; stroke-dasharray: 7,5; marker-end: url(#ar3); }
  </style>
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#2D3748"/></marker>
    <marker id="ar3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ED8936"/></marker>
  </defs>

  <rect width="880" height="780" fill="#F7FAFC"/>
  <text x="440" y="40" text-anchor="middle" class="ttl">Monorepo 开发工作流示意图</text>
  <text x="440" y="64" text-anchor="middle" class="desc">本地开发 → 提交 → CI 校验 → 自动发布 · 对应 docs/06-versioning.md 与 docs/07-ci-cd.md</text>

  <!-- 泳道背景 -->
  <rect x="40" y="90" width="800" height="150" rx="12" fill="#EBF4FA"/>
  <rect x="40" y="260" width="800" height="150" rx="12" fill="#F0FFF4"/>
  <rect x="40" y="430" width="800" height="150" rx="12" fill="#FAF5FF"/>
  <rect x="40" y="600" width="800" height="140" rx="12" fill="#FFFAF0"/>
  <text x="60" y="116" class="lane">① 本地开发</text>
  <text x="60" y="286" class="lane">② 提交变更</text>
  <text x="60" y="456" class="lane">③ CI 校验</text>
  <text x="60" y="626" class="lane">④ 自动发布</text>

  <!-- 泳道1：本地开发 -->
  <g>
    <rect x="70" y="140" width="150" height="70" rx="10" fill="#fff" stroke="#63B3ED" stroke-width="2.5"/>
    <text x="145" y="168" text-anchor="middle" class="box">改代码</text>
    <text x="145" y="188" text-anchor="middle" class="mono">apps/web + ui</text>
    <rect x="280" y="140" width="180" height="70" rx="10" fill="#fff" stroke="#63B3ED" stroke-width="2.5"/>
    <text x="370" y="162" text-anchor="middle" class="box">本地联调</text>
    <text x="370" y="182" text-anchor="middle" class="mono">pnpm --filter web dev</text>
    <text x="370" y="198" text-anchor="middle" class="desc">改动实时生效，无需发包</text>
    <rect x="520" y="140" width="170" height="70" rx="10" fill="#fff" stroke="#63B3ED" stroke-width="2.5"/>
    <text x="605" y="168" text-anchor="middle" class="box">跑测试</text>
    <text x="605" y="188" text-anchor="middle" class="mono">pnpm -r test</text>
  </g>
  <path d="M 220 175 L 280 175" class="arrow"/>
  <path d="M 460 175 L 520 175" class="arrow"/>
  <path d="M 605 210 L 605 236 L 145 236 L 145 210" class="loop"/>
  <text x="330" y="252" text-anchor="middle" font-size="10.5" fill="#ED8936">测试不过 → 回炉重造</text>

  <!-- 泳道2：提交变更 -->
  <g>
    <rect x="70" y="310" width="180" height="70" rx="10" fill="#fff" stroke="#68D391" stroke-width="2.5"/>
    <text x="160" y="338" text-anchor="middle" class="box">写变更信</text>
    <text x="160" y="358" text-anchor="middle" class="mono">pnpm changeset</text>
    <rect x="310" y="310" width="170" height="70" rx="10" fill="#fff" stroke="#68D391" stroke-width="2.5"/>
    <text x="395" y="332" text-anchor="middle" class="box">规范提交</text>
    <text x="395" y="352" text-anchor="middle" class="mono">feat(ui): add loading</text>
    <text x="395" y="368" text-anchor="middle" class="desc">Conventional Commits</text>
    <rect x="540" y="310" width="180" height="70" rx="10" fill="#fff" stroke="#68D391" stroke-width="2.5"/>
    <text x="630" y="338" text-anchor="middle" class="box">推送 + 开 PR</text>
    <text x="630" y="358" text-anchor="middle" class="mono">git push → PR</text>
  </g>
  <path d="M 605 210 L 605 345 L 720 345" class="arrow" marker-end="none"/>
  <path d="M 720 345 L 720 345" class="arrow"/>
  <path d="M 160 380 L 160 345" class="arrow" transform="rotate(180 160 362)"/>
  <path d="M 250 345 L 310 345" class="arrow"/>
  <path d="M 480 345 L 540 345" class="arrow"/>

  <!-- 泳道3：CI 校验 -->
  <g>
    <rect x="70" y="480" width="150" height="70" rx="10" fill="#fff" stroke="#B794F4" stroke-width="2.5"/>
    <text x="145" y="505" text-anchor="middle" class="box">Lint + 类型</text>
    <text x="145" y="525" text-anchor="middle" class="mono">pnpm -r lint</text>
    <rect x="250" y="480" width="150" height="70" rx="10" fill="#fff" stroke="#B794F4" stroke-width="2.5"/>
    <text x="325" y="505" text-anchor="middle" class="box">单测</text>
    <text x="325" y="525" text-anchor="middle" class="mono">vitest run</text>
    <rect x="430" y="480" width="150" height="70" rx="10" fill="#fff" stroke="#B794F4" stroke-width="2.5"/>
    <text x="505" y="505" text-anchor="middle" class="box">构建</text>
    <text x="505" y="525" text-anchor="middle" class="mono">pnpm -r build</text>
    <rect x="610" y="480" width="170" height="70" rx="10" fill="#2F855A" stroke="#2D3748" stroke-width="2.5"/>
    <text x="695" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">全绿 → 合并 main</text>
    <text x="695" y="528" text-anchor="middle" font-size="10.5" fill="#C6F6D5">squash merge</text>
  </g>
  <path d="M 630 380 L 630 515 L 220 515" class="arrow" marker-end="none"/>
  <path d="M 220 515 L 250 515" class="arrow"/>
  <path d="M 400 515 L 430 515" class="arrow"/>
  <path d="M 580 515 L 610 515" class="arrow"/>
  <path d="M 505 550 L 505 572 L 145 572 L 145 550" class="loop"/>
  <text x="325" y="568" text-anchor="middle" font-size="10.5" fill="#ED8936">任一环节失败 → PR 打回</text>

  <!-- 泳道4：自动发布 -->
  <g>
    <rect x="70" y="650" width="200" height="70" rx="10" fill="#fff" stroke="#ED8936" stroke-width="2.5"/>
    <text x="170" y="675" text-anchor="middle" class="box">changesets/action</text>
    <text x="170" y="695" text-anchor="middle" class="desc">自动开 Release PR</text>
    <rect x="330" y="650" width="200" height="70" rx="10" fill="#fff" stroke="#ED8936" stroke-width="2.5"/>
    <text x="430" y="675" text-anchor="middle" class="box">合并 → 自动发版</text>
    <text x="430" y="695" text-anchor="middle" class="mono">bump + CHANGELOG + publish</text>
    <rect x="590" y="650" width="190" height="70" rx="10" fill="#fff" stroke="#ED8936" stroke-width="2.5"/>
    <text x="685" y="675" text-anchor="middle" class="box">打 tag + 部署</text>
    <text x="685" y="695" text-anchor="middle" class="mono">v1.1.0 → staging/prod</text>
  </g>
  <path d="M 695 550 L 695 685 L 270 685" class="arrow" marker-end="none"/>
  <path d="M 270 685 L 270 685" class="arrow"/>
  <path d="M 270 685 L 330 685" class="arrow" transform="translate(0,0)"/>
  <path d="M 530 685 L 590 685" class="arrow"/>

  <text x="440" y="766" text-anchor="middle" class="desc">关键设计：本地 workspace 链接免发包联调 · changeset 把「发版决策」左移到开发时 · CI 卡住红线 · 发布全自动</text>
</svg>
