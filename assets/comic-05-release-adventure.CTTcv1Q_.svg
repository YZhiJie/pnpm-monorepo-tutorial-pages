<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660">
  <style>
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ttl { font-size: 22px; font-weight: bold; fill: #2D3748; }
    .cap { font-size: 12px; fill: #2D3748; }
    .bub { font-size: 12.5px; fill: #2D3748; }
    .panel { fill: #FFFFFF; stroke: #2D3748; stroke-width: 3; }
    .capbox { fill: #FED7D7; stroke: #2D3748; stroke-width: 1.5; }
    .bubble { fill: #FFFFFF; stroke: #2D3748; stroke-width: 2; }
    .num { fill: #2D3748; }
    .numt { fill: #FFFFFF; font-size: 12px; font-weight: bold; }
    .mono { font-family: "SF Mono", Menlo, monospace; }
  </style>

  <rect width="840" height="660" fill="#FAF0F0"/>
  <text x="420" y="42" text-anchor="middle" class="ttl">第 5 话 · 发布大冒险 —— Changesets 远征记</text>

  <!-- Panel 1 -->
  <g>
    <rect x="20" y="70" width="392" height="252" rx="14" class="panel"/>
    <circle cx="48" cy="94" r="13" class="num"/><text x="48" y="99" text-anchor="middle" class="numt">1</text>
    <rect x="70" y="80" width="230" height="26" rx="4" class="capbox"/>
    <text x="185" y="97" text-anchor="middle" class="cap">每次改动，小 P 都写一封「变更信」</text>

    <g transform="translate(110,225)">
      <circle r="30" fill="#FFD93D" stroke="#2D3748" stroke-width="3"/>
      <circle cx="-10" cy="-5" r="3.5" fill="#2D3748"/>
      <circle cx="10" cy="-5" r="3.5" fill="#2D3748"/>
      <path d="M -8 10 Q 0 15 8 10" stroke="#2D3748" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- 笔 -->
      <path d="M 30 -8 L 46 -24" stroke="#2D3748" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- 信封 = changeset 文件 -->
    <g transform="translate(260,205)">
      <rect x="-75" y="-48" width="150" height="96" rx="8" fill="#FFFBEA" stroke="#2D3748" stroke-width="3"/>
      <path d="M -75 -48 L 0 8 L 75 -48" fill="none" stroke="#2D3748" stroke-width="2.5"/>
      <text x="0" y="32" text-anchor="middle" class="mono" font-size="10" fill="#2B6CB0">.changeset/xxx.md</text>
      <text x="0" y="46" text-anchor="middle" font-size="9" fill="#718096">'ui': minor</text>
    </g>
    <rect x="50" y="140" width="230" height="34" rx="12" class="bubble"/>
    <polygon points="90,174 103,174 95,188" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="165" y="161" text-anchor="middle" class="bub">$ pnpm changeset：记下影响哪个包</text>
  </g>

  <!-- Panel 2 -->
  <g>
    <rect x="428" y="70" width="392" height="252" rx="14" class="panel"/>
    <circle cx="456" cy="94" r="13" class="num"/><text x="456" y="99" text-anchor="middle" class="numt">2</text>
    <rect x="478" y="80" width="230" height="26" rx="4" class="capbox"/>
    <text x="593" y="97" text-anchor="middle" class="cap">版本计算机：吞信件、算版本</text>

    <!-- 机器 -->
    <g transform="translate(624,215)">
      <rect x="-100" y="-60" width="200" height="120" rx="14" fill="#B794F4" stroke="#2D3748" stroke-width="3"/>
      <rect x="-80" y="-42" width="160" height="40" rx="6" fill="#1A202C"/>
      <text x="0" y="-24" text-anchor="middle" class="mono" font-size="11" fill="#68D391">$ pnpm version</text>
      <text x="0" y="-8" text-anchor="middle" class="mono" font-size="10" fill="#F6E05E">1.0.0 → 1.1.0</text>
      <circle cx="-60" cy="30" r="10" fill="#F56565" stroke="#2D3748" stroke-width="2"/>
      <circle cx="-20" cy="30" r="10" fill="#F6E05E" stroke="#2D3748" stroke-width="2"/>
      <circle cx="20" cy="30" r="10" fill="#68D391" stroke="#2D3748" stroke-width="2"/>
      <path d="M -130 -20 L -100 -20" stroke="#2D3748" stroke-width="3"/>
      <text x="-152" y="-16" font-size="16">✉️</text>
    </g>
    <rect x="460" y="140" width="290" height="34" rx="12" class="bubble"/>
    <polygon points="500,174 513,174 505,188" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="605" y="161" text-anchor="middle" class="bub">major/minor/patch 取最高级，自动 bump</text>
  </g>

  <!-- Panel 3 -->
  <g>
    <rect x="20" y="340" width="392" height="252" rx="14" class="panel"/>
    <circle cx="48" cy="364" r="13" class="num"/><text x="48" y="369" text-anchor="middle" class="numt">3</text>
    <rect x="70" y="350" width="230" height="26" rx="4" class="capbox"/>
    <text x="185" y="367" text-anchor="middle" class="cap">CHANGELOG 自动成书，信件销毁</text>

    <!-- 卷轴 -->
    <g transform="translate(210,470)">
      <rect x="-120" y="-60" width="240" height="120" rx="6" fill="#FFFBEA" stroke="#2D3748" stroke-width="3"/>
      <ellipse cx="-120" cy="0" rx="12" ry="60" fill="#F6E05E" stroke="#2D3748" stroke-width="2.5"/>
      <ellipse cx="120" cy="0" rx="12" ry="60" fill="#F6E05E" stroke="#2D3748" stroke-width="2.5"/>
      <text x="0" y="-38" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D3748">CHANGELOG.md</text>
      <text x="-100" y="-14" class="mono" font-size="10" fill="#2D3748">## 1.1.0</text>
      <text x="-100" y="4" class="mono" font-size="10" fill="#2D3748">- feat: Button loading</text>
      <text x="-100" y="22" class="mono" font-size="10" fill="#2D3748">- fix: deepClone 循环引用</text>
      <text x="-100" y="42" font-size="10" fill="#68D391">✔ 5 封信已合并</text>
    </g>
    <rect x="55" y="540" width="310" height="30" rx="10" class="bubble"/>
    <text x="210" y="560" text-anchor="middle" class="bub">再也不用手写更新日志，也不会漏记</text>
  </g>

  <!-- Panel 4 -->
  <g>
    <rect x="428" y="340" width="392" height="252" rx="14" class="panel"/>
    <circle cx="456" cy="364" r="13" class="num"/><text x="456" y="369" text-anchor="middle" class="numt">4</text>
    <rect x="478" y="350" width="230" height="26" rx="4" class="capbox"/>
    <text x="593" y="367" text-anchor="middle" class="cap">发射！publish 到 registry + 打 tag</text>

    <!-- 火箭 -->
    <g transform="translate(560,460)">
      <path d="M 0 -70 Q 26 -30 26 20 L -26 20 Q -26 -30 0 -70" fill="#F56565" stroke="#2D3748" stroke-width="3"/>
      <circle cx="0" cy="-18" r="12" fill="#BEE3F8" stroke="#2D3748" stroke-width="2.5"/>
      <path d="M -26 20 L -40 46 L -14 34 M 26 20 L 40 46 L 14 34" fill="#ED8936" stroke="#2D3748" stroke-width="2.5"/>
      <path d="M -10 34 Q 0 62 10 34" fill="#F6E05E" stroke="#ED8936" stroke-width="2"/>
    </g>
    <!-- npm 云 + tag -->
    <g transform="translate(700,430)">
      <ellipse cx="0" cy="0" rx="58" ry="26" fill="#E2E8F0" stroke="#2D3748" stroke-width="3"/>
      <ellipse cx="-30" cy="8" rx="30" ry="18" fill="#E2E8F0" stroke="#2D3748" stroke-width="2.5"/>
      <ellipse cx="30" cy="8" rx="30" ry="18" fill="#E2E8F0" stroke="#2D3748" stroke-width="2.5"/>
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#CB3837">npm</text>
    </g>
    <g transform="translate(700,530)">
      <path d="M -60 -14 L 30 -14 L 60 0 L 30 14 L -60 14 Z" fill="#90CDF4" stroke="#2D3748" stroke-width="2.5"/>
      <circle cx="44" cy="0" r="3" fill="#2D3748"/>
      <text x="-10" y="5" text-anchor="middle" class="mono" font-size="11" font-weight="bold" fill="#2D3748">v1.1.0</text>
    </g>

    <rect x="455" y="540" width="330" height="34" rx="12" class="bubble"/>
    <polygon points="495,540 495,540" fill="none"/>
    <text x="620" y="561" text-anchor="middle" class="bub">发布瞬间：workspace:* 自动换成真实版本号！</text>
  </g>

  <text x="420" y="640" text-anchor="middle" font-size="12" fill="#718096">远征路线：changeset 写信 → version 算版本 → CHANGELOG 成书 → publish 发射</text>
</svg>
