<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: bold; fill: #1f2937; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #6b7280; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 8; }
      .app-box { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .pkg-box { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .config-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .link { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dep-link { stroke: #8b5cf6; stroke-width: 2; fill: none; marker-end: url(#arrowhead-purple); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" class="title">Monorepo 架构图</text>
  <text x="400" y="65" text-anchor="middle" class="subtitle">apps 与 packages 的依赖关系可视化</text>

  <!-- 根配置 -->
  <rect x="300" y="100" width="200" height="80" class="config-box" rx="8"/>
  <text x="400" y="125" text-anchor="middle" class="label" font-weight="bold">根配置</text>
  <text x="400" y="145" text-anchor="middle" class="label">package.json</text>
  <text x="400" y="165" text-anchor="middle" class="label">pnpm-workspace.yaml</text>

  <!-- 应用层 -->
  <rect x="100" y="250" width="180" height="100" class="app-box" rx="8"/>
  <text x="190" y="275" text-anchor="middle" class="label" font-weight="bold">apps/web</text>
  <text x="190" y="295" text-anchor="middle" class="label">React 前端</text>
  <text x="190" y="315" text-anchor="middle" class="label">Vite + Tailwind</text>

  <rect x="520" y="250" width="180" height="100" class="app-box" rx="8"/>
  <text x="610" y="275" text-anchor="middle" class="label" font-weight="bold">apps/api</text>
  <text x="610" y="295" text-anchor="middle" class="label">Node.js 服务</text>
  <text x="610" y="315" text-anchor="middle" class="label">Express + TypeScript</text>

  <!-- 共享包层 -->
  <rect x="50" y="450" width="140" height="100" class="pkg-box" rx="8"/>
  <text x="120" y="475" text-anchor="middle" class="label" font-weight="bold">packages/types</text>
  <text x="120" y="495" text-anchor="middle" class="label">TypeScript</text>
  <text x="120" y="515" text-anchor="middle" class="label">类型定义</text>

  <rect x="220" y="450" width="140" height="100" class="pkg-box" rx="8"/>
  <text x="290" y="475" text-anchor="middle" class="label" font-weight="bold">packages/utils</text>
  <text x="290" y="495" text-anchor="middle" class="label">工具函数</text>
  <text x="290" y="515" text-anchor="middle" class="label">debounce/formatDate</text>

  <rect x="390" y="450" width="140" height="100" class="pkg-box" rx="8"/>
  <text x="460" y="475" text-anchor="middle" class="label" font-weight="bold">packages/ui</text>
  <text x="460" y="495" text-anchor="middle" class="label">React 组件</text>
  <text x="460" y="515" text-anchor="middle" class="label">Button/Input/Card</text>

  <rect x="560" y="450" width="140" height="100" class="pkg-box" rx="8"/>
  <text x="630" y="475" text-anchor="middle" class="label" font-weight="bold">packages/config</text>
  <text x="630" y="495" text-anchor="middle" class="label">共享配置</text>
  <text x="630" y="515" text-anchor="middle" class="label">eslint/tsconfig</text>

  <!-- 依赖关系 -->
  <path d="M 190 350 L 120 450" class="dep-link"/>
  <text x="130" y="410" class="label" fill="#8b5cf6">依赖</text>

  <path d="M 190 350 L 290 450" class="dep-link"/>
  <text x="230" y="410" class="label" fill="#8b5cf6">依赖</text>

  <path d="M 190 350 L 460 450" class="dep-link"/>
  <text x="330" y="410" class="label" fill="#8b5cf6">依赖</text>

  <path d="M 610 350 L 290 450" class="dep-link"/>
  <text x="450" y="410" class="label" fill="#8b5cf6">依赖</text>

  <path d="M 610 350 L 120 450" class="dep-link"/>
  <text x="370" y="410" class="label" fill="#8b5cf6">依赖</text>

  <!-- 说明 -->
  <rect x="50" y="580" width="700" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="400" y="605" text-anchor="middle" class="label">
    紫色箭头表示依赖关系：应用层依赖共享包，共享包之间也可相互依赖（如 utils 依赖 types）
  </text>
</svg>
