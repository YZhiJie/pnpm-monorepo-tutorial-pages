<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660">
  <style>
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ttl { font-size: 22px; font-weight: bold; fill: #2D3748; }
    .cap { font-size: 12px; fill: #2D3748; }
    .bub { font-size: 12.5px; fill: #2D3748; }
    .panel { fill: #FFFFFF; stroke: #2D3748; stroke-width: 3; }
    .capbox { fill: #D6F5D6; stroke: #2D3748; stroke-width: 1.5; }
    .bubble { fill: #FFFFFF; stroke: #2D3748; stroke-width: 2; }
    .num { fill: #2D3748; }
    .numt { fill: #FFFFFF; font-size: 12px; font-weight: bold; }
    .code { font-family: "SF Mono", Menlo, monospace; font-size: 11px; fill: #2B6CB0; }
  </style>

  <rect width="840" height="660" fill="#EDF7ED"/>
  <text x="420" y="42" text-anchor="middle" class="ttl">第 2 话 · Workspace 漫游记 —— 划分疆域</text>

  <!-- Panel 1 -->
  <g>
    <rect x="20" y="70" width="392" height="252" rx="14" class="panel"/>
    <circle cx="48" cy="94" r="13" class="num"/><text x="48" y="99" text-anchor="middle" class="numt">1</text>
    <rect x="70" y="80" width="230" height="26" rx="4" class="capbox"/>
    <text x="185" y="97" text-anchor="middle" class="cap">小 P 带着「地图」出发：pnpm-workspace.yaml</text>

    <g transform="translate(110,225)">
      <circle r="30" fill="#FFD93D" stroke="#2D3748" stroke-width="3"/>
      <circle cx="-10" cy="-5" r="3.5" fill="#2D3748"/>
      <circle cx="10" cy="-5" r="3.5" fill="#2D3748"/>
      <path d="M -10 9 Q 0 17 10 9" stroke="#2D3748" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 地图卷轴 -->
    <g transform="translate(250,205)">
      <rect x="-70" y="-46" width="140" height="92" rx="6" fill="#FFFBEA" stroke="#2D3748" stroke-width="3"/>
      <text x="0" y="-26" text-anchor="middle" class="code">packages:</text>
      <text x="0" y="-6" text-anchor="middle" class="code">- 'apps/*'</text>
      <text x="0" y="14" text-anchor="middle" class="code">- 'packages/*'</text>
      <path d="M -55 28 q 20 10 40 0 q 20 -10 40 2" stroke="#E53E3E" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
      <circle cx="52" cy="31" r="4" fill="#E53E3E"/>
    </g>
    <rect x="55" y="140" width="200" height="34" rx="12" class="bubble"/>
    <polygon points="95,174 108,174 100,188" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="155" y="161" text-anchor="middle" class="bub">地图标明：哪些目录是我的疆土</text>
  </g>

  <!-- Panel 2 -->
  <g>
    <rect x="428" y="70" width="392" height="252" rx="14" class="panel"/>
    <circle cx="456" cy="94" r="13" class="num"/><text x="456" y="99" text-anchor="middle" class="numt">2</text>
    <rect x="478" y="80" width="230" height="26" rx="4" class="capbox"/>
    <text x="593" y="97" text-anchor="middle" class="cap">岔路口：认清 apps 与 packages 两兄弟</text>

    <!-- 路牌 -->
    <g transform="translate(620,220)">
      <rect x="-6" y="-40" width="12" height="110" fill="#A0AEC0" stroke="#2D3748" stroke-width="2"/>
      <rect x="-105" y="-60" width="120" height="30" rx="6" fill="#63B3ED" stroke="#2D3748" stroke-width="3"/>
      <text x="-45" y="-40" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">apps/* →</text>
      <rect x="-15" y="-14" width="130" height="30" rx="6" fill="#68D391" stroke="#2D3748" stroke-width="3"/>
      <text x="50" y="6" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">← packages/*</text>
    </g>
    <rect x="470" y="140" width="240" height="34" rx="12" class="bubble"/>
    <polygon points="510,174 523,174 515,188" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="590" y="161" text-anchor="middle" class="bub">apps 能独立跑；packages 被复用</text>
    <!-- 思考的小P -->
    <g transform="translate(500,255)">
      <circle r="26" fill="#FFD93D" stroke="#2D3748" stroke-width="3"/>
      <circle cx="-9" cy="-4" r="3" fill="#2D3748"/>
      <circle cx="9" cy="-4" r="3" fill="#2D3748"/>
      <path d="M -7 10 L 7 10" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>
      <circle cx="34" cy="-30" r="4" fill="#CBD5E0"/><circle cx="44" cy="-44" r="6" fill="#CBD5E0"/>
    </g>
  </g>

  <!-- Panel 3 -->
  <g>
    <rect x="20" y="340" width="392" height="252" rx="14" class="panel"/>
    <circle cx="48" cy="364" r="13" class="num"/><text x="48" y="369" text-anchor="middle" class="numt">3</text>
    <rect x="70" y="350" width="230" height="26" rx="4" class="capbox"/>
    <text x="185" y="367" text-anchor="middle" class="cap">workspace:* 协议搭起互通的桥</text>

    <!-- 两座岛 + 桥 -->
    <g transform="translate(90,470)">
      <ellipse cx="0" cy="40" rx="55" ry="16" fill="#90CDF4" stroke="#2D3748" stroke-width="2.5"/>
      <rect x="-34" y="-6" width="68" height="44" rx="8" fill="#63B3ED" stroke="#2D3748" stroke-width="3"/>
      <text x="0" y="21" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">web 应用</text>
    </g>
    <g transform="translate(330,470)">
      <ellipse cx="0" cy="40" rx="55" ry="16" fill="#9AE6B4" stroke="#2D3748" stroke-width="2.5"/>
      <rect x="-34" y="-6" width="68" height="44" rx="8" fill="#68D391" stroke="#2D3748" stroke-width="3"/>
      <text x="0" y="21" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">ui 组件库</text>
    </g>
    <!-- 桥 -->
    <path d="M 140 470 Q 210 420 280 470" fill="none" stroke="#8B5CF6" stroke-width="8" stroke-linecap="round"/>
    <path d="M 140 470 Q 210 420 280 470" fill="none" stroke="#C4B5FD" stroke-width="3" stroke-dasharray="6,6"/>
    <rect x="138" y="408" width="146" height="26" rx="13" fill="#8B5CF6"/>
    <text x="211" y="426" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">workspace:*</text>

    <rect x="60" y="540" width="300" height="30" rx="10" class="bubble"/>
    <text x="210" y="560" text-anchor="middle" class="bub">声明 workspace:* → 永远链接本地最新版本</text>
  </g>

  <!-- Panel 4 -->
  <g>
    <rect x="428" y="340" width="392" height="252" rx="14" class="panel"/>
    <circle cx="456" cy="364" r="13" class="num"/><text x="456" y="369" text-anchor="middle" class="numt">4</text>
    <rect x="478" y="350" width="230" height="26" rx="4" class="capbox"/>
    <text x="593" y="367" text-anchor="middle" class="cap">全网联通，install 一键完成</text>

    <!-- 小P 胜利姿势 -->
    <g transform="translate(500,470)">
      <circle r="30" fill="#FFD93D" stroke="#2D3748" stroke-width="3"/>
      <circle cx="-10" cy="-5" r="3.5" fill="#2D3748"/>
      <circle cx="10" cy="-5" r="3.5" fill="#2D3748"/>
      <path d="M -11 8 Q 0 18 11 8" stroke="#2D3748" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 26 -10 L 44 -34" stroke="#2D3748" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- 终端框 -->
    <g transform="translate(660,470)">
      <rect x="-100" y="-55" width="200" height="110" rx="8" fill="#1A202C" stroke="#2D3748" stroke-width="3"/>
      <circle cx="-84" cy="-38" r="5" fill="#FC8181"/><circle cx="-68" cy="-38" r="5" fill="#F6E05E"/><circle cx="-52" cy="-38" r="5" fill="#68D391"/>
      <text x="-88" y="-12" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#68D391">$ pnpm install</text>
      <text x="-88" y="10" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#E2E8F0">Progress: 188/188</text>
      <text x="-88" y="32" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#68D391">Done in 1.8s ✨</text>
    </g>
    <rect x="470" y="395" width="200" height="34" rx="12" class="bubble"/>
    <polygon points="510,429 523,429 515,443" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="570" y="416" text-anchor="middle" class="bub">所有包互联，秒级装完！</text>
  </g>

  <text x="420" y="640" text-anchor="middle" font-size="12" fill="#718096">记忆点：pnpm-workspace.yaml 划疆域，apps 跑、packages 复用，workspace:* 搭桥</text>
</svg>
