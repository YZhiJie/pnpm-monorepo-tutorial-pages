<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 820">
  <style>
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ttl { font-size: 22px; font-weight: bold; fill: #2D3748; }
    .step { font-size: 13px; font-weight: bold; fill: #2D3748; }
    .desc { font-size: 11px; fill: #4A5568; }
    .mono { font-family: "SF Mono", Menlo, monospace; font-size: 11px; fill: #2B6CB0; }
    .phase { font-size: 12px; font-weight: bold; fill: #fff; }
    .arrow { stroke: #2D3748; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#2D3748"/>
    </marker>
  </defs>

  <rect width="880" height="820" fill="#F7FAFC"/>
  <text x="440" y="40" text-anchor="middle" class="ttl">pnpm Monorepo 配置步骤流程图</text>
  <text x="440" y="64" text-anchor="middle" class="desc">从零到可运行的 6 步 · 对应 docs/01-setup.md 与 docs/02-workspace.md</text>

  <!-- 阶段标签 -->
  <rect x="60" y="90" width="120" height="28" rx="14" fill="#63B3ED"/><text x="120" y="109" text-anchor="middle" class="phase">阶段一：环境</text>
  <rect x="60" y="290" width="120" height="28" rx="14" fill="#68D391"/><text x="120" y="309" text-anchor="middle" class="phase">阶段二：骨架</text>
  <rect x="60" y="560" width="120" height="28" rx="14" fill="#B794F4"/><text x="120" y="579" text-anchor="middle" class="phase">阶段三：连通</text>

  <!-- Step 1 -->
  <g>
    <rect x="230" y="84" width="480" height="52" rx="10" fill="#fff" stroke="#63B3ED" stroke-width="2.5"/>
    <circle cx="258" cy="110" r="14" fill="#63B3ED"/><text x="258" y="115" text-anchor="middle" class="phase">1</text>
    <text x="282" y="104" class="step">检查 Node.js 版本 ≥ 16.14（建议 18+）</text>
    <text x="282" y="124" class="mono">node -v　→　v18.19.0 ✔</text>
  </g>
  <path d="M 470 136 L 470 160" class="arrow"/>

  <!-- Step 2 -->
  <g>
    <rect x="230" y="162" width="480" height="64" rx="10" fill="#fff" stroke="#63B3ED" stroke-width="2.5"/>
    <circle cx="258" cy="194" r="14" fill="#63B3ED"/><text x="258" y="199" text-anchor="middle" class="phase">2</text>
    <text x="282" y="188" class="step">安装 pnpm（任选其一）</text>
    <text x="282" y="206" class="mono">npm i -g pnpm　|　corepack enable</text>
    <text x="282" y="220" class="desc">版本不一致？用 packageManager 字段 + Corepack 锁定</text>
  </g>
  <path d="M 470 226 L 470 252" class="arrow"/>

  <!-- Step 3 -->
  <g>
    <rect x="230" y="254" width="480" height="66" rx="10" fill="#fff" stroke="#68D391" stroke-width="2.5"/>
    <circle cx="258" cy="287" r="14" fill="#68D391"/><text x="258" y="292" text-anchor="middle" class="phase">3</text>
    <text x="282" y="280" class="step">创建工作区：pnpm-workspace.yaml</text>
    <text x="282" y="298" class="mono">packages: ['apps/*', 'packages/*']</text>
    <text x="282" y="313" class="desc">同时建根 package.json（private: true）+ .npmrc + tsconfig.base.json</text>
  </g>
  <path d="M 470 320 L 470 346" class="arrow"/>

  <!-- Step 4 -->
  <g>
    <rect x="230" y="348" width="480" height="66" rx="10" fill="#fff" stroke="#68D391" stroke-width="2.5"/>
    <circle cx="258" cy="381" r="14" fill="#68D391"/><text x="258" y="386" text-anchor="middle" class="phase">4</text>
    <text x="282" y="374" class="step">按职责建包：apps/ 放应用，packages/ 放共享库</text>
    <text x="282" y="392" class="mono">apps/web　apps/api　packages/{types,utils,ui}</text>
    <text x="282" y="407" class="desc">每个包独立 package.json，name 统一 @scope/ 前缀</text>
  </g>
  <path d="M 470 414 L 470 440" class="arrow"/>

  <!-- Step 5 -->
  <g>
    <rect x="230" y="442" width="480" height="66" rx="10" fill="#fff" stroke="#B794F4" stroke-width="2.5"/>
    <circle cx="258" cy="475" r="14" fill="#B794F4"/><text x="258" y="480" text-anchor="middle" class="phase">5</text>
    <text x="282" y="468" class="step">用 workspace:* 声明包间依赖</text>
    <text x="282" y="486" class="mono">"@tutorial/ui": "workspace:*"</text>
    <text x="282" y="501" class="desc">永远解析本地版本；发布时自动替换为真实版本号</text>
  </g>
  <path d="M 470 508 L 470 534" class="arrow"/>

  <!-- Step 6 -->
  <g>
    <rect x="230" y="536" width="480" height="66" rx="10" fill="#fff" stroke="#B794F4" stroke-width="2.5"/>
    <circle cx="258" cy="569" r="14" fill="#B794F4"/><text x="258" y="574" text-anchor="middle" class="phase">6</text>
    <text x="282" y="562" class="step">根目录 pnpm install 一次装完，验证连通</text>
    <text x="282" y="580" class="mono">pnpm install &amp;&amp; pnpm --filter @tutorial/web dev</text>
    <text x="282" y="595" class="desc">成功标志：web 能 import ui/utils/types，无 E404</text>
  </g>
  <path d="M 470 602 L 470 628" class="arrow"/>

  <!-- 完成 -->
  <rect x="230" y="630" width="480" height="54" rx="27" fill="#2F855A"/>
  <text x="470" y="653" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">✔ Monorepo 就绪</text>
  <text x="470" y="673" text-anchor="middle" font-size="11" fill="#C6F6D5">下一步：接构建（docs/05）· 版本发布（docs/06）· CI/CD（docs/07）</text>

  <!-- 侧边：常见失败分支 -->
  <g>
    <rect x="736" y="254" width="126" height="120" rx="10" fill="#FFF5F5" stroke="#FC8181" stroke-width="2"/>
    <text x="799" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#C53030">常见坑</text>
    <text x="799" y="296" text-anchor="middle" class="desc">E404 → 检查</text>
    <text x="799" y="312" text-anchor="middle" class="desc">workspace 范围</text>
    <text x="799" y="332" text-anchor="middle" class="desc">幽灵依赖 →</text>
    <text x="799" y="348" text-anchor="middle" class="desc">显式声明</text>
    <text x="799" y="366" text-anchor="middle" class="desc">版本漂移 → lock</text>
  </g>
  <path d="M 710 381 L 736 322" stroke="#FC8181" stroke-width="2" stroke-dasharray="5,4" fill="none"/>

  <!-- 底部图例 -->
  <g transform="translate(140,730)">
    <rect x="0" y="-14" width="18" height="18" rx="4" fill="#fff" stroke="#63B3ED" stroke-width="2.5"/><text x="26" y="0" class="desc">环境准备</text>
    <rect x="130" y="-14" width="18" height="18" rx="4" fill="#fff" stroke="#68D391" stroke-width="2.5"/><text x="156" y="0" class="desc">骨架搭建</text>
    <rect x="260" y="-14" width="18" height="18" rx="4" fill="#fff" stroke="#B794F4" stroke-width="2.5"/><text x="286" y="0" class="desc">依赖连通</text>
    <rect x="390" y="-14" width="18" height="18" rx="4" fill="#FFF5F5" stroke="#FC8181" stroke-width="2"/><text x="416" y="0" class="desc">失败排查</text>
  </g>
  <text x="440" y="790" text-anchor="middle" class="desc">全程约 10 分钟 · 每一步失败都先查 pnpm-workspace.yaml 的 packages 匹配范围</text>
</svg>
