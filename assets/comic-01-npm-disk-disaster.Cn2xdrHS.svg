<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660">
  <style>
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ttl { font-size: 22px; font-weight: bold; fill: #2D3748; }
    .cap { font-size: 12px; fill: #2D3748; }
    .bub { font-size: 12.5px; fill: #2D3748; }
    .panel { fill: #FFFFFF; stroke: #2D3748; stroke-width: 3; }
    .capbox { fill: #FFE8A3; stroke: #2D3748; stroke-width: 1.5; }
    .bubble { fill: #FFFFFF; stroke: #2D3748; stroke-width: 2; }
    .num { fill: #2D3748; }
    .numt { fill: #FFFFFF; font-size: 12px; font-weight: bold; }
  </style>

  <rect width="840" height="660" fill="#FFF6E5"/>
  <text x="420" y="42" text-anchor="middle" class="ttl">第 1 话 · 磁盘君的眼泪 —— pnpm 的诞生</text>

  <!-- ===== Panel 1 ===== -->
  <g>
    <rect x="20" y="70" width="392" height="252" rx="14" class="panel"/>
    <circle cx="48" cy="94" r="13" class="num"/><text x="48" y="99" text-anchor="middle" class="numt">1</text>
    <rect x="70" y="80" width="230" height="26" rx="4" class="capbox"/>
    <text x="185" y="97" text-anchor="middle" class="cap">从前，开发者小 P 每次装依赖…</text>

    <!-- 小P -->
    <g transform="translate(110,215)">
      <circle r="30" fill="#FFD93D" stroke="#2D3748" stroke-width="3"/>
      <circle cx="-10" cy="-5" r="3.5" fill="#2D3748"/>
      <circle cx="10" cy="-5" r="3.5" fill="#2D3748"/>
      <path d="M -10 9 Q 0 17 10 9" stroke="#2D3748" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 笔记本电脑 -->
    <g transform="translate(230,190)">
      <rect x="-50" y="-32" width="100" height="64" rx="6" fill="#4A5568" stroke="#2D3748" stroke-width="3"/>
      <rect x="-42" y="-24" width="84" height="48" rx="3" fill="#BEE3F8"/>
      <text x="0" y="-4" text-anchor="middle" font-size="11" fill="#2B6CB0">npm install</text>
      <text x="0" y="14" text-anchor="middle" font-size="11" fill="#2B6CB0">██████░░ 70%</text>
      <rect x="-58" y="32" width="116" height="8" rx="4" fill="#718096" stroke="#2D3748" stroke-width="2"/>
    </g>
    <!-- 气泡 -->
    <rect x="55" y="130" width="180" height="34" rx="12" class="bubble"/>
    <polygon points="95,164 108,164 100,178" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="145" y="151" text-anchor="middle" class="bub">装个依赖，马上就好啦！</text>
  </g>

  <!-- ===== Panel 2 ===== -->
  <g>
    <rect x="428" y="70" width="392" height="252" rx="14" class="panel"/>
    <circle cx="456" cy="94" r="13" class="num"/><text x="456" y="99" text-anchor="middle" class="numt">2</text>
    <rect x="478" y="80" width="230" height="26" rx="4" class="capbox"/>
    <text x="593" y="97" text-anchor="middle" class="cap">node_modules 却越堆越多</text>

    <!-- 磁盘君 -->
    <g transform="translate(560,220)">
      <ellipse cx="0" cy="-34" rx="46" ry="14" fill="#90CDF4" stroke="#2D3748" stroke-width="3"/>
      <path d="M -46 -34 L -46 26 A 46 14 0 0 0 46 26 L 46 -34" fill="#63B3ED" stroke="#2D3748" stroke-width="3"/>
      <path d="M -46 -8 A 46 14 0 0 0 46 -8" fill="none" stroke="#2D3748" stroke-width="2"/>
      <!-- 哭脸 -->
      <circle cx="-13" cy="-38" r="3.5" fill="#2D3748"/>
      <circle cx="13" cy="-38" r="3.5" fill="#2D3748"/>
      <path d="M -10 -26 Q 0 -32 10 -26" stroke="#2D3748" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- 眼泪 -->
      <path d="M -20 -30 q -6 10 0 14 q 6 -4 0 -14" fill="#4FC3F7"/>
    </g>
    <!-- 红色占用条 -->
    <rect x="640" y="238" width="150" height="18" rx="9" fill="#FED7D7" stroke="#2D3748" stroke-width="2"/>
    <rect x="640" y="238" width="141" height="18" rx="9" fill="#FC8181"/>
    <text x="715" y="229" text-anchor="middle" font-size="11" fill="#2D3748">磁盘 94% 已满</text>

    <rect x="620" y="130" width="184" height="34" rx="12" class="bubble"/>
    <polygon points="650,164 663,164 655,178" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="712" y="151" text-anchor="middle" class="bub">每个项目 500MB，要爆啦！</text>
  </g>

  <!-- ===== Panel 3 ===== -->
  <g>
    <rect x="20" y="340" width="392" height="252" rx="14" class="panel"/>
    <circle cx="48" cy="364" r="13" class="num"/><text x="48" y="369" text-anchor="middle" class="numt">3</text>
    <rect x="70" y="350" width="230" height="26" rx="4" class="capbox"/>
    <text x="185" y="367" text-anchor="middle" class="cap">更可怕的是「幽灵依赖」出没</text>

    <!-- 幽灵 -->
    <g transform="translate(115,480)">
      <path d="M -34 30 L -34 -10 A 34 34 0 0 1 34 -10 L 34 30 L 22 20 L 11 30 L 0 20 L -11 30 L -22 20 Z"
            fill="#E9D8FD" stroke="#2D3748" stroke-width="3"/>
      <circle cx="-11" cy="-14" r="4" fill="#2D3748"/>
      <circle cx="11" cy="-14" r="4" fill="#2D3748"/>
      <ellipse cx="0" cy="0" rx="6" ry="8" fill="#2D3748"/>
    </g>
    <rect x="160" y="410" width="210" height="34" rx="12" class="bubble"/>
    <polygon points="200,444 213,444 205,458" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="265" y="431" text-anchor="middle" class="bub">我不在你的 package.json 里哟～</text>

    <!-- 震惊的小P -->
    <g transform="translate(300,500)">
      <circle r="30" fill="#FFD93D" stroke="#2D3748" stroke-width="3"/>
      <circle cx="-10" cy="-6" r="4.5" fill="#2D3748"/>
      <circle cx="10" cy="-6" r="4.5" fill="#2D3748"/>
      <ellipse cx="0" cy="10" rx="6" ry="8" fill="#2D3748"/>
      <text x="42" y="-24" font-size="22" fill="#E53E3E" font-weight="bold">!?</text>
    </g>
    <rect x="60" y="540" width="200" height="30" rx="10" class="bubble"/>
    <text x="160" y="560" text-anchor="middle" class="bub">昨天还能跑，今天咋崩了！？</text>
  </g>

  <!-- ===== Panel 4 ===== -->
  <g>
    <rect x="428" y="340" width="392" height="252" rx="14" class="panel"/>
    <circle cx="456" cy="364" r="13" class="num"/><text x="456" y="369" text-anchor="middle" class="numt">4</text>
    <rect x="478" y="350" width="230" height="26" rx="4" class="capbox"/>
    <text x="593" y="367" text-anchor="middle" class="cap">此刻，pnpm 闪亮登场！</text>

    <!-- 披风小P -->
    <g transform="translate(530,470)">
      <path d="M -20 -18 L -66 44 L -20 30 Z" fill="#F56565" stroke="#2D3748" stroke-width="3"/>
      <circle r="30" fill="#FFD93D" stroke="#2D3748" stroke-width="3"/>
      <circle cx="-10" cy="-5" r="3.5" fill="#2D3748"/>
      <circle cx="10" cy="-5" r="3.5" fill="#2D3748"/>
      <path d="M -11 8 Q 0 18 11 8" stroke="#2D3748" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="-20" y="-42" width="40" height="16" rx="8" fill="#F56565" stroke="#2D3748" stroke-width="2"/>
      <text x="0" y="-30" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">pnpm</text>
    </g>
    <rect x="580" y="400" width="226" height="34" rx="12" class="bubble"/>
    <polygon points="620,434 633,434 625,448" fill="#fff" stroke="#2D3748" stroke-width="2"/>
    <text x="693" y="421" text-anchor="middle" class="bub">全局 Store + 硬链接：同代码只存一份！</text>

    <!-- 开心的磁盘君 -->
    <g transform="translate(700,520)">
      <ellipse cx="0" cy="-30" rx="40" ry="12" fill="#9AE6B4" stroke="#2D3748" stroke-width="3"/>
      <path d="M -40 -30 L -40 24 A 40 12 0 0 0 40 24 L 40 -30" fill="#68D391" stroke="#2D3748" stroke-width="3"/>
      <path d="M -12 -33 Q 0 -40 12 -33" stroke="#2D3748" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M -11 -22 Q 0 -14 11 -22" stroke="#2D3748" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-13" cy="-30" r="3" fill="#2D3748"/>
      <circle cx="13" cy="-30" r="3" fill="#2D3748"/>
    </g>
    <rect x="560" y="545" width="170" height="30" rx="10" class="bubble"/>
    <text x="645" y="565" text-anchor="middle" class="bub">磁盘占用直降 80% ！</text>
  </g>

  <text x="420" y="640" text-anchor="middle" font-size="12" fill="#718096">漫画角色：小 P（开发者）/ 磁盘君（你的硬盘）/ 幽灵（幻影依赖）</text>
</svg>
